<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIF Validator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #FAF6EE;
  --paper:   #F2EBE0;
  --ink:     #2C2825;
  --ink-mid: #6B5E52;
  --ink-lt:  #A8998C;
  --accent:  #8B5E3C;
  --border:  #DDD5C8;
  --e-bg:    #FDF0EE; --e-ink: #B03020; --e-border: #E8B0A8;
  --w-bg:    #FDF8EE; --w-ink: #8A5A00; --w-border: #E8D8A0;
  --ok-bg:   #EFF7EE; --ok-ink: #2A6A2A; --ok-border: #A8D0A8;
  --i-bg:    var(--bg); --i-ink: var(--ink-mid);
}
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--ink); padding:1.5rem 1rem 4rem; min-height:100vh; }

/* ── Header ── */
h1 { font-family:'Fraunces',serif; font-weight:300; font-size:2rem; text-align:center; letter-spacing:-0.01em; }
header { text-align:center; margin-bottom:1.5rem; }
header p { font-size:12.5px; color:var(--ink-mid); margin-top:0.2rem; }

/* ── Drop zone ── */
.drop-zone {
  max-width:680px; margin:0 auto 1.5rem; padding:2.5rem 1.5rem;
  border:2px dashed var(--border); border-radius:10px; background:var(--paper);
  text-align:center; cursor:pointer; transition:border-color .15s, background .15s;
}
.drop-zone:hover, .drop-zone.drag { border-color:var(--accent); background:var(--bg); }
.drop-icon { font-size:2rem; margin-bottom:0.5rem; color:var(--ink-lt); }
.drop-zone p { font-size:13px; color:var(--ink-mid); }
.drop-zone strong { color:var(--accent); }
input[type="file"] { display:none; }

/* ── Results ── */
#output { max-width:860px; margin:0 auto; display:flex; flex-direction:column; gap:1.25rem; }

/* File card */
.file-card { background:var(--paper); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
.file-hdr {
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:0.7rem 1rem; background:var(--bg); border-bottom:1px solid var(--border);
}
.file-name { font-family:'DM Mono',monospace; font-size:13px; font-weight:500; color:var(--ink); }
.file-meta { font-size:11px; color:var(--ink-mid); white-space:nowrap; }

/* Block result */
.block-wrap { padding:0.75rem 1rem; }
.block-wrap + .block-wrap { border-top:1px solid var(--border); }
.block-hdr { display:flex; align-items:center; gap:0.75rem; margin-bottom:0.65rem; }
.block-name { font-family:'DM Mono',monospace; font-size:11.5px; color:var(--ink-mid); }
.sum-pills  { display:flex; gap:4px; flex-wrap:wrap; }
.sum-pill   { font-size:10px; font-weight:600; padding:1px 7px; border-radius:9px; }
.sum-e  { background:var(--e-bg);  color:var(--e-ink);  border:1px solid var(--e-border); }
.sum-w  { background:var(--w-bg);  color:var(--w-ink);  border:1px solid var(--w-border); }
.sum-ok { background:var(--ok-bg); color:var(--ok-ink); border:1px solid var(--ok-border); }

/* Category accordion */
.cats { display:flex; flex-direction:column; gap:3px; }
.cat { border:1px solid var(--border); border-radius:6px; overflow:hidden; background:var(--bg); }
.cat-hdr {
  display:flex; align-items:center; gap:0.5rem; padding:0.45rem 0.75rem;
  cursor:pointer; user-select:none;
  font-size:12.5px; font-weight:500;
}
.cat-hdr:hover { background:var(--paper); }
.cat-lbl { flex:1; }
.cat-badges { display:flex; gap:3px; }
.cat-badge  { font-size:9.5px; font-weight:700; padding:1px 5px; border-radius:6px; }
.cb-e  { background:var(--e-bg);  color:var(--e-ink); }
.cb-w  { background:var(--w-bg);  color:var(--w-ink); }
.cb-ok { background:var(--ok-bg); color:var(--ok-ink); font-weight:500; }
.cat-chev { font-size:10px; color:var(--ink-lt); transition:transform .15s; }
.cat.open .cat-chev { transform:rotate(90deg); }
.cat-body { display:none; padding:0.4rem 0.75rem 0.6rem; border-top:1px solid var(--border); }
.cat.open .cat-body { display:block; }

/* Check items */
.chk { display:flex; align-items:flex-start; gap:0.5rem; padding:3px 0; }
.chk + .chk { border-top:1px solid rgba(0,0,0,.04); }
.chk-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:5px; }
.dot-e  { background:var(--e-ink); }
.dot-w  { background:var(--w-ink); }
.dot-ok { background:var(--ok-ink); }
.dot-i  { background:var(--ink-lt); }
.chk-text { flex:1; min-width:0; }
.chk-msg  { font-size:12.5px; line-height:1.4; }
.chk-det  { font-size:11px; font-family:'DM Mono',monospace; color:var(--ink-mid); margin-top:1px; word-break:break-all; }
.chk-e .chk-msg { color:var(--e-ink); }
.chk-w .chk-msg { color:var(--w-ink); }
.chk-ok .chk-msg { color:var(--ok-ink); }
.chk-i .chk-msg  { color:var(--ink-mid); }

/* Inline error */
.err-banner {
  margin:0.5rem 0; padding:0.6rem 0.9rem; background:var(--e-bg);
  border:1px solid var(--e-border); border-radius:6px;
  font-size:12.5px; color:var(--e-ink);
}

/* Clear button */
.toolbar { max-width:860px; margin:0 auto 0.5rem; display:flex; justify-content:flex-end; }
.btn-clear {
  font-family:'DM Sans',sans-serif; font-size:11.5px; color:var(--ink-mid);
  background:transparent; border:1px solid var(--border); border-radius:4px;
  padding:3px 10px; cursor:pointer;
}
.btn-clear:hover { border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>

<header>
  <h1>CIF Validator</h1>
  <p>Syntax, completeness, cell parameters, symmetry, atom sites, and refinement</p>
</header>

<div class="drop-zone" id="dropZone">
  <div class="drop-icon">⬆</div>
  <p>Drop <strong>CIF file(s)</strong> here, or <strong>click to browse</strong></p>
  <p style="margin-top:4px;font-size:11px;">Offline · no data leaves your browser</p>
</div>
<input type="file" id="fileInput" accept=".cif,.fcf,.hkl" multiple>

<div class="toolbar" id="toolbar" style="display:none;">
  <button class="btn-clear" onclick="clearResults()">Clear</button>
</div>
<div id="output"></div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════
//  CIF TOKENISER
// ═══════════════════════════════════════════════════════
function tokenise(text) {
  const toks = [], lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  let i = 0;
  while (i < lines.length) {
    const ln = i + 1, line = lines[i];
    // Semicolon text block (col 0)
    if (line.startsWith(';')) {
      let s = ''; i++;
      while (i < lines.length) { if (lines[i].startsWith(';')) { i++; break; } s += lines[i]+'\n'; i++; }
      toks.push({t:'V', v:s.trim(), ln}); continue;
    }
    // Inline tokens
    let p = 0;
    while (p < line.length) {
      while (p < line.length && /\s/.test(line[p])) p++;
      if (p >= line.length || line[p] === '#') break;
      const ch = line[p];
      if (ch === "'") {                       // single-quoted
        p++; let s = '';
        while (p < line.length && !(line[p]==="'" && (p+1>=line.length||/\s/.test(line[p+1])))) s+=line[p++];
        if (p < line.length) p++;
        toks.push({t:'V', v:s, ln}); continue;
      }
      if (ch === '"') {                       // double-quoted
        p++; let s = '';
        while (p < line.length && !(line[p]==='"' && (p+1>=line.length||/\s/.test(line[p+1])))) s+=line[p++];
        if (p < line.length) p++;
        toks.push({t:'V', v:s, ln}); continue;
      }
      let w = '';
      while (p < line.length && !/\s/.test(line[p]) && line[p]!=='#') w+=line[p++];
      const wl = w.toLowerCase();
      if (wl.startsWith('data_'))  toks.push({t:'B', v:w.slice(5), ln});
      else if (wl === 'loop_')     toks.push({t:'L', ln});
      else if (w.startsWith('_')) toks.push({t:'K', v:wl, ln});
      else                         toks.push({t:'V', v:w, ln});
    }
    i++;
  }
  return toks;
}

// ═══════════════════════════════════════════════════════
//  CIF PARSER
// ═══════════════════════════════════════════════════════
function parseCIF(toks) {
  const blocks = [];
  let i = 0;
  while (i < toks.length && toks[i].t !== 'B') i++;

  while (i < toks.length) {
    if (toks[i].t !== 'B') { i++; continue; }
    const block = { name:toks[i].v, items:{}, loops:[], errs:[] };
    i++;
    while (i < toks.length && toks[i].t !== 'B') {
      if (toks[i].t === 'K') {
        const key = toks[i].v, ln = toks[i].ln; i++;
        if (block.items[key]) block.errs.push({msg:`Duplicate data name: ${key}`, ln});
        if (i < toks.length && toks[i].t === 'V') { block.items[key] = {v:toks[i].v, ln}; i++; }
        else block.errs.push({msg:`No value for data name ${key}`, ln});
      } else if (toks[i].t === 'L') {
        const ln = toks[i].ln; i++;
        const loop = {keys:[], rows:[], ln};
        while (i < toks.length && toks[i].t === 'K') { loop.keys.push(toks[i].v); i++; }
        if (!loop.keys.length) { block.errs.push({msg:'loop_ with no data names', ln}); continue; }
        const vals = [];
        while (i < toks.length && toks[i].t === 'V') { vals.push(toks[i].v); i++; }
        const n = loop.keys.length;
        if (vals.length % n !== 0)
          block.errs.push({msg:`loop_ at line ${ln}: ${vals.length} value(s) not divisible by ${n} key(s)`, ln});
        for (let r = 0; r+n <= vals.length; r+=n) loop.rows.push(vals.slice(r, r+n));
        block.loops.push(loop);
      } else i++;
    }
    blocks.push(block);
  }
  return blocks;
}

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
// Get first non-trivial value from alternates (checks items then loop col 0)
function gi(block, ...keys) {
  for (const key of keys) {
    const k = key.toLowerCase();
    const it = block.items[k];
    if (it && it.v && it.v !== '.' && it.v !== '?') return it.v;
    for (const loop of block.loops) {
      const idx = loop.keys.indexOf(k);
      if (idx >= 0 && loop.rows.length > 0) {
        const v = loop.rows[0][idx];
        if (v && v !== '.' && v !== '?') return v;
      }
    }
  }
  return null;
}

// Get full loop column
function lc(block, key) {
  const k = key.toLowerCase();
  for (const loop of block.loops) {
    const idx = loop.keys.indexOf(k);
    if (idx >= 0) return loop.rows.map(r => r[idx]);
  }
  return null;
}

// Parse numeric value (strip esd, return float or null)
function pn(s) {
  if (!s || s === '.' || s === '?') return null;
  const n = parseFloat(s.replace(/\([^)]*\)/,''));
  return isNaN(n) ? null : n;
}

function gn(block, ...keys) { const v = gi(block,...keys); return v ? pn(v) : null; }

function calcVol(a,b,c,al,be,ga) {
  const r=Math.PI/180, ca=Math.cos(al*r), cb=Math.cos(be*r), cg=Math.cos(ga*r);
  const v2=1-ca*ca-cb*cb-cg*cg+2*ca*cb*cg;
  return v2>1e-10 ? a*b*c*Math.sqrt(v2) : null;
}

function crystalSystem(n) {
  if (n<=2)   return 'triclinic';
  if (n<=15)  return 'monoclinic';
  if (n<=74)  return 'orthorhombic';
  if (n<=142) return 'tetragonal';
  if (n<=167) return 'trigonal';
  if (n<=194) return 'hexagonal';
  if (n<=230) return 'cubic';
  return null;
}

const VALID_EL = new Set([
  'H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar',
  'K','Ca','Sc','Ti','V','Cr','Mn','Fe','Co','Ni','Cu','Zn','Ga','Ge','As','Se','Br',
  'Kr','Rb','Sr','Y','Zr','Nb','Mo','Tc','Ru','Rh','Pd','Ag','Cd','In','Sn','Sb','Te',
  'I','Xe','Cs','Ba','La','Ce','Pr','Nd','Pm','Sm','Eu','Gd','Tb','Dy','Ho','Er','Tm',
  'Yb','Lu','Hf','Ta','W','Re','Os','Ir','Pt','Au','Hg','Tl','Pb','Bi','Po','At','Rn',
  'Fr','Ra','Ac','Th','Pa','U','Np','Pu','Am','Cm','Bk','Cf','Es','Fm','Md','No','Lr',
  'Rf','Db','Sg','Bh','Hs','Mt','Ds','Rg','Cn','Nh','Fl','Mc','Lv','Ts','Og',
  'D','T'  // deuterium, tritium
]);

function ok(msg, det)    { return {level:'ok',    msg, det}; }
function warn(msg, det)  { return {level:'warn',  msg, det}; }
function err(msg, det)   { return {level:'error', msg, det}; }
function info(msg, det)  { return {level:'info',  msg, det}; }

// ═══════════════════════════════════════════════════════
//  VALIDATORS
// ═══════════════════════════════════════════════════════

function vSyntax(block) {
  const res = [];
  if (!block.errs.length) {
    res.push(ok('No syntax errors detected'));
  } else {
    for (const e of block.errs) res.push(err(e.msg, `Near line ${e.ln}`));
  }
  const nItems = Object.keys(block.items).length;
  const nLoops = block.loops.length;
  res.push(info(`${nItems} key–value pair(s), ${nLoops} loop(s)`));
  return res;
}

function vCompleteness(block) {
  const res = [];
  const req = (label, ...keys) => {
    const v = gi(block,...keys);
    if (v) { const trunc = v.length>50 ? v.slice(0,50)+'…' : v; return ok(`${label}: ${trunc}`); }
    return err(`${label} not found`, keys[0]);
  };
  const rec = (label, ...keys) => {
    const v = gi(block,...keys);
    if (v) { const trunc = v.length>50 ? v.slice(0,50)+'…' : v; return ok(`${label}: ${trunc}`); }
    return warn(`${label} not found (recommended)`, keys[0]);
  };
  res.push(req('Cell length a',    '_cell_length_a'));
  res.push(req('Cell length b',    '_cell_length_b'));
  res.push(req('Cell length c',    '_cell_length_c'));
  res.push(req('Cell angle α',     '_cell_angle_alpha'));
  res.push(req('Cell angle β',     '_cell_angle_beta'));
  res.push(req('Cell angle γ',     '_cell_angle_gamma'));
  res.push(req('Formula units Z',  '_cell_formula_units_z'));
  res.push(req('Space group H-M',  '_symmetry_space_group_name_h-m', '_space_group_name_h-m_alt', '_space_group_name_h-m'));
  res.push(req('Chemical formula', '_chemical_formula_sum'));
  res.push(rec('Formula weight',   '_chemical_formula_weight'));
  res.push(rec('Radiation λ',      '_diffrn_radiation_wavelength'));
  res.push(rec('R factor (R1)',     '_refine_ls_r_factor_gt','_refine_ls_r_factor_obs'));
  res.push(rec('wR factor (wR2)',   '_refine_ls_wr_factor_ref','_refine_ls_wr_factor_obs'));
  res.push(rec('Completeness',     '_diffrn_measured_fraction_theta_max','_diffrn_measured_fraction_theta_full'));
  return res;
}

function vCell(block) {
  const res = [];
  const a=gn(block,'_cell_length_a'), b=gn(block,'_cell_length_b'), c=gn(block,'_cell_length_c');
  const al=gn(block,'_cell_angle_alpha'), be=gn(block,'_cell_angle_beta'), ga=gn(block,'_cell_angle_gamma');
  const vSt=gn(block,'_cell_volume');

  // Lengths
  if (a!==null && b!==null && c!==null) {
    const bad = [['a',a],['b',b],['c',c]].filter(([,v])=>v<=0);
    if (bad.length) res.push(err(`Cell length(s) ≤ 0: ${bad.map(([n,v])=>`${n}=${v}`).join(', ')} Å`));
    else res.push(ok(`Cell lengths a=${a}, b=${b}, c=${c} Å`));
  } else res.push(info('Cell lengths missing — length checks skipped'));

  // Angles
  if (al!==null && be!==null && ga!==null) {
    const bad=[['α',al],['β',be],['γ',ga]].filter(([,v])=>v<=0||v>=180);
    if (bad.length) res.push(err(`Cell angle(s) outside (0°,180°): ${bad.map(([n,v])=>`${n}=${v}°`).join(', ')}`));
    else res.push(ok(`Cell angles α=${al}°, β=${be}°, γ=${ga}°`));
  } else res.push(info('Cell angles missing — angle checks skipped'));

  // Volume consistency
  if (a&&b&&c&&al&&be&&ga) {
    const vCalc = calcVol(a,b,c,al,be,ga);
    if (vSt!==null && vCalc!==null) {
      const diff = Math.abs(vSt-vCalc)/vCalc;
      if (diff>0.01) res.push(warn(`Cell volume mismatch: stated ${vSt.toFixed(1)} Å³, calculated ${vCalc.toFixed(1)} Å³ (${(diff*100).toFixed(1)}% difference)`));
      else res.push(ok(`Cell volume consistent: ${vSt.toFixed(1)} Å³ (calc ${vCalc.toFixed(1)} Å³)`));
    } else if (vCalc!==null) {
      res.push(info(`Calculated cell volume: ${vCalc.toFixed(1)} Å³`));
    }
  }

  // Crystal system metric consistency
  const itStr = gi(block,'_symmetry_int_tables_number','_space_group_it_number');
  const itN   = itStr ? parseInt(itStr) : null;
  if (itN && a&&b&&c&&al&&be&&ga) {
    const sys = crystalSystem(itN);
    const ATOL=0.5, lne=(x,y)=>Math.abs(x-y)/Math.max(x,y)>0.005, ane=(x,y)=>Math.abs(x-y)>ATOL;
    const issues=[];
    if (sys==='cubic') {
      if (lne(a,b)||lne(b,c)) issues.push('a ≠ b ≠ c (cubic requires a = b = c)');
      if (ane(al,90)||ane(be,90)||ane(ga,90)) issues.push('angles not all 90° (cubic requires α = β = γ = 90°)');
    } else if (sys==='tetragonal') {
      if (lne(a,b)) issues.push('a ≠ b (tetragonal requires a = b)');
      if (ane(al,90)||ane(be,90)||ane(ga,90)) issues.push('angles not all 90°');
    } else if (sys==='orthorhombic') {
      if (ane(al,90)||ane(be,90)||ane(ga,90)) issues.push('angles not all 90° (orthorhombic requires α = β = γ = 90°)');
    } else if (sys==='hexagonal') {
      if (lne(a,b)) issues.push('a ≠ b (hexagonal requires a = b)');
      if (ane(al,90)||ane(be,90)) issues.push('α or β ≠ 90°');
      if (ane(ga,120)) issues.push(`γ = ${ga}°, not 120°`);
    } else if (sys==='trigonal') {
      const hexOk=!lne(a,b)&&!ane(al,90)&&!ane(be,90)&&!ane(ga,120);
      const rhomOk=!lne(a,b)&&!lne(b,c)&&!ane(al,be)&&!ane(be,ga)&&ane(al,90);
      if (!hexOk&&!rhomOk) issues.push('Cell not consistent with hexagonal or rhombohedral trigonal setting');
    }
    for (const m of issues) res.push(warn(`Crystal system metric: ${m}`));
    if (!issues.length && sys!=='triclinic'&& sys!=='monoclinic')
      res.push(ok(`Cell metric consistent with ${sys} system (SG ${itN})`));
  }
  return res;
}

function vSymmetry(block) {
  const res = [];
  const itStr = gi(block,'_symmetry_int_tables_number','_space_group_it_number');
  const hm    = gi(block,'_symmetry_space_group_name_h-m','_space_group_name_h-m_alt','_space_group_name_h-m');

  if (itStr) {
    const n = parseInt(itStr);
    if (isNaN(n)||n<1||n>230) res.push(err(`Invalid IT number: ${itStr} (must be 1–230)`));
    else res.push(ok(`Space group IT number ${n} (${crystalSystem(n)})`));
  } else {
    res.push(warn('Space group IT number not found (_symmetry_Int_Tables_number)'));
  }

  if (hm) {
    const latt = hm.trim()[0].toUpperCase();
    if (!/[PAIBCFR]/.test(latt)) res.push(warn(`H-M symbol '${hm}' does not start with a recognised lattice letter`));
    else res.push(ok(`H-M symbol: ${hm}`));
  } else {
    res.push(err('Space group H-M symbol not found'));
  }

  // Lattice vs crystal system cross-check
  if (itStr && hm) {
    const n=parseInt(itStr), sys=crystalSystem(n), latt=hm.trim()[0].toUpperCase();
    if (!isNaN(n)&&sys) {
      if (latt==='R'&&sys!=='trigonal') res.push(warn(`Rhombohedral lattice 'R' unexpected for ${sys} system (IT ${n})`));
      if (sys==='cubic'&&!['P','F','I'].includes(latt)) res.push(warn(`Lattice '${latt}' unusual for cubic system`));
      if (sys==='tetragonal'&&!['P','I'].includes(latt)) res.push(warn(`Lattice '${latt}' unusual for tetragonal system`));
      if (sys==='hexagonal'&&latt!=='P') res.push(warn(`Lattice '${latt}' unusual for hexagonal system (expected P)`));
    }
  }

  // Symmetry operators count
  const symOps = lc(block,'_symmetry_equiv_pos_as_xyz') || lc(block,'_space_group_symop_operation_xyz');
  if (symOps) res.push(info(`${symOps.length} symmetry operation(s) listed`));

  return res;
}

function vAtoms(block) {
  const res = [];
  const labels = lc(block,'_atom_site_label');
  if (!labels) { res.push(warn('No _atom_site_label loop found — atom site data may be absent')); return res; }
  res.push(ok(`${labels.length} atom site(s)`));

  // Fractional coords
  const xs=lc(block,'_atom_site_fract_x'), ys=lc(block,'_atom_site_fract_y'), zs=lc(block,'_atom_site_fract_z');
  if (!xs||!ys||!zs) {
    res.push(err('Fractional coordinate columns missing from _atom_site loop'));
  } else {
    const oor=[];
    for (let i=0;i<labels.length;i++) {
      const x=pn(xs[i]),y=pn(ys[i]),z=pn(zs[i]), bad=[];
      if (x!==null&&(x<-0.5||x>1.5)) bad.push(`x=${xs[i]}`);
      if (y!==null&&(y<-0.5||y>1.5)) bad.push(`y=${ys[i]}`);
      if (z!==null&&(z<-0.5||z>1.5)) bad.push(`z=${zs[i]}`);
      if (bad.length) oor.push(`${labels[i]}: ${bad.join(', ')}`);
    }
    if (oor.length) res.push(warn(`${oor.length} atom(s) with fractional coords outside [−0.5, 1.5]`,
      oor.slice(0,4).join('; ')+(oor.length>4?` …+${oor.length-4} more`:'')));
    else res.push(ok('Fractional coordinates in expected range'));
  }

  // Duplicate labels
  const seen=new Set(), dupes=[];
  for (const l of labels) { if(seen.has(l)) dupes.push(l); seen.add(l); }
  if (dupes.length) res.push(err(`Duplicate atom label(s): ${dupes.slice(0,5).join(', ')}`));
  else res.push(ok('All atom labels unique'));

  // Element symbols
  const types = lc(block,'_atom_site_type_symbol');
  if (types) {
    const bad=[];
    for (let i=0;i<types.length;i++) {
      const t=types[i]; if(t==='.'||t==='?') continue;
      const el = t.replace(/[^A-Za-z]/g,'');
      const cap = el.charAt(0).toUpperCase()+el.slice(1).toLowerCase();
      if (!VALID_EL.has(cap)) bad.push(`${labels[i]}:${t}`);
    }
    if (bad.length) res.push(warn(`Unrecognised element symbol(s): ${bad.slice(0,5).join(', ')}`));
    else res.push(ok('All element symbols recognised'));
  }

  // Occupancy
  const occs = lc(block,'_atom_site_occupancy');
  if (occs) {
    const bad=[];
    for (let i=0;i<labels.length;i++) {
      const o=pn(occs[i]); if(o===null) continue;
      if(o<-0.001||o>1.001) bad.push(`${labels[i]}=${occs[i]}`);
    }
    if (bad.length) res.push(warn(`Occupancy outside [0,1]: ${bad.slice(0,5).join(', ')}`));
    else res.push(ok('Occupancies in [0, 1]'));
  }

  // Thermal parameters
  const us=lc(block,'_atom_site_u_iso_or_equiv'), bs=lc(block,'_atom_site_b_iso_or_equiv');
  const th=us||bs, tk=us?'U':'B', tlim=us?0.25:20;
  if (th) {
    const neg=[], big=[];
    for (let i=0;i<labels.length;i++) {
      const v=pn(th[i]); if(v===null) continue;
      if(v<0) neg.push(`${labels[i]}=${th[i]}`);
      else if(v>tlim) big.push(`${labels[i]}=${th[i]}`);
    }
    if (neg.length) res.push(err(`Negative ${tk} parameter(s): ${neg.slice(0,3).join(', ')}`));
    if (big.length) res.push(warn(`Large ${tk} parameter(s) (>${tlim}): ${big.slice(0,3).join(', ')}`));
    if (!neg.length&&!big.length) res.push(ok(`Thermal parameters (${tk}) in expected range`));
  }

  // Aniso loop consistency
  const anisoLabels = lc(block,'_atom_site_aniso_label');
  if (anisoLabels) {
    const siteSet=new Set(labels), anisoSet=new Set(anisoLabels);
    const orphan=[...anisoSet].filter(l=>!siteSet.has(l));
    if (orphan.length) res.push(warn(`_atom_site_aniso label(s) not in _atom_site: ${orphan.slice(0,4).join(', ')}`));
    else res.push(ok(`_atom_site_aniso consistent (${anisoLabels.length} atom(s))`));
  }

  return res;
}

function vRefinement(block) {
  const res = [];
  const KNOWN_WL = {'Mo Kα':0.71073,'Cu Kα':1.54178,'Ag Kα':0.56086,'In Kα':0.51360,
                    'Cr Kα':2.28970,'Fe Kα':1.93604,'Co Kα':1.78897,'Ga Kα':1.34139};

  // Wavelength
  const wl=gn(block,'_diffrn_radiation_wavelength');
  if (wl!==null) {
    const match=Object.entries(KNOWN_WL).find(([,v])=>Math.abs(v-wl)<0.001);
    if (match) res.push(ok(`λ = ${wl} Å (${match[0]})`));
    else res.push(info(`λ = ${wl} Å — not a standard Kα wavelength; verify source`));
  } else res.push(warn('Radiation wavelength not found'));

  // R1
  const r1=gn(block,'_refine_ls_r_factor_gt','_refine_ls_r_factor_obs');
  if (r1!==null) {
    if (r1>0.15) res.push(err(`R1 = ${(r1*100).toFixed(2)}% is very high (>15%)`));
    else if (r1>0.10) res.push(warn(`R1 = ${(r1*100).toFixed(2)}% is elevated (>10%)`));
    else res.push(ok(`R1 = ${(r1*100).toFixed(2)}%`));
  } else res.push(warn('R factor (R1) not found'));

  // wR2
  const wr2=gn(block,'_refine_ls_wr_factor_ref','_refine_ls_wr_factor_obs');
  if (wr2!==null) {
    if (wr2>0.40) res.push(err(`wR2 = ${(wr2*100).toFixed(2)}% is very high (>40%)`));
    else if (wr2>0.30) res.push(warn(`wR2 = ${(wr2*100).toFixed(2)}% is elevated (>30%)`));
    else res.push(ok(`wR2 = ${(wr2*100).toFixed(2)}%`));
  } else res.push(warn('wR factor (wR2) not found'));

  // GooF
  const goof=gn(block,'_refine_ls_goodness_of_fit_ref','_refine_ls_goodness_of_fit_obs');
  if (goof!==null) {
    if (goof>2.0||goof<0.5) res.push(warn(`GooF = ${goof.toFixed(3)} is far from 1.0`));
    else res.push(ok(`GooF = ${goof.toFixed(3)}`));
  } else res.push(warn('Goodness of fit (GooF) not found'));

  // Reflections
  const nref=gn(block,'_reflns_number_total');
  const nobs=gn(block,'_reflns_number_gt','_reflns_number_obs');
  if (nref!==null) {
    const s=`${nref.toFixed(0)} total reflection(s)${nobs!==null?`, ${nobs.toFixed(0)} observed`:''}`;
    res.push(ok(s));
  } else res.push(warn('Total reflection count not found'));

  // Data completeness
  const comp=gn(block,'_diffrn_measured_fraction_theta_max','_diffrn_measured_fraction_theta_full');
  if (comp!==null) {
    if (comp<0.80) res.push(err(`Data completeness ${(comp*100).toFixed(1)}% is below 80%`));
    else if (comp<0.90) res.push(warn(`Data completeness ${(comp*100).toFixed(1)}% is below 90%`));
    else res.push(ok(`Data completeness ${(comp*100).toFixed(1)}%`));
  } else res.push(warn('Data completeness not found'));

  // Resolution
  const thMax=gn(block,'_diffrn_reflns_theta_max');
  if (thMax!==null && wl!==null) {
    const dMin = wl/(2*Math.sin(thMax*Math.PI/180));
    if (dMin>0.85) res.push(warn(`Resolution d_min = ${dMin.toFixed(3)} Å (θmax = ${thMax.toFixed(2)}°) — may be insufficient`));
    else res.push(ok(`d_min = ${dMin.toFixed(3)} Å at θmax = ${thMax.toFixed(2)}°`));
  }

  // Flack parameter
  const flack=gi(block,'_refine_ls_abs_structure_details','_twin_individual_id');
  const flackN=gn(block,'_refine_ls_abs_structure_flack');
  if (flackN!==null) {
    if (Math.abs(flackN)>0.1) res.push(warn(`Flack parameter = ${flackN.toFixed(3)} — may indicate incorrect absolute structure or racemic twin`));
    else res.push(ok(`Flack parameter = ${flackN.toFixed(3)}`));
  }

  // Largest diff peak/hole
  const peak=gn(block,'_refine_diff_density_max'), hole=gn(block,'_refine_diff_density_min');
  if (peak!==null&&hole!==null) {
    if (peak>2.0||Math.abs(hole)>2.0) res.push(warn(`Large residual electron density: +${peak.toFixed(2)}/−${Math.abs(hole).toFixed(2)} e Å⁻³`));
    else res.push(ok(`Residual density: +${peak.toFixed(2)}/−${Math.abs(hole).toFixed(2)} e Å⁻³`));
  }

  return res;
}

// ═══════════════════════════════════════════════════════
//  UI RENDERING
// ═══════════════════════════════════════════════════════
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderChk(r) {
  const cls = r.level==='error'?'chk-e':r.level==='warn'?'chk-w':r.level==='ok'?'chk-ok':'chk-i';
  const dcl = r.level==='error'?'dot-e':r.level==='warn'?'dot-w':r.level==='ok'?'dot-ok':'dot-i';
  return `<div class="chk ${cls}">
    <div class="chk-dot ${dcl}"></div>
    <div class="chk-text">
      <div class="chk-msg">${esc(r.msg)}</div>
      ${r.det?`<div class="chk-det">${esc(r.det)}</div>`:''}
    </div>
  </div>`;
}

function renderCat(label, results) {
  const nE=results.filter(r=>r.level==='error').length;
  const nW=results.filter(r=>r.level==='warn').length;
  const nOk=results.filter(r=>r.level==='ok').length;
  const badges = [
    nE ? `<span class="cat-badge cb-e">${nE}E</span>` : '',
    nW ? `<span class="cat-badge cb-w">${nW}W</span>` : '',
    (!nE&&!nW) ? `<span class="cat-badge cb-ok">✓</span>` : '',
  ].join('');
  const autoOpen = nE > 0;
  return `<div class="cat${autoOpen?' open':''}">
    <div class="cat-hdr" onclick="this.closest('.cat').classList.toggle('open')">
      <span class="cat-lbl">${label}</span>
      <div class="cat-badges">${badges}</div>
      <span class="cat-chev">▶</span>
    </div>
    <div class="cat-body">${results.map(renderChk).join('')}</div>
  </div>`;
}

function renderBlock(block) {
  const CATS = [
    {label:'CIF Syntax',   results:vSyntax(block)},
    {label:'Completeness', results:vCompleteness(block)},
    {label:'Unit Cell',    results:vCell(block)},
    {label:'Symmetry',     results:vSymmetry(block)},
    {label:'Atom Sites',   results:vAtoms(block)},
    {label:'Refinement',   results:vRefinement(block)},
  ];
  const all=CATS.flatMap(c=>c.results);
  const nE=all.filter(r=>r.level==='error').length;
  const nW=all.filter(r=>r.level==='warn').length;
  const nOk=all.filter(r=>r.level==='ok').length;
  const pills=[
    nE ? `<span class="sum-pill sum-e">${nE} error${nE>1?'s':''}</span>` : '',
    nW ? `<span class="sum-pill sum-w">${nW} warning${nW>1?'s':''}</span>` : '',
    nOk ? `<span class="sum-pill sum-ok">${nOk} passed</span>` : '',
  ].join('');
  return `<div class="block-wrap">
    <div class="block-hdr">
      <span class="block-name">data_${esc(block.name)}</span>
      <div class="sum-pills">${pills}</div>
    </div>
    <div class="cats">${CATS.map(c=>renderCat(c.label,c.results)).join('')}</div>
  </div>`;
}

function renderFile(file, blocks) {
  const sz = file.size<1024?`${file.size} B`:file.size<1048576?`${(file.size/1024).toFixed(1)} KB`:`${(file.size/1048576).toFixed(2)} MB`;
  let body;
  if (!blocks.length) {
    body=`<div class="block-wrap"><div class="err-banner">No data blocks (data_ keywords) found — is this a CIF file?</div></div>`;
  } else {
    body = blocks.map(renderBlock).join('');
  }
  return `<div class="file-card">
    <div class="file-hdr">
      <span class="file-name">${esc(file.name)}</span>
      <span class="file-meta">${sz} · ${blocks.length} block${blocks.length!==1?'s':''}</span>
    </div>
    ${body}
  </div>`;
}

// ═══════════════════════════════════════════════════════
//  FILE HANDLING
// ═══════════════════════════════════════════════════════
async function handleFiles(files) {
  const cifs = Array.from(files);
  if (!cifs.length) return;
  const out = document.getElementById('output');
  out.innerHTML = '<p style="text-align:center;color:var(--ink-lt);font-size:13px;padding:1rem;">Validating…</p>';
  const htmlParts = await Promise.all(cifs.map(async f => {
    const text = await f.text();
    const toks  = tokenise(text);
    const blocks = parseCIF(toks);
    return renderFile(f, blocks);
  }));
  out.innerHTML = htmlParts.join('');
  document.getElementById('toolbar').style.display = 'flex';
}

function clearResults() {
  document.getElementById('output').innerHTML = '';
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('fileInput').value = '';
}

// Events
const dz = document.getElementById('dropZone');
const fi = document.getElementById('fileInput');
dz.addEventListener('click', ()=>fi.click());
dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
dz.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('drag'); handleFiles(e.dataTransfer.files); });
fi.addEventListener('change', e=>handleFiles(e.target.files));
</script>
</body>
