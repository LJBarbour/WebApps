<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIF Validator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;600&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF6EE;--paper:#F3EDE0;--paper2:#EDE6D4;--ink:#2C2416;--ink-mid:#6B5C3E;
  --ink-faint:#B8A98A;--accent:#4A6FA5;--accent-soft:#EEF3FA;--line:#DDD5C0;--border:#CEC3AA;
  --ok:#4E8367;--ok-bg:#EBF4EE;--ok-bd:#B0D4BB;
  --e-bg:#FDF0EE;--e-ink:#B03020;--e-bd:#E8B0A8;
  --w-bg:#FDF8EE;--w-ink:#8A5A00;--w-bd:#E8D8A0;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Fraunces',serif;
}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px}
body{display:flex;flex-direction:column;overflow-x:hidden}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* -- Header -- */
header{flex-shrink:0;padding:10px 18px 9px;border-bottom:1.5px solid var(--line);
       display:flex;align-items:baseline;gap:12px}
header h1{font-family:var(--display);font-weight:600;font-size:19px;color:var(--ink)}
header .sub{font-size:10px;color:var(--ink-mid);font-family:var(--mono);letter-spacing:.5px}

/* -- Main -- */
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:2rem 1.5rem 4rem;gap:1.5rem}
.content{width:100%;max-width:860px;display:flex;flex-direction:column;gap:1.25rem}

/* -- Drop zone -- */
.drop-zone{border:1.5px dashed var(--border);border-radius:6px;background:var(--paper);
  padding:2.5rem 1.5rem;text-align:center;cursor:pointer;
  transition:border-color .15s,background .15s}
.drop-zone:hover,.drop-zone.drag{border-color:var(--accent);background:var(--accent-soft)}
.drop-zone .dz-icon{font-size:2rem;margin-bottom:.5rem;color:var(--ink-faint)}
.drop-zone p{font-size:12.5px;color:var(--ink-mid)}
.drop-zone strong{color:var(--ink)}
.drop-zone .dz-hint{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:.35rem}
input[type=file]{display:none}

/* -- Toolbar -- */
.toolbar{display:flex;justify-content:flex-end}
.btn-clear{font-family:var(--mono);font-size:10px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--ink-mid);background:transparent;border:1px solid var(--border);border-radius:3px;
  padding:3px 10px;cursor:pointer}
.btn-clear:hover{border-color:var(--accent);color:var(--accent)}

/* -- File card -- */
.file-card{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.file-hdr{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:7px 11px;background:var(--bg);border-bottom:1px solid var(--line)}
.file-name{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink)}
.file-meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);white-space:nowrap}

/* -- Block wrap -- */
.block-wrap{padding:10px 12px}
.block-wrap+.block-wrap{border-top:1px solid var(--line)}
.block-hdr{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.block-name{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.sum-pills{display:flex;gap:4px;flex-wrap:wrap}
.sum-pill{font-family:var(--mono);font-size:10px;font-weight:600;padding:1px 7px;border-radius:9px}
.sum-e{background:var(--e-bg);color:var(--e-ink);border:1px solid var(--e-bd)}
.sum-w{background:var(--w-bg);color:var(--w-ink);border:1px solid var(--w-bd)}
.sum-ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}

/* -- Category accordion -- */
.cats{display:flex;flex-direction:column;gap:4px}
.cat{border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--bg)}
.cat-hdr{display:flex;align-items:center;gap:7px;padding:6px 10px;cursor:pointer;
  user-select:none;font-size:12px;font-weight:500}
.cat-hdr:hover{background:var(--paper)}
.cat-lbl{flex:1}
.cat-badges{display:flex;gap:3px}
.cat-badge{font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;border-radius:5px}
.cb-e{background:var(--e-bg);color:var(--e-ink)}
.cb-w{background:var(--w-bg);color:var(--w-ink)}
.cb-ok{background:var(--ok-bg);color:var(--ok);font-weight:500}
.cat-chev{font-size:10px;color:var(--ink-faint);transition:transform .15s}
.cat.open .cat-chev{transform:rotate(90deg)}
.cat-body{display:none;padding:5px 10px 8px;border-top:1px solid var(--line)}
.cat.open .cat-body{display:block}

/* -- Check items -- */
.chk{display:flex;align-items:flex-start;gap:7px;padding:4px 0}
.chk+.chk{border-top:1px solid rgba(44,36,22,.05)}
.chk-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.dot-e{background:var(--e-ink)} .dot-w{background:var(--w-ink)}
.dot-ok{background:var(--ok)} .dot-i{background:var(--ink-faint)}
.chk-text{flex:1;min-width:0}
.chk-msg{font-size:12px;line-height:1.4}
.chk-det{font-size:10.5px;font-family:var(--mono);color:var(--ink-mid);margin-top:1px;word-break:break-all}
.chk-e .chk-msg{color:var(--e-ink)} .chk-w .chk-msg{color:var(--w-ink)}
.chk-ok .chk-msg{color:var(--ok)} .chk-i .chk-msg{color:var(--ink-mid)}

/* -- Inline error banner -- */
.err-banner{margin:.5rem 0;padding:7px 10px;background:var(--e-bg);
  border:1px solid var(--e-bd);border-radius:5px;font-size:12px;color:var(--e-ink)}

/* -- Spinner / loading -- */
.loading{text-align:center;padding:1.5rem;font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
</style>
</head>
<body>

<header>
  <h1>CIF Validator</h1>
  <span class="sub">syntax &middot; completeness &middot; unit cell &middot; symmetry &middot; atom sites &middot; refinement</span>
</header>

<main>
<div class="content">

  <div class="drop-zone" id="dropZone">
    <div class="dz-icon">&#x2B06;</div>
    <p>Drop <strong>CIF file(s)</strong> here, or <strong>click to browse</strong></p>
    <p class="dz-hint">Offline &mdash; no data leaves your browser &nbsp;&middot;&nbsp; .cif &middot; .fcf &middot; .hkl</p>
  </div>
  <input type="file" id="fileInput" accept=".cif,.fcf,.hkl" multiple>

  <div class="toolbar" id="toolbar" style="display:none">
    <button class="btn-clear" onclick="clearResults()">Clear</button>
  </div>

  <div id="output"></div>

</div>
</main>

<script>
'use strict';

// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
//  CIF TOKENISER
// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
function tokenise(text){
  const toks=[],lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  let i=0;
  while(i<lines.length){
    const ln=i+1,line=lines[i];
    if(line.startsWith(';')){
      let s='';i++;
      while(i<lines.length){if(lines[i].startsWith(';')){i++;break;}s+=lines[i]+'\n';i++;}
      toks.push({t:'V',v:s.trim(),ln});continue;
    }
    let p=0;
    while(p<line.length){
      while(p<line.length&&/\s/.test(line[p]))p++;
      if(p>=line.length||line[p]==='#')break;
      const ch=line[p];
      if(ch==="'"){p++;let s='';
        while(p<line.length&&!(line[p]==="'"&&(p+1>=line.length||/\s/.test(line[p+1]))))s+=line[p++];
        if(p<line.length)p++;toks.push({t:'V',v:s,ln});continue;}
      if(ch==='"'){p++;let s='';
        while(p<line.length&&!(line[p]==='"'&&(p+1>=line.length||/\s/.test(line[p+1]))))s+=line[p++];
        if(p<line.length)p++;toks.push({t:'V',v:s,ln});continue;}
      let w='';
      while(p<line.length&&!/\s/.test(line[p])&&line[p]!=='#')w+=line[p++];
      const wl=w.toLowerCase();
      if(wl.startsWith('data_'))toks.push({t:'B',v:w.slice(5),ln});
      else if(wl==='loop_')toks.push({t:'L',ln});
      else if(w.startsWith('_'))toks.push({t:'K',v:wl,ln});
      else toks.push({t:'V',v:w,ln});
    }
    i++;
  }
  return toks;
}

// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
//  CIF PARSER
// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
function parseCIF(toks){
  const blocks=[];let i=0;
  while(i<toks.length&&toks[i].t!=='B')i++;
  while(i<toks.length){
    if(toks[i].t!=='B'){i++;continue;}
    const block={name:toks[i].v,items:{},loops:[],errs:[]};i++;
    while(i<toks.length&&toks[i].t!=='B'){
      if(toks[i].t==='K'){
        const key=toks[i].v,ln=toks[i].ln;i++;
        if(block.items[key])block.errs.push({msg:'Duplicate data name: '+key,ln});
        if(i<toks.length&&toks[i].t==='V'){block.items[key]={v:toks[i].v,ln};i++;}
        else block.errs.push({msg:'No value for data name '+key,ln});
      }else if(toks[i].t==='L'){
        const ln=toks[i].ln;i++;
        const loop={keys:[],rows:[],ln};
        while(i<toks.length&&toks[i].t==='K'){loop.keys.push(toks[i].v);i++;}
        if(!loop.keys.length){block.errs.push({msg:'loop_ with no data names',ln});continue;}
        const vals=[];
        while(i<toks.length&&toks[i].t==='V'){vals.push(toks[i].v);i++;}
        const n=loop.keys.length;
        if(vals.length%n!==0)block.errs.push({msg:'loop_ at line '+ln+': '+vals.length+' value(s) not divisible by '+n+' key(s)',ln});
        for(let r=0;r+n<=vals.length;r+=n)loop.rows.push(vals.slice(r,r+n));
        block.loops.push(loop);
      }else i++;
    }
    blocks.push(block);
  }
  return blocks;
}

// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
//  HELPERS
// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
function gi(block,...keys){
  for(const key of keys){const k=key.toLowerCase();
    const it=block.items[k];
    if(it&&it.v&&it.v!=='.'&&it.v!=='?')return it.v;
    for(const loop of block.loops){const idx=loop.keys.indexOf(k);
      if(idx>=0&&loop.rows.length>0){const v=loop.rows[0][idx];if(v&&v!=='.'&&v!=='?')return v;}}
  }
  return null;
}
function lc(block,key){const k=key.toLowerCase();
  for(const loop of block.loops){const idx=loop.keys.indexOf(k);if(idx>=0)return loop.rows.map(r=>r[idx]);}
  return null;
}
function pn(s){if(!s||s==='.'||s==='?')return null;const n=parseFloat(s.replace(/\([^)]*\)/,''));return isNaN(n)?null:n;}
function gn(block,...keys){const v=gi(block,...keys);return v?pn(v):null;}
function calcVol(a,b,c,al,be,ga){
  const r=Math.PI/180,ca=Math.cos(al*r),cb=Math.cos(be*r),cg=Math.cos(ga*r);
  const v2=1-ca*ca-cb*cb-cg*cg+2*ca*cb*cg;return v2>1e-10?a*b*c*Math.sqrt(v2):null;
}
function crystalSystem(n){
  if(n<=2)return'triclinic';if(n<=15)return'monoclinic';if(n<=74)return'orthorhombic';
  if(n<=142)return'tetragonal';if(n<=167)return'trigonal';if(n<=194)return'hexagonal';
  if(n<=230)return'cubic';return null;
}
const VALID_EL=new Set(['H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar',
  'K','Ca','Sc','Ti','V','Cr','Mn','Fe','Co','Ni','Cu','Zn','Ga','Ge','As','Se','Br','Kr','Rb','Sr',
  'Y','Zr','Nb','Mo','Tc','Ru','Rh','Pd','Ag','Cd','In','Sn','Sb','Te','I','Xe','Cs','Ba','La','Ce',
  'Pr','Nd','Pm','Sm','Eu','Gd','Tb','Dy','Ho','Er','Tm','Yb','Lu','Hf','Ta','W','Re','Os','Ir','Pt',
  'Au','Hg','Tl','Pb','Bi','Po','At','Rn','Fr','Ra','Ac','Th','Pa','U','Np','Pu','Am','Cm','Bk','Cf',
  'Es','Fm','Md','No','Lr','Rf','Db','Sg','Bh','Hs','Mt','Ds','Rg','Cn','Nh','Fl','Mc','Lv','Ts','Og',
  'D','T']);
function ok(msg,det){return{level:'ok',msg,det};}
function warn(msg,det){return{level:'warn',msg,det};}
function err(msg,det){return{level:'error',msg,det};}
function info(msg,det){return{level:'info',msg,det};}

// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
//  VALIDATORS
// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
function vSyntax(block){
  const res=[];
  if(!block.errs.length){res.push(ok('No syntax errors detected'));}
  else{for(const e of block.errs)res.push(err(e.msg,'Near line '+e.ln));}
  res.push(info(Object.keys(block.items).length+' key-value pair(s), '+block.loops.length+' loop(s)'));
  return res;
}

function vCompleteness(block){
  const res=[];
  const req=(label,...keys)=>{const v=gi(block,...keys);
    if(v){return ok(label+': '+(v.length>50?v.slice(0,50)+'\u2026':v));}
    return err(label+' not found',keys[0]);};
  const rec=(label,...keys)=>{const v=gi(block,...keys);
    if(v){return ok(label+': '+(v.length>50?v.slice(0,50)+'\u2026':v));}
    return warn(label+' not found (recommended)',keys[0]);};
  res.push(req('Cell length a','_cell_length_a'));
  res.push(req('Cell length b','_cell_length_b'));
  res.push(req('Cell length c','_cell_length_c'));
  res.push(req('Cell angle \u03B1','_cell_angle_alpha'));
  res.push(req('Cell angle \u03B2','_cell_angle_beta'));
  res.push(req('Cell angle \u03B3','_cell_angle_gamma'));
  res.push(req('Formula units Z','_cell_formula_units_z'));
  res.push(req('Space group H-M','_symmetry_space_group_name_h-m','_space_group_name_h-m_alt','_space_group_name_h-m'));
  res.push(req('Chemical formula','_chemical_formula_sum'));
  res.push(rec('Formula weight','_chemical_formula_weight'));
  res.push(rec('Radiation \u03BB','_diffrn_radiation_wavelength'));
  res.push(rec('R factor (R1)','_refine_ls_r_factor_gt','_refine_ls_r_factor_obs'));
  res.push(rec('wR factor (wR2)','_refine_ls_wr_factor_ref','_refine_ls_wr_factor_obs'));
  res.push(rec('Completeness','_diffrn_measured_fraction_theta_max','_diffrn_measured_fraction_theta_full'));
  return res;
}

function vCell(block){
  const res=[];
  const a=gn(block,'_cell_length_a'),b=gn(block,'_cell_length_b'),c=gn(block,'_cell_length_c');
  const al=gn(block,'_cell_angle_alpha'),be=gn(block,'_cell_angle_beta'),ga=gn(block,'_cell_angle_gamma');
  const vSt=gn(block,'_cell_volume');
  if(a!==null&&b!==null&&c!==null){
    const bad=[['a',a],['b',b],['c',c]].filter(([,v])=>v<=0);
    if(bad.length)res.push(err('Cell length(s) \u2264 0: '+bad.map(([n,v])=>n+'='+v).join(', ')+' \u00C5'));
    else res.push(ok('Cell lengths a='+a+', b='+b+', c='+c+' \u00C5'));
  }else res.push(info('Cell lengths missing \u2014 length checks skipped'));
  if(al!==null&&be!==null&&ga!==null){
    const bad=[['\u03B1',al],['\u03B2',be],['\u03B3',ga]].filter(([,v])=>v<=0||v>=180);
    if(bad.length)res.push(err('Cell angle(s) outside (0\u00B0,180\u00B0): '+bad.map(([n,v])=>n+'='+v+'\u00B0').join(', ')));
    else res.push(ok('Cell angles \u03B1='+al+'\u00B0, \u03B2='+be+'\u00B0, \u03B3='+ga+'\u00B0'));
  }else res.push(info('Cell angles missing \u2014 angle checks skipped'));
  if(a&&b&&c&&al&&be&&ga){
    const vCalc=calcVol(a,b,c,al,be,ga);
    if(vSt!==null&&vCalc!==null){
      const diff=Math.abs(vSt-vCalc)/vCalc;
      if(diff>0.01)res.push(warn('Cell volume mismatch: stated '+vSt.toFixed(1)+' \u00C5\u00B3, calculated '+vCalc.toFixed(1)+' \u00C5\u00B3 ('+(diff*100).toFixed(1)+'% difference)'));
      else res.push(ok('Cell volume consistent: '+vSt.toFixed(1)+' \u00C5\u00B3 (calc '+vCalc.toFixed(1)+' \u00C5\u00B3)'));
    }else if(vCalc!==null)res.push(info('Calculated cell volume: '+vCalc.toFixed(1)+' \u00C5\u00B3'));
  }
  const itStr=gi(block,'_symmetry_int_tables_number','_space_group_it_number');
  const itN=itStr?parseInt(itStr):null;
  if(itN&&a&&b&&c&&al&&be&&ga){
    const sys=crystalSystem(itN);
    const ATOL=0.5,lne=(x,y)=>Math.abs(x-y)/Math.max(x,y)>0.005,ane=(x,y)=>Math.abs(x-y)>ATOL;
    const issues=[];
    if(sys==='cubic'){if(lne(a,b)||lne(b,c))issues.push('a \u2260 b \u2260 c (cubic requires a = b = c)');if(ane(al,90)||ane(be,90)||ane(ga,90))issues.push('angles not all 90\u00B0');}
    else if(sys==='tetragonal'){if(lne(a,b))issues.push('a \u2260 b (tetragonal requires a = b)');if(ane(al,90)||ane(be,90)||ane(ga,90))issues.push('angles not all 90\u00B0');}
    else if(sys==='orthorhombic'){if(ane(al,90)||ane(be,90)||ane(ga,90))issues.push('angles not all 90\u00B0');}
    else if(sys==='hexagonal'){if(lne(a,b))issues.push('a \u2260 b (hexagonal requires a = b)');if(ane(al,90)||ane(be,90))issues.push('\u03B1 or \u03B2 \u2260 90\u00B0');if(ane(ga,120))issues.push('\u03B3 = '+ga+'\u00B0, not 120\u00B0');}
    else if(sys==='trigonal'){const hexOk=!lne(a,b)&&!ane(al,90)&&!ane(be,90)&&!ane(ga,120);const rhomOk=!lne(a,b)&&!lne(b,c)&&!ane(al,be)&&!ane(be,ga)&&ane(al,90);if(!hexOk&&!rhomOk)issues.push('Cell not consistent with hexagonal or rhombohedral trigonal setting');}
    for(const m of issues)res.push(warn('Crystal system metric: '+m));
    if(!issues.length&&sys!=='triclinic'&&sys!=='monoclinic')res.push(ok('Cell metric consistent with '+sys+' system (SG '+itN+')'));
  }
  return res;
}

function vSymmetry(block){
  const res=[];
  const itStr=gi(block,'_symmetry_int_tables_number','_space_group_it_number');
  const hm=gi(block,'_symmetry_space_group_name_h-m','_space_group_name_h-m_alt','_space_group_name_h-m');
  if(itStr){const n=parseInt(itStr);if(isNaN(n)||n<1||n>230)res.push(err('Invalid IT number: '+itStr+' (must be 1-230)'));else res.push(ok('Space group IT number '+n+' ('+crystalSystem(n)+')'));}
  else res.push(warn('Space group IT number not found (_symmetry_Int_Tables_number)'));
  if(hm){const latt=hm.trim()[0].toUpperCase();if(!/[PAIBCFR]/.test(latt))res.push(warn("H-M symbol '"+hm+"' does not start with a recognised lattice letter"));else res.push(ok('H-M symbol: '+hm));}
  else res.push(err('Space group H-M symbol not found'));
  if(itStr&&hm){const n=parseInt(itStr),sys=crystalSystem(n),latt=hm.trim()[0].toUpperCase();
    if(!isNaN(n)&&sys){
      if(latt==='R'&&sys!=='trigonal')res.push(warn("Rhombohedral lattice 'R' unexpected for "+sys+' system (IT '+n+')'));
      if(sys==='cubic'&&!['P','F','I'].includes(latt))res.push(warn("Lattice '"+latt+"' unusual for cubic system"));
      if(sys==='tetragonal'&&!['P','I'].includes(latt))res.push(warn("Lattice '"+latt+"' unusual for tetragonal system"));
      if(sys==='hexagonal'&&latt!=='P')res.push(warn("Lattice '"+latt+"' unusual for hexagonal system (expected P)"));
    }
  }
  const symOps=lc(block,'_symmetry_equiv_pos_as_xyz')||lc(block,'_space_group_symop_operation_xyz');
  if(symOps)res.push(info(symOps.length+' symmetry operation(s) listed'));
  return res;
}

function vAtoms(block){
  const res=[];
  const labels=lc(block,'_atom_site_label');
  if(!labels){res.push(warn('No _atom_site_label loop found'));return res;}
  res.push(ok(labels.length+' atom site(s)'));
  const xs=lc(block,'_atom_site_fract_x'),ys=lc(block,'_atom_site_fract_y'),zs=lc(block,'_atom_site_fract_z');
  if(!xs||!ys||!zs){res.push(err('Fractional coordinate columns missing from _atom_site loop'));}
  else{
    const oor=[];
    for(let i=0;i<labels.length;i++){
      const x=pn(xs[i]),y=pn(ys[i]),z=pn(zs[i]),bad=[];
      if(x!==null&&(x<-0.5||x>1.5))bad.push('x='+xs[i]);
      if(y!==null&&(y<-0.5||y>1.5))bad.push('y='+ys[i]);
      if(z!==null&&(z<-0.5||z>1.5))bad.push('z='+zs[i]);
      if(bad.length)oor.push(labels[i]+': '+bad.join(', '));
    }
    if(oor.length)res.push(warn(oor.length+' atom(s) with fractional coords outside [-0.5, 1.5]',oor.slice(0,4).join('; ')+(oor.length>4?' \u2026+'+(oor.length-4)+' more':'')));
    else res.push(ok('Fractional coordinates in expected range'));
  }
  const seen=new Set(),dupes=[];
  for(const l of labels){if(seen.has(l))dupes.push(l);seen.add(l);}
  if(dupes.length)res.push(err('Duplicate atom label(s): '+dupes.slice(0,5).join(', ')));
  else res.push(ok('All atom labels unique'));
  const types=lc(block,'_atom_site_type_symbol');
  if(types){
    const bad=[];
    for(let i=0;i<types.length;i++){const t=types[i];if(t==='.'||t==='?')continue;
      const el=t.replace(/[^A-Za-z]/g,'');const cap=el.charAt(0).toUpperCase()+el.slice(1).toLowerCase();
      if(!VALID_EL.has(cap))bad.push(labels[i]+':'+t);}
    if(bad.length)res.push(warn('Unrecognised element symbol(s): '+bad.slice(0,5).join(', ')));
    else res.push(ok('All element symbols recognised'));
  }
  const occs=lc(block,'_atom_site_occupancy');
  if(occs){
    const bad=[];
    for(let i=0;i<labels.length;i++){const o=pn(occs[i]);if(o===null)continue;if(o<-0.001||o>1.001)bad.push(labels[i]+'='+occs[i]);}
    if(bad.length)res.push(warn('Occupancy outside [0,1]: '+bad.slice(0,5).join(', ')));
    else res.push(ok('Occupancies in [0, 1]'));
  }
  const us=lc(block,'_atom_site_u_iso_or_equiv'),bs=lc(block,'_atom_site_b_iso_or_equiv');
  const th=us||bs,tk=us?'U':'B',tlim=us?0.25:20;
  if(th){
    const neg=[],big=[];
    for(let i=0;i<labels.length;i++){const v=pn(th[i]);if(v===null)continue;
      if(v<0)neg.push(labels[i]+'='+th[i]);else if(v>tlim)big.push(labels[i]+'='+th[i]);}
    if(neg.length)res.push(err('Negative '+tk+' parameter(s): '+neg.slice(0,3).join(', ')));
    if(big.length)res.push(warn('Large '+tk+' parameter(s) (>'+tlim+'): '+big.slice(0,3).join(', ')));
    if(!neg.length&&!big.length)res.push(ok('Thermal parameters ('+tk+') in expected range'));
  }
  const anisoLabels=lc(block,'_atom_site_aniso_label');
  if(anisoLabels){
    const siteSet=new Set(labels),anisoSet=new Set(anisoLabels);
    const orphan=[...anisoSet].filter(l=>!siteSet.has(l));
    if(orphan.length)res.push(warn('_atom_site_aniso label(s) not in _atom_site: '+orphan.slice(0,4).join(', ')));
    else res.push(ok('_atom_site_aniso consistent ('+anisoLabels.length+' atom(s))'));
  }
  return res;
}

function vRefinement(block){
  const res=[];
  const KNOWN_WL={'Mo K\u03B1':0.71073,'Cu K\u03B1':1.54178,'Ag K\u03B1':0.56086,'In K\u03B1':0.51360,
    'Cr K\u03B1':2.28970,'Fe K\u03B1':1.93604,'Co K\u03B1':1.78897,'Ga K\u03B1':1.34139};
  const wl=gn(block,'_diffrn_radiation_wavelength');
  if(wl!==null){const match=Object.entries(KNOWN_WL).find(([,v])=>Math.abs(v-wl)<0.001);
    if(match)res.push(ok('\u03BB = '+wl+' \u00C5 ('+match[0]+')'));
    else res.push(info('\u03BB = '+wl+' \u00C5 \u2014 not a standard K\u03B1 wavelength'));}
  else res.push(warn('Radiation wavelength not found'));
  const r1=gn(block,'_refine_ls_r_factor_gt','_refine_ls_r_factor_obs');
  if(r1!==null){if(r1>0.15)res.push(err('R1 = '+(r1*100).toFixed(2)+'% is very high (>15%)'));
    else if(r1>0.10)res.push(warn('R1 = '+(r1*100).toFixed(2)+'% is elevated (>10%)'));
    else res.push(ok('R1 = '+(r1*100).toFixed(2)+'%'));}
  else res.push(warn('R factor (R1) not found'));
  const wr2=gn(block,'_refine_ls_wr_factor_ref','_refine_ls_wr_factor_obs');
  if(wr2!==null){if(wr2>0.40)res.push(err('wR2 = '+(wr2*100).toFixed(2)+'% is very high (>40%)'));
    else if(wr2>0.30)res.push(warn('wR2 = '+(wr2*100).toFixed(2)+'% is elevated (>30%)'));
    else res.push(ok('wR2 = '+(wr2*100).toFixed(2)+'%'));}
  else res.push(warn('wR factor (wR2) not found'));
  const goof=gn(block,'_refine_ls_goodness_of_fit_ref','_refine_ls_goodness_of_fit_obs');
  if(goof!==null){if(goof>2.0||goof<0.5)res.push(warn('GooF = '+goof.toFixed(3)+' is far from 1.0'));
    else res.push(ok('GooF = '+goof.toFixed(3)));}
  else res.push(warn('Goodness of fit (GooF) not found'));
  const nref=gn(block,'_reflns_number_total'),nobs=gn(block,'_reflns_number_gt','_reflns_number_obs');
  if(nref!==null)res.push(ok(nref.toFixed(0)+' total reflection(s)'+(nobs!==null?', '+nobs.toFixed(0)+' observed':'')));
  else res.push(warn('Total reflection count not found'));
  const comp=gn(block,'_diffrn_measured_fraction_theta_max','_diffrn_measured_fraction_theta_full');
  if(comp!==null){if(comp<0.80)res.push(err('Data completeness '+(comp*100).toFixed(1)+'% is below 80%'));
    else if(comp<0.90)res.push(warn('Data completeness '+(comp*100).toFixed(1)+'% is below 90%'));
    else res.push(ok('Data completeness '+(comp*100).toFixed(1)+'%'));}
  else res.push(warn('Data completeness not found'));
  const thMax=gn(block,'_diffrn_reflns_theta_max');
  if(thMax!==null&&wl!==null){const dMin=wl/(2*Math.sin(thMax*Math.PI/180));
    if(dMin>0.85)res.push(warn('Resolution d_min = '+dMin.toFixed(3)+' \u00C5 (\u03B8max = '+thMax.toFixed(2)+'\u00B0) \u2014 may be insufficient'));
    else res.push(ok('d_min = '+dMin.toFixed(3)+' \u00C5 at \u03B8max = '+thMax.toFixed(2)+'\u00B0'));}
  const flackN=gn(block,'_refine_ls_abs_structure_flack');
  if(flackN!==null){if(Math.abs(flackN)>0.1)res.push(warn('Flack parameter = '+flackN.toFixed(3)+' \u2014 may indicate incorrect absolute structure or racemic twin'));
    else res.push(ok('Flack parameter = '+flackN.toFixed(3)));}
  const peak=gn(block,'_refine_diff_density_max'),hole=gn(block,'_refine_diff_density_min');
  if(peak!==null&&hole!==null){
    if(peak>2.0||Math.abs(hole)>2.0)res.push(warn('Large residual electron density: +'+peak.toFixed(2)+'/\u2212'+Math.abs(hole).toFixed(2)+' e \u00C5\u207B\u00B3'));
    else res.push(ok('Residual density: +'+peak.toFixed(2)+'/\u2212'+Math.abs(hole).toFixed(2)+' e \u00C5\u207B\u00B3'));}
  return res;
}

// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
//  UI RENDERING
// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderChk(r){
  const cls=r.level==='error'?'chk-e':r.level==='warn'?'chk-w':r.level==='ok'?'chk-ok':'chk-i';
  const dcl=r.level==='error'?'dot-e':r.level==='warn'?'dot-w':r.level==='ok'?'dot-ok':'dot-i';
  return '<div class="chk '+cls+'"><div class="chk-dot '+dcl+'"></div><div class="chk-text">'+
    '<div class="chk-msg">'+esc(r.msg)+'</div>'+
    (r.det?'<div class="chk-det">'+esc(r.det)+'</div>':'')+
    '</div></div>';
}
function renderCat(label,results){
  const nE=results.filter(r=>r.level==='error').length;
  const nW=results.filter(r=>r.level==='warn').length;
  const badges=(nE?'<span class="cat-badge cb-e">'+nE+'E</span>':'')+
    (nW?'<span class="cat-badge cb-w">'+nW+'W</span>':'')+
    (!nE&&!nW?'<span class="cat-badge cb-ok">\u2713</span>':'');
  return '<div class="cat'+(nE?' open':'')+'">'+
    '<div class="cat-hdr" onclick="this.closest(\'.cat\').classList.toggle(\'open\')">'+
    '<span class="cat-lbl">'+label+'</span>'+
    '<div class="cat-badges">'+badges+'</div>'+
    '<span class="cat-chev">\u25B6</span></div>'+
    '<div class="cat-body">'+results.map(renderChk).join('')+'</div></div>';
}
function renderBlock(block){
  const CATS=[
    {label:'CIF Syntax',results:vSyntax(block)},
    {label:'Completeness',results:vCompleteness(block)},
    {label:'Unit Cell',results:vCell(block)},
    {label:'Symmetry',results:vSymmetry(block)},
    {label:'Atom Sites',results:vAtoms(block)},
    {label:'Refinement',results:vRefinement(block)},
  ];
  const all=CATS.flatMap(c=>c.results);
  const nE=all.filter(r=>r.level==='error').length;
  const nW=all.filter(r=>r.level==='warn').length;
  const nOk=all.filter(r=>r.level==='ok').length;
  const pills=(nE?'<span class="sum-pill sum-e">'+nE+' error'+(nE>1?'s':'')+'</span>':'')+
    (nW?'<span class="sum-pill sum-w">'+nW+' warning'+(nW>1?'s':'')+'</span>':'')+
    (nOk?'<span class="sum-pill sum-ok">'+nOk+' passed</span>':'');
  return '<div class="block-wrap"><div class="block-hdr">'+
    '<span class="block-name">data_'+esc(block.name)+'</span>'+
    '<div class="sum-pills">'+pills+'</div></div>'+
    '<div class="cats">'+CATS.map(c=>renderCat(c.label,c.results)).join('')+'</div></div>';
}
function fmtSz(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB';}
function renderFile(file,blocks){
  let body;
  if(!blocks.length)body='<div class="block-wrap"><div class="err-banner">No data blocks (data_ keywords) found \u2014 is this a CIF file?</div></div>';
  else body=blocks.map(renderBlock).join('');
  return '<div class="file-card"><div class="file-hdr">'+
    '<span class="file-name">'+esc(file.name)+'</span>'+
    '<span class="file-meta">'+fmtSz(file.size)+' \u00B7 '+blocks.length+' block'+(blocks.length!==1?'s':'')+'</span>'+
    '</div>'+body+'</div>';
}

// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
//  FILE HANDLING
// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
async function handleFiles(files){
  const cifs=Array.from(files);if(!cifs.length)return;
  const out=document.getElementById('output');
  out.innerHTML='<div class="loading">Validating\u2026</div>';
  const parts=await Promise.all(cifs.map(async f=>{
    const text=await f.text();const toks=tokenise(text);const blocks=parseCIF(toks);
    return renderFile(f,blocks);
  }));
  out.innerHTML=parts.join('');
  document.getElementById('toolbar').style.display='flex';
}
function clearResults(){
  document.getElementById('output').innerHTML='';
  document.getElementById('toolbar').style.display='none';
  document.getElementById('fileInput').value='';
}

// Drop anywhere on page
const dz=document.getElementById('dropZone');
const fi=document.getElementById('fileInput');
document.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag');});
document.addEventListener('dragleave',e=>{if(e.relatedTarget===null)dz.classList.remove('drag');});
document.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');handleFiles(e.dataTransfer.files);});
dz.addEventListener('click',()=>fi.click());
fi.addEventListener('change',e=>handleFiles(e.target.files));
</script>
