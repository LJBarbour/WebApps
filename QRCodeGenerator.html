<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;600&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF6EE;--paper:#F3EDE0;--paper2:#EDE6D4;--ink:#2C2416;--ink-mid:#6B5C3E;
  --ink-faint:#B8A98A;--accent:#4A6FA5;--accent-soft:#EEF3FA;--line:#DDD5C0;--border:#CEC3AA;
  --ok:#4E8367;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Fraunces',serif;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px}
body{display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}

/* -- Header -- */
header{flex-shrink:0;padding:10px 18px 9px;border-bottom:1.5px solid var(--line);
       display:flex;align-items:baseline;gap:12px}
header h1{font-family:var(--display);font-weight:600;font-size:19px;color:var(--ink)}
header .sub{font-size:10px;color:var(--ink-mid);font-family:var(--mono);letter-spacing:.5px}

/* -- Main -- */
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
     padding:3rem 1.5rem 4rem;gap:2rem}

/* -- Card -- */
.card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:1.25rem}

/* -- Input -- */
.input-wrap{display:flex;flex-direction:column;gap:4px}
.input-wrap label{font-family:var(--mono);font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-faint)}
textarea{width:100%;min-height:80px;resize:vertical;padding:8px 10px;
  background:var(--paper);border:1px solid var(--border);border-radius:4px;
  font-family:var(--mono);font-size:13px;color:var(--ink);line-height:1.55;outline:none;
  transition:border-color .15s}
textarea::placeholder{color:var(--ink-faint)}
textarea:focus{border-color:var(--accent)}

/* -- Error hint -- */
.err-hint{font-family:var(--mono);font-size:10px;color:#C0392B;display:none;margin-top:2px}

/* -- QR frame -- */
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:1rem}
.qr-frame{width:272px;height:272px;background:#fff;border:1px solid var(--border);border-radius:6px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:box-shadow .2s}
.qr-frame.has-code{box-shadow:0 2px 12px rgba(44,36,22,.10)}
#qr-output{display:flex;align-items:center;justify-content:center}
#qr-output img,#qr-output canvas{display:block}
.qr-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;
  color:var(--ink-faint);font-size:11.5px;text-align:center;padding:1rem;user-select:none;
  font-family:var(--mono);letter-spacing:.03em}
.qr-placeholder svg{opacity:.3}

/* -- Buttons -- */
.btn-row{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border:none;
  border-radius:4px;font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;
  transition:background .15s,opacity .15s,transform .1s;user-select:none}
.btn svg{flex-shrink:0}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}

.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:#3d5f8f}
.btn-primary.ok{background:var(--ok)}

.btn-ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn-ghost:hover:not(:disabled){background:var(--accent-soft)}

/* -- Error state QR overlay -- */
.qr-error{display:none;flex-direction:column;align-items:center;gap:6px;color:#C0392B;
  font-family:var(--mono);font-size:11px;text-align:center;padding:1rem}
</style>
</head>
<body>

<header>
  <h1>QR Code Generator</h1>
  <span class="sub">paste any URL or text &mdash; your code appears instantly</span>
</header>

<main>
<div class="card">

  <div class="input-wrap">
    <label for="qr-input">Text or URL</label>
    <textarea id="qr-input" placeholder="https://example.com" autocomplete="off" spellcheck="false"></textarea>
    <div class="err-hint" id="err-hint">Input too long &mdash; try shorter text or lower error correction.</div>
  </div>

  <div class="qr-wrap">
    <div class="qr-frame" id="qr-frame">
      <div id="qr-placeholder" class="qr-placeholder">
        <svg width="52" height="52" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4"  y="4"  width="16" height="16" rx="2" fill="currentColor"/>
          <rect x="28" y="4"  width="16" height="16" rx="2" fill="currentColor"/>
          <rect x="4"  y="28" width="16" height="16" rx="2" fill="currentColor"/>
          <rect x="28" y="28" width="6"  height="6"  rx="1" fill="currentColor"/>
          <rect x="38" y="28" width="6"  height="6"  rx="1" fill="currentColor"/>
          <rect x="28" y="38" width="6"  height="6"  rx="1" fill="currentColor"/>
          <rect x="38" y="38" width="6"  height="6"  rx="1" fill="currentColor"/>
        </svg>
        <span>Your QR code will appear here</span>
      </div>
      <div id="qr-error" class="qr-error">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Text too long to encode
      </div>
      <div id="qr-output" style="display:none"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btn-copy" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        <span id="btn-label">Copy image</span>
      </button>
      <button class="btn btn-ghost" id="btn-save" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Save PNG
      </button>
    </div>
  </div>

</div>
</main>

<script>
'use strict';
var qrInstance=null,lastText='',debounceTimer,QR_SIZE=256;
var input=document.getElementById('qr-input');
var output=document.getElementById('qr-output');
var frame=document.getElementById('qr-frame');
var placeholder=document.getElementById('qr-placeholder');
var errDiv=document.getElementById('qr-error');
var btnCopy=document.getElementById('btn-copy');
var btnSave=document.getElementById('btn-save');
var btnLabel=document.getElementById('btn-label');

function getCanvas(){return output.querySelector('canvas');}
function getImg(){return output.querySelector('img');}

function getBlob(cb){
  var c=getCanvas();
  if(c){c.toBlob(cb,'image/png');return;}
  var img=getImg();
  if(img){var t=document.createElement('canvas');t.width=QR_SIZE;t.height=QR_SIZE;
    t.getContext('2d').drawImage(img,0,0);t.toBlob(cb,'image/png');}
}

function showPlaceholder(){
  placeholder.style.display='flex';output.style.display='none';errDiv.style.display='none';
  frame.classList.remove('has-code');
  btnCopy.disabled=true;btnSave.disabled=true;
  qrInstance=null;output.innerHTML='';
}

function showError(){
  placeholder.style.display='none';output.style.display='none';errDiv.style.display='flex';
  frame.classList.remove('has-code');
  btnCopy.disabled=true;btnSave.disabled=true;
}

function generateQR(text){
  if(!text){showPlaceholder();return;}
  placeholder.style.display='none';errDiv.style.display='none';
  output.style.display='flex';frame.classList.add('has-code');
  try{
    if(!qrInstance){
      output.innerHTML='';
      qrInstance=new QRCode(output,{text:text,width:QR_SIZE,height:QR_SIZE,
        colorDark:'#2C2416',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.M});
    }else{
      qrInstance.makeCode(text);
    }
    btnCopy.disabled=false;btnSave.disabled=false;
  }catch(e){
    qrInstance=null;output.innerHTML='';showError();
  }
}

input.addEventListener('input',function(){
  clearTimeout(debounceTimer);
  debounceTimer=setTimeout(function(){
    var text=input.value.trim();
    if(text!==lastText){lastText=text;generateQR(text);}
  },180);
});

btnCopy.addEventListener('click',function(){
  getBlob(function(blob){
    if(!blob)return;
    navigator.clipboard.write([new ClipboardItem({'image/png':blob})])
      .then(function(){
        btnCopy.classList.add('ok');btnLabel.textContent='Copied!';
        setTimeout(function(){btnCopy.classList.remove('ok');btnLabel.textContent='Copy image';},1800);
      })
      .catch(function(){alert('Clipboard write failed \u2014 try right-clicking the QR code.');});
  });
});

btnSave.addEventListener('click',function(){
  getBlob(function(blob){
    if(!blob)return;
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='qrcode.png';a.click();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
  });
});
</script>
</body>
</html>
