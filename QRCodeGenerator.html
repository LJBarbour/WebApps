<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #FAF6EE;
    --paper:       #F2EBE0;
    --ink:         #2C2825;
    --ink-mid:     #6B5E52;
    --ink-light:   #A8998C;
    --accent:      #8B5E3C;
    --accent-soft: #C49A72;
    --border:      #DDD5C8;
    --white:       #FFFFFF;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 3rem 1.5rem 4rem;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 2rem;
    letter-spacing: -0.01em;
    color: var(--ink);
    line-height: 1.15;
  }

  header p {
    margin-top: 0.4rem;
    font-size: 13px;
    color: var(--ink-mid);
    font-weight: 400;
  }

  /* ── Main card ── */
  .card {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  /* ── Textarea ── */
  .input-wrap {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-mid);
    font-family: 'DM Sans', sans-serif;
  }

  textarea {
    width: 100%;
    min-height: 80px;
    resize: vertical;
    padding: 0.75rem 0.9rem;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    line-height: 1.55;
    outline: none;
    transition: border-color 0.15s;
  }

  textarea::placeholder { color: var(--ink-light); }
  textarea:focus { border-color: var(--accent-soft); }

  /* ── QR output area ── */
  .qr-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  .qr-frame {
    width: 272px;
    height: 272px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: box-shadow 0.2s;
    overflow: hidden;
  }

  .qr-frame.has-code {
    box-shadow: 0 2px 12px rgba(44,40,37,0.08);
  }

  #qr-output {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* qrcodejs renders an img or canvas — nudge to exact size */
  #qr-output img,
  #qr-output canvas {
    display: block;
  }

  .qr-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    color: var(--ink-light);
    font-size: 12px;
    text-align: center;
    padding: 1rem;
    user-select: none;
  }

  .qr-placeholder svg {
    opacity: 0.35;
  }

  /* ── Copy button ── */
  .btn-copy {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.55rem 1.4rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 5px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s, transform 0.1s;
    user-select: none;
  }

  .btn-copy:hover  { background: #7a5234; }
  .btn-copy:active { transform: scale(0.97); }

  .btn-copy:disabled {
    background: var(--ink-light);
    cursor: default;
  }

  .btn-copy.copied {
    background: #4A7C59;
  }

  .btn-copy svg { flex-shrink: 0; }

  /* ── Footer ── */
  footer {
    margin-top: 3rem;
    font-size: 11.5px;
    color: var(--ink-light);
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>QR Code Generator</h1>
  <p>Paste any URL or text — your code appears instantly.</p>
</header>

<div class="card">

  <div class="input-wrap">
    <label for="qr-input">Text or URL</label>
    <textarea
      id="qr-input"
      placeholder="https://example.com"
      autocomplete="off"
      spellcheck="false"
    ></textarea>
  </div>

  <div class="qr-wrap">
    <div class="qr-frame" id="qr-frame">
      <div id="qr-placeholder" class="qr-placeholder">
        <!-- Simple grid icon -->
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4"  y="4"  width="16" height="16" rx="2" fill="currentColor"/>
          <rect x="28" y="4"  width="16" height="16" rx="2" fill="currentColor"/>
          <rect x="4"  y="28" width="16" height="16" rx="2" fill="currentColor"/>
          <rect x="28" y="28" width="6"  height="6"  rx="1" fill="currentColor"/>
          <rect x="38" y="28" width="6"  height="6"  rx="1" fill="currentColor"/>
          <rect x="28" y="38" width="6"  height="6"  rx="1" fill="currentColor"/>
          <rect x="38" y="38" width="6"  height="6"  rx="1" fill="currentColor"/>
        </svg>
        <span>Your QR code will appear here</span>
      </div>
      <div id="qr-output" style="display:none;"></div>
    </div>

    <button class="btn-copy" id="btn-copy" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      <span id="btn-label">Copy image</span>
    </button>
  </div>

</div>

<footer>Barbour Research Group &nbsp;·&nbsp; University of Lincoln</footer>

<script>
  var qrInstance   = null;
  var lastText     = '';
  var debounceTimer;
  var QR_SIZE      = 256;

  var input     = document.getElementById('qr-input');
  var output    = document.getElementById('qr-output');
  var frame     = document.getElementById('qr-frame');
  var placeholder = document.getElementById('qr-placeholder');
  var btnCopy   = document.getElementById('btn-copy');
  var btnLabel  = document.getElementById('btn-label');

  function generateQR(text) {
    if (!text) {
      showPlaceholder();
      return;
    }
    placeholder.style.display = 'none';
    output.style.display = 'flex';
    frame.classList.add('has-code');

    if (!qrInstance) {
      output.innerHTML = '';
      qrInstance = new QRCode(output, {
        text: text,
        width:  QR_SIZE,
        height: QR_SIZE,
        colorDark:  '#2C2825',
        colorLight: '#FFFFFF',
        correctLevel: QRCode.CorrectLevel.M
      });
    } else {
      qrInstance.makeCode(text);
    }
    btnCopy.disabled = false;
  }

  function showPlaceholder() {
    placeholder.style.display = 'flex';
    output.style.display = 'none';
    frame.classList.remove('has-code');
    btnCopy.disabled = true;
    qrInstance = null;
    output.innerHTML = '';
  }

  input.addEventListener('input', function () {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function () {
      var text = input.value.trim();
      if (text !== lastText) {
        lastText = text;
        generateQR(text);
      }
    }, 180);
  });

  btnCopy.addEventListener('click', function () {
    // Try canvas first (Chrome), fall back to img element
    var canvas = output.querySelector('canvas');
    var img    = output.querySelector('img');

    function flashCopied() {
      btnCopy.classList.add('copied');
      btnLabel.textContent = 'Copied!';
      setTimeout(function () {
        btnCopy.classList.remove('copied');
        btnLabel.textContent = 'Copy image';
      }, 1800);
    }

    if (canvas) {
      canvas.toBlob(function (blob) {
        navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ]).then(flashCopied).catch(function () {
          alert('Clipboard write failed — try right-clicking the QR code and copying the image directly.');
        });
      });
    } else if (img) {
      // Redraw img onto a temp canvas then copy
      var tmp = document.createElement('canvas');
      tmp.width  = QR_SIZE;
      tmp.height = QR_SIZE;
      var ctx = tmp.getContext('2d');
      ctx.drawImage(img, 0, 0);
      tmp.toBlob(function (blob) {
        navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ]).then(flashCopied).catch(function () {
          alert('Clipboard write failed — try right-clicking the QR code and copying the image directly.');
        });
      });
    }
  });
</script>
</body>
</html>
