// ═══════════════════════════════════════════════════════
//  COLLECTION: structures found in files, folders and ZIP archives
//  (one entry per CIF data block that holds cell or atom data)
// ═══════════════════════════════════════════════════════
const CIF_EXT=/\.cif$/i,ZIP_EXT=/\.zip$/i;
const STRUCT_TEST=/_cell_length_a|_atom_site_fract_x|_atom_site_label/i;
const MAX_ENTRIES=5000,MAX_BYTES=400*1024*1024;
let NAV=null;   // {entries:[{label,path,text}], index, name, kind, stamp}

function splitCifBlocks(text){
  const starts=[],n=text.length;let pos=0,inText=false;
  while(pos<n){
    let nl=text.indexOf('\n',pos);if(nl<0)nl=n;
    const c=text.charCodeAt(pos);
    if(c===59)inText=!inText;            // ';' in column 1 opens/closes a text field
    else if(!inText&&(c===100||c===68||c===32||c===9)){
      const m=/^\s*data_(\S*)/i.exec(text.slice(pos,Math.min(nl,pos+200)));
      if(m)starts.push({at:pos,raw:m[1]});
    }
    pos=nl+1;
  }
  const out=[];
  starts.forEach((s,i)=>{
    const body=text.slice(s.at,i+1<starts.length?starts[i+1].at:n);
    if(!STRUCT_TEST.test(body))return;
    const csd=/^CSD_CIF_(.+)$/i.exec(s.raw);
    out.push({label:csd?csd[1]:(s.raw||'(unnamed)'),text:body});
  });
  return out;
}
function entriesFromFiles(files){
  const entries=[];let bad=0;
  files.forEach(f=>{
    const blocks=splitCifBlocks(f.text);
    if(!blocks.length){bad++;return;}
    if(blocks.length===1)entries.push({label:f.path.split('/').pop().replace(/\.[^.]+$/,''),path:f.path,text:blocks[0].text});
    else blocks.forEach(b=>entries.push({label:b.label,path:f.path+' › '+b.label,text:b.text}));
  });
  const seen={};
  entries.forEach(e=>{seen[e.label]=(seen[e.label]||0)+1;});
  entries.forEach(e=>{if(seen[e.label]>1)e.label=e.path.replace(/\.[^.\/›]+(?= ›|$)/,'');});
  return{entries,bad};
}

// ── ZIP reading (hand-rolled container; deflate via the browser's DecompressionStream) ──
function u16(dv,o){return dv.getUint16(o,true);}
function u32(dv,o){return dv.getUint32(o,true);}
async function readZip(buf,prefix,budget){
  const dv=new DataView(buf),n=buf.byteLength;let eocd=-1;
  for(let p=n-22;p>=Math.max(0,n-65557);p--)if(u32(dv,p)===0x06054b50){eocd=p;break;}
  if(eocd<0)throw new Error('not a ZIP file (or a damaged one)');
  const count=u16(dv,eocd+10);let cd=u32(dv,eocd+16);const out=[];
  const dec=new TextDecoder('utf-8');
  for(let k=0;k<count&&cd+46<=n;k++){
    if(u32(dv,cd)!==0x02014b50)break;
    const flags=u16(dv,cd+8),method=u16(dv,cd+10),csize=u32(dv,cd+20),usize=u32(dv,cd+24);
    const nlen=u16(dv,cd+28),xlen=u16(dv,cd+30),clen=u16(dv,cd+32),lho=u32(dv,cd+42);
    const name=dec.decode(new Uint8Array(buf,cd+46,nlen)).split('\\').join('/');   // PowerShell 5 writes backslashes
    cd+=46+nlen+xlen+clen;
    const base=name.split('/').pop();
    if(/\/$/.test(name)||/(^|\/)__MACOSX\//.test(name)||/^\._/.test(base))continue;
    const isZip=ZIP_EXT.test(name);
    if(!CIF_EXT.test(name)&&!isZip)continue;
    if(flags&1){budget.skipped.push(prefix+name+' (encrypted)');continue;}
    if(csize===0xFFFFFFFF||usize===0xFFFFFFFF||lho===0xFFFFFFFF){budget.skipped.push(prefix+name+' (ZIP64)');continue;}
    if(out.length+budget.count>=MAX_ENTRIES||budget.bytes+usize>MAX_BYTES){budget.truncated=true;break;}
    if(u32(dv,lho)!==0x04034b50)continue;
    const start=lho+30+u16(dv,lho+26)+u16(dv,lho+28),raw=new Uint8Array(buf,start,csize);let bytes;
    try{
      if(method===0)bytes=raw;
      else if(method===8){
        if(typeof DecompressionStream!=='function')throw new Error('this browser cannot unpack compressed ZIP entries');
        bytes=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      }else{budget.skipped.push(prefix+name+' (compression method '+method+')');continue;}
    }catch(e){budget.skipped.push(prefix+name+' ('+e.message+')');continue;}
    budget.bytes+=bytes.length;
    if(isZip){
      try{(await readZip(bytes.slice().buffer,prefix+name+'/',budget)).forEach(x=>out.push(x));}
      catch(e){budget.skipped.push(prefix+name+' ('+e.message+')');}
    }else out.push({path:prefix+name,text:dec.decode(bytes)});
  }
  return out;
}

// ── folders: dropped directory entries (old API) or File System Access handles (new API) ──
function walkEntry(entry,path,errs){
  const fail=e=>errs.push((e&&(e.name||e.message))||'error');
  return new Promise(resolve=>{
    if(entry.isFile){entry.file(f=>resolve([{path:path+entry.name,file:f}]),e=>{fail(e);resolve([]);});return;}
    if(!entry.isDirectory){resolve([]);return;}
    const reader=entry.createReader();let all=[];
    (function more(){
      reader.readEntries(batch=>{
        if(!batch.length){
          Promise.all(all.map(e=>walkEntry(e,path+entry.name+'/',errs))).then(lists=>resolve([].concat.apply([],lists)));
          return;
        }
        all=all.concat(Array.prototype.slice.call(batch));more();
      },e=>{fail(e);resolve([]);});
    })();
  });
}
async function walkHandle(h,path,errs){
  try{
    if(h.kind==='file')return[{path:path+h.name,file:await h.getFile()}];
    const out=[];
    for await(const c of h.values()){(await walkHandle(c,path+h.name+'/',errs)).forEach(x=>out.push(x));}
    return out;
  }catch(e){errs.push(e.name||e.message||'error');return[];}
}
async function readFileList(list){
  const budget={count:0,bytes:0,skipped:[],truncated:false},out=[];
  list.sort((p,q)=>p.path.localeCompare(q.path,undefined,{numeric:true,sensitivity:'base'}));
  for(const it of list){
    if(out.length>=MAX_ENTRIES||budget.bytes>MAX_BYTES){budget.truncated=true;break;}
    try{
      if(ZIP_EXT.test(it.path)){(await readZip(await it.file.arrayBuffer(),it.path+'/',budget)).forEach(x=>out.push(x));}
      else if(CIF_EXT.test(it.path)){budget.bytes+=it.file.size;out.push({path:it.path,text:await it.file.text()});}
    }catch(e){budget.skipped.push(it.path+' ('+e.message+')');}
    budget.count=out.length;
  }
  return{files:out,budget};
}

// ── status line ──
function setMsg(text,isErr){const m=$('msg');m.textContent=text||'';m.classList.toggle('err',!!isErr);}
const tick=()=>new Promise(r=>setTimeout(r,20));

// ── open a collection (single CIF, several files, folder, ZIP) ──
async function openCollection(list,kind,name){
  if(!list.length){setMsg('No files found.',true);return;}
  setMsg('');
  $('output').innerHTML='<div class="loading">Reading '+(kind==='zip'?'the ZIP archive':list.length+' file'+(list.length>1?'s':''))+'…</div>';
  await tick();
  let r;
  try{r=await readFileList(list);}
  catch(e){clearResults();setMsg('Could not read '+(name||'the files')+': '+e.message,true);return;}
  const ex=entriesFromFiles(r.files),entries=ex.entries,notes=[];
  if(ex.bad)notes.push(ex.bad+' file'+(ex.bad>1?'s':'')+' without cell or atom data skipped');
  if(r.budget.skipped.length)notes.push(r.budget.skipped.length+' unreadable: '+r.budget.skipped.slice(0,3).join(', ')+(r.budget.skipped.length>3?'…':''));
  if(r.budget.truncated)notes.push('only the first '+entries.length+' were read (limit '+MAX_ENTRIES+' files or '+(MAX_BYTES>>20)+' MB)');
  if(!entries.length){
    clearResults();
    setMsg('No CIF data blocks with cell or atom data found in '+(name||'what was dropped')+(notes.length?' · '+notes.join(' · '):'')+'.',true);
    return;
  }
  NAV={entries,index:0,name:name||'',kind,stamp:String(Date.now())};
  $('topbar').classList.add('show');
  $('dropZone').classList.add('compact');
  navGo(0);
  setMsg(entries.length>1?(name?name+': ':'')+entries.length+' structures found. Choose one in the navigator; only the selected structure is processed.'+(notes.length?' · '+notes.join(' · '):''):notes.join(' · '),false);
}

// ── navigator: ◂ ▸ arrows, a searchable list, and a clickable position strip ──
const KIND_LABEL={folder:'FOLDER',zip:'ZIP',files:'FILES',cif:'CIF'};
const POP={list:[],hi:0};
function syncNav(){
  const bar=$('cif-nav');
  if(!NAV||NAV.entries.length<2){bar.classList.remove('show');closePop();return;}
  const cur=NAV.entries[NAV.index],n=NAV.entries.length;
  $('cn-title').textContent=KIND_LABEL[NAV.kind]||'CIF';
  $('cn-name').textContent=cur.label;
  $('cn-current').title=cur.path+'  ·  press / to search the list';
  $('cn-count').textContent=(NAV.index+1)+' / '+n;
  $('cn-prev').disabled=NAV.index<=0;
  $('cn-next').disabled=NAV.index>=n-1;
  const t=$('cn-ticks');
  if(t.getAttribute('data-for')!==NAV.stamp){
    t.innerHTML=n<=150?NAV.entries.map((e,i)=>'<button class="tk" type="button" data-i="'+i+'" title="'+esc(e.label)+'" aria-label="'+esc(e.label)+'"></button>').join(''):'<div class="tk-bar"><b></b></div>';
    t.setAttribute('data-for',NAV.stamp);
  }
  if(n<=150){const on=t.querySelector('.tk.on');if(on)on.classList.remove('on');const c=t.children[NAV.index];if(c)c.classList.add('on');}
  else t.querySelector('.tk-bar b').style.width=((NAV.index+1)/n*100)+'%';
  bar.title=NAV.name?NAV.name+': '+n+' structures':'';
  bar.classList.add('show');
}
function navGo(i){
  if(!NAV||i<0||i>=NAV.entries.length)return;
  NAV.index=i;
  syncNav();
  renderEntry(NAV.entries[i],i);
}
function renderPopList(q){
  const words=q.trim().toLowerCase().split(/\s+/).filter(Boolean),idx=[];
  NAV.entries.forEach((e,i)=>{const s=(e.label+' '+e.path).toLowerCase();if(words.every(w=>s.includes(w)))idx.push(i);});
  POP.list=idx;POP.hi=Math.max(0,idx.indexOf(NAV.index));
  const shown=idx.slice(0,300);
  $('cn-list').innerHTML=shown.length?shown.map((i,k)=>'<button class="cn-item'+(i===NAV.index?' cur':'')+(k===POP.hi?' hi':'')+'" data-i="'+i+'" type="button" role="option">'+
    '<span class="ci-n">'+(i+1)+'</span><span class="ci-l">'+esc(NAV.entries[i].label)+'</span><span class="ci-p">'+esc(NAV.entries[i].path)+'</span></button>').join('')+
    (idx.length>300?'<div class="cn-more">'+(idx.length-300)+' more — keep typing to narrow the list</div>':''):'<div class="cn-more">No structure matches</div>';
  const hi=$('cn-list').querySelector('.hi');if(hi)hi.scrollIntoView({block:'nearest'});
}
function openPop(){
  if(!NAV||NAV.entries.length<2)return;
  $('cn-pop').hidden=false;$('cn-filter').value='';renderPopList('');$('cn-filter').focus();
}
function closePop(){$('cn-pop').hidden=true;}
function movePopHi(d){
  const items=$('cn-list').querySelectorAll('.cn-item');if(!items.length)return;
  POP.hi=Math.max(0,Math.min(items.length-1,POP.hi+d));
  items.forEach((b,k)=>b.classList.toggle('hi',k===POP.hi));
  items[POP.hi].scrollIntoView({block:'nearest'});
}
$('cn-prev').addEventListener('click',()=>{if(NAV)navGo(NAV.index-1);});
$('cn-next').addEventListener('click',()=>{if(NAV)navGo(NAV.index+1);});
$('cn-current').addEventListener('click',()=>{if($('cn-pop').hidden)openPop();else closePop();});
$('cn-filter').addEventListener('input',()=>renderPopList($('cn-filter').value));
$('cn-filter').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();movePopHi(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();movePopHi(-1);}
  else if(e.key==='Enter'){e.preventDefault();const i=POP.list[POP.hi];if(i!==undefined){closePop();navGo(i);}}
  else if(e.key==='Escape'){closePop();$('cn-current').focus();}
});
$('cn-list').addEventListener('click',e=>{const b=e.target.closest('.cn-item');if(b){closePop();navGo(+b.dataset.i);}});
$('cn-ticks').addEventListener('click',e=>{
  const tk=e.target.closest('.tk');
  if(tk){navGo(+tk.dataset.i);return;}
  const bar=e.target.closest('.tk-bar');
  if(bar&&NAV){const r=bar.getBoundingClientRect();navGo(Math.min(NAV.entries.length-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*NAV.entries.length))));}
});
document.addEventListener('click',e=>{if(!$('cn-pop').hidden&&!e.target.closest('#cif-nav'))closePop();});
document.addEventListener('keydown',e=>{
  if(!NAV||NAV.entries.length<2||e.ctrlKey||e.metaKey||e.altKey)return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(e.key==='['||e.key===']'){e.preventDefault();navGo(NAV.index+(e.key===']'?1:-1));}
  else if(e.key==='/'){e.preventDefault();openPop();}
});

// ═══════════════════════════════════════════════════════
//  FILE HANDLING  (drop zone, file picker, folder picker)
// ═══════════════════════════════════════════════════════
const dz=$('dropZone'),fi=$('fileInput'),fo=$('folderInput');

function handleDrop(dt){
  const items=dt.items?Array.from(dt.items):[];
  // both APIs must be asked for now, while the drop event is live
  const handles=items.map(it=>it.kind==='file'&&it.getAsFileSystemHandle?it.getAsFileSystemHandle():null).filter(Boolean);
  if(handles.length)handles[0].then(h=>{if(h)LAST_SRC=h;},()=>{});   // so the Save dialog opens where this came from
  const entries=items.map(it=>it.kind==='file'&&it.webkitGetAsEntry?it.webkitGetAsEntry():null).filter(Boolean);
  const files=dt.files?Array.from(dt.files):[];
  const hasDir=entries.some(e=>e.isDirectory);
  if(!hasDir){
    if(!files.length)return;
    openCollection(files.map(f=>({path:f.name,file:f})),files.length===1?(ZIP_EXT.test(files[0].name)?'zip':'cif'):'files',files.length===1?files[0].name:files.length+' files');
    return;
  }
  const n=Math.max(entries.length,handles.length),first=entries[0]||{};
  const dirName=n===1?(first.name||'folder'):n+' items';
  const kind=n===1?'folder':'files';
  (async()=>{
    const errs=[];let list=[];
    if(handles.length){
      let hs=await Promise.all(handles.map(p=>p.then(h=>h,e=>{errs.push(e.name||e.message);return null;})));
      hs=hs.filter(Boolean);
      for(const h of hs)(await walkHandle(h,'',errs)).forEach(x=>list.push(x));
    }
    if(!list.length&&entries.length){
      const lists=await Promise.all(entries.map(e=>walkEntry(e,'',errs)));
      list=[].concat.apply([],lists);
    }
    if(!list.length){
      setMsg('The browser would not let the page read the folder "'+dirName+'"'+(errs.length?' ('+errs[0]+')':'')+'. Use the "Choose folder…" button and pick it there instead.',true);
      return;
    }
    openCollection(list,kind,dirName);
  })();
}

document.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag');});
document.addEventListener('dragleave',e=>{if(e.relatedTarget===null)dz.classList.remove('drag');});
document.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');handleDrop(e.dataTransfer);});
// Click-to-browse uses the File System Access pickers where they exist (they give a handle, so the Save dialog can start
// in the same folder); everywhere else, and on any failure other than cancelling, the ordinary file inputs take over.
async function pickFiles(){
  if(window.showOpenFilePicker){
    try{
      const opts={multiple:true,types:[{description:'CIF files and ZIP archives',accept:{'text/plain':['.cif'],'application/zip':['.zip']}}]};
      if(LAST_SRC)opts.startIn=LAST_SRC;
      const hs=await window.showOpenFilePicker(opts);
      if(!hs.length)return;
      LAST_SRC=hs[0];
      const files=await Promise.all(hs.map(h=>h.getFile()));
      openCollection(files.map(f=>({path:f.name,file:f})),files.length===1?(ZIP_EXT.test(files[0].name)?'zip':'cif'):'files',files.length===1?files[0].name:files.length+' files');
      return;
    }catch(err){if(err&&err.name==='AbortError')return;}
  }
  fi.click();
}
async function pickFolder(){
  if(window.showDirectoryPicker){
    try{
      const opts={};if(LAST_SRC)opts.startIn=LAST_SRC;
      const dh=await window.showDirectoryPicker(opts);
      LAST_SRC=dh;
      const list=await walkHandle(dh,'',[]);
      openCollection(list,'folder',dh.name);
      return;
    }catch(err){if(err&&err.name==='AbortError')return;}
  }
  fo.click();
}
dz.addEventListener('click',pickFiles);
$('folderBtn').addEventListener('click',e=>{e.stopPropagation();pickFolder();});
fi.addEventListener('change',e=>{
  const files=Array.from(e.target.files);if(!files.length)return;
  openCollection(files.map(f=>({path:f.name,file:f})),files.length===1?(ZIP_EXT.test(files[0].name)?'zip':'cif'):'files',files.length===1?files[0].name:files.length+' files');
});
fo.addEventListener('change',e=>{
  const files=Array.from(e.target.files);if(!files.length)return;
  const list=files.map(f=>({path:f.webkitRelativePath||f.name,file:f}));
  openCollection(list,'folder',(list[0].path.split('/')[0])||'folder');
});
</script>
