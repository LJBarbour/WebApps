<style>
:root{--bg:#0a0e1a;--surface:#111827;--surface2:#1a2035;--border:rgba(255,255,255,0.09);
  --accent:#4FC3F7;--accent2:#FFD54F;--bad:#EF5350;--good:#81C784;--warn:#FFB74D;
  --text:#E8EAF6;--muted:#8FA0AE;--code:#B3E5FC;
  --font-mono:'Space Mono',ui-monospace,Consolas,monospace;
  --font-sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --canvas-bg:#0d1322;--grid:rgba(255,255,255,0.07);--axis:#78909C;
  --obs:#FFD54F;--calc:#4FC3F7;--diff:#EF5350;--tick:#81C784;--tick2:#CE93D8;
  --note-bg:rgba(79,195,247,0.08);--warn-bg:rgba(255,183,77,0.09);--key-bg:rgba(129,199,132,0.09);
  --val-bg:rgba(79,195,247,0.1);--hover:rgba(79,195,247,0.08);--shadow:0 2px 10px rgba(0,0,0,.35);}
:root[data-theme="light"]{--bg:#FAF6EE;--surface:#FFFFFF;--surface2:#EDE6D4;--border:#CEC3AA;
  --accent:#3F6A9E;--accent2:#B7791F;--bad:#B5533C;--good:#4F7A55;--warn:#B7791F;
  --text:#2C2416;--muted:#6E6248;--code:#2F5D8A;
  --canvas-bg:#F3EDE0;--grid:rgba(44,36,22,0.09);--axis:#6E6248;
  --obs:#B7791F;--calc:#2F5D8A;--diff:#B5533C;--tick:#4F7A55;--tick2:#7B3F98;
  --note-bg:rgba(63,106,158,0.08);--warn-bg:rgba(183,121,31,0.1);--key-bg:rgba(79,122,85,0.1);
  --val-bg:rgba(63,106,158,0.1);--hover:rgba(63,106,158,0.08);--shadow:0 2px 8px rgba(44,36,22,.12);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15px;line-height:1.6;display:flex;flex-direction:column;overflow:hidden;}
header{padding:9px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-shrink:0;background:var(--surface);}
header h1{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.05em;white-space:nowrap;}
header .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hspacer{flex:1;}
.menu-btn{display:none;appearance:none;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 9px;font-size:16px;cursor:pointer;}
.hsel{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
.hsel select{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:4px 6px;font-family:var(--font-sans);font-size:12px;max-width:230px;}
.hbtn{appearance:none;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:14px;cursor:pointer;}
.hbtn:hover{color:var(--accent);border-color:var(--accent);}
.layout{flex:1;display:grid;grid-template-columns:240px 1fr;min-height:0;}
nav{border-right:1px solid var(--border);background:var(--surface);overflow-y:auto;padding:10px 0 30px;}
nav .grp{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 16px 4px;}
nav a{display:flex;gap:9px;align-items:baseline;padding:6px 16px;font-size:13px;color:var(--text);text-decoration:none;cursor:pointer;border-left:3px solid transparent;}
nav a:hover{background:var(--hover);}
nav a.active{background:var(--hover);border-left-color:var(--accent);color:var(--accent);}
nav a .num{font-family:var(--font-mono);font-size:10px;color:var(--muted);min-width:18px;}
nav a .vis{margin-left:auto;font-size:9px;color:var(--good);opacity:0;}
nav a.seen .vis{opacity:1;}
main{overflow-y:auto;padding:22px 28px 80px;scroll-behavior:smooth;}
.chapter{max-width:1120px;margin:0 auto;}
.chapter h2{font-size:26px;font-weight:600;margin-bottom:4px;letter-spacing:-.01em;}
.chapter .kicker{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
.chapter .lead{font-size:16.5px;color:var(--muted);margin:6px 0 18px;max-width:820px;}
.chapter h3{font-size:18px;font-weight:600;margin:30px 0 8px;padding-top:6px;border-top:1px solid var(--border);}
.chapter h4{font-size:14px;font-weight:600;margin:16px 0 4px;color:var(--accent);}
.chapter p{margin:8px 0;max-width:860px;}
.chapter ul,.chapter ol{margin:8px 0 8px 22px;max-width:840px;}
.chapter li{margin:3px 0;}
.chapter code,.mono{font-family:var(--font-mono);font-size:.88em;color:var(--code);}
.eq{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:16px;text-align:center;padding:10px;margin:10px 0;background:var(--surface);border:1px solid var(--border);border-radius:8px;max-width:860px;}
.callout{border-left:3px solid var(--accent);background:var(--note-bg);padding:9px 14px;border-radius:0 8px 8px 0;margin:12px 0;max-width:860px;font-size:14px;}
.callout b.t{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;color:var(--accent);}
.callout.sc{border-left-color:var(--accent2);background:rgba(255,213,79,0.07);} .callout.sc b.t{color:var(--accent2);}
.callout.warn{border-left-color:var(--warn);background:var(--warn-bg);} .callout.warn b.t{color:var(--warn);}
.callout.key{border-left-color:var(--good);background:var(--key-bg);} .callout.key b.t{color:var(--good);}
details.qa{border:1px solid var(--border);border-radius:8px;margin:8px 0;max-width:860px;background:var(--surface);}
details.qa summary{padding:8px 14px;cursor:pointer;font-size:14px;font-weight:500;}
details.qa div.ans{padding:2px 14px 10px;font-size:14px;color:var(--muted);}
table.tbl{border-collapse:collapse;font-size:13px;margin:10px 0;max-width:100%;}
table.tbl th{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:5px 10px;border-bottom:1px solid var(--border);}
table.tbl td{padding:4px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
table.tbl tr.sel td{background:var(--hover);}
table.tbl tr.clk{cursor:pointer;} table.tbl tr.clk:hover td{background:var(--hover);}
table.tbl td.num,table.tbl th.num{text-align:right;font-family:var(--font-mono);font-size:12px;}
.good{color:var(--good);} .bad{color:var(--bad);} .warnc{color:var(--warn);} .muted{color:var(--muted);}
/* lab cards */
.lab{border:1px solid var(--border);background:var(--surface);border-radius:12px;margin:16px 0 22px;box-shadow:var(--shadow);}
.lab-h{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);}
.lab-h .tag{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--surface);background:var(--accent);padding:2px 7px;border-radius:9px;}
.lab-h .ttl{font-weight:600;font-size:14px;}
.lab-h .grow{flex:1;}
.lab-b{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:0;}
.lab-b.one{grid-template-columns:minmax(0,1fr);}
.lab-main{padding:12px 14px;min-width:0;}
.lab-ctrl{border-left:1px solid var(--border);padding:12px 14px;background:var(--surface2);border-radius:0 0 12px 0;max-height:760px;overflow-y:auto;}
.lab-b.one .lab-ctrl{border-left:none;border-top:1px solid var(--border);border-radius:0 0 12px 12px;display:flex;flex-wrap:wrap;gap:6px 22px;max-height:none;}
.lab-b.one .lab-ctrl .cg{min-width:230px;flex:1 1 230px;}
canvas.cv{display:block;width:100%;border:1px solid var(--border);border-radius:8px;background:var(--canvas-bg);touch-action:none;}
.cg{margin-bottom:11px;}
.cg>label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px;gap:8px;}
.cg>label .val{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);background:var(--val-bg);padding:1px 6px;border-radius:3px;white-space:nowrap;}
.cg input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:var(--border);outline:none;cursor:pointer;}
.cg input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--surface);}
.cg input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--surface);}
.cg select,.cg input[type=text],.cg input[type=number]{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:4px 6px;font-family:var(--font-sans);font-size:13px;}
.cg.chk label{justify-content:flex-start;cursor:pointer;color:var(--text);font-size:13px;margin:0;}
.cg.chk input{accent-color:var(--accent);}
.cgh{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;padding-top:8px;border-top:1px solid var(--border);width:100%;}
.cgh:first-child{margin-top:0;border-top:none;padding-top:0;}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font-sans);font-size:12.5px;padding:6px 12px;border-radius:7px;cursor:pointer;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:600;}
.btn.primary:hover{filter:brightness(1.1);color:var(--surface);}
.btn:disabled{opacity:.45;cursor:default;}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;}
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{padding:3px 9px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--muted);font-size:11.5px;cursor:pointer;font-family:var(--font-sans);}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent);background:var(--hover);}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin:8px 0;}
.stat{border:1px solid var(--border);border-radius:8px;padding:5px 9px;background:var(--surface);}
.stat .k{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.stat .v{font-family:var(--font-mono);font-size:15px;color:var(--text);}
.stat .v.good{color:var(--good);} .stat .v.bad{color:var(--bad);} .stat .v.warnc{color:var(--warn);}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.cap{font-size:12px;color:var(--muted);margin:3px 0 8px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:4px 0;}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;}
.legend i.dot{width:7px;height:7px;border-radius:50%;}
.progress{height:5px;border-radius:3px;background:var(--border);overflow:hidden;margin:6px 0;}
.progress>div{height:100%;background:var(--accent);width:0;transition:width .15s;}
.pill{display:inline-block;font-family:var(--font-mono);font-size:10px;padding:1px 7px;border-radius:9px;background:var(--val-bg);color:var(--accent);}
.pill.good{background:var(--key-bg);color:var(--good);} .pill.bad{background:rgba(239,83,80,.12);color:var(--bad);} .pill.warn{background:var(--warn-bg);color:var(--warn);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;max-width:760px;width:92vw;max-height:84vh;overflow:auto;padding:20px 26px;box-shadow:var(--shadow);}
.modal h3{border:none;margin-top:0;}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:14px 0;}
.flow .node{flex:1 1 150px;min-width:140px;border:1px solid var(--border);border-radius:10px;padding:9px 12px;background:var(--surface);cursor:pointer;position:relative;}
.flow .node:hover{border-color:var(--accent);background:var(--hover);}
.flow .node .n{font-family:var(--font-mono);font-size:10px;color:var(--accent);}
.flow .node .t{font-weight:600;font-size:14px;}
.flow .node .d{font-size:12px;color:var(--muted);line-height:1.4;}
.flow .node.hard{border-color:var(--warn);}
.flow .node.hard .n{color:var(--warn);}
.arrow{align-self:center;color:var(--muted);font-size:18px;}
.tip{position:fixed;pointer-events:none;z-index:60;background:var(--surface);border:1px solid var(--border);padding:4px 8px;border-radius:6px;font-family:var(--font-mono);font-size:11px;box-shadow:var(--shadow);display:none;white-space:pre;}
@media (max-width:980px){
  .layout{grid-template-columns:1fr;}
  nav{position:fixed;left:0;top:46px;bottom:0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow);}
  body.navopen nav{transform:none;}
  .menu-btn{display:inline-block;}
  .lab-b{grid-template-columns:1fr;}
  .lab-ctrl{border-left:none;border-top:1px solid var(--border);border-radius:0 0 12px 12px;max-height:none;}
  .two,.three{grid-template-columns:1fr;}
  main{padding:16px 14px 60px;}
  header .sub{display:none;}
}
@media print{header,nav{display:none;} body{overflow:visible;} main{overflow:visible;}}

<script>
/* ===== core_math.js ===== */
/* ============================================================
   core_math.js  -  numerical helpers shared by every chapter
   (seeded RNG, small linear algebra, radix-2 FFT, Levenberg-Marquardt)
   ============================================================ */
'use strict';
const TAU = Math.PI * 2, DEG = Math.PI / 180, RAD2DEG = 180 / Math.PI;

/* ---------- seeded random numbers (mulberry32) ---------- */
function makeRng(seed) {
  let a = (seed >>> 0) || 1;
  const o = {
    next() {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    gauss() {
      let u = 0, v = 0;
      while (u === 0) u = o.next();
      v = o.next();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
    },
    poisson(lam) {
      if (lam <= 0) return 0;
      if (lam < 30) {
        const L = Math.exp(-lam); let k = 0, p = 1;
        do { k++; p *= o.next(); } while (p > L);
        return k - 1;
      }
      return Math.max(0, Math.round(lam + Math.sqrt(lam) * o.gauss()));
    },
    range(lo, hi) { return lo + (hi - lo) * o.next(); },
    int(n) { return Math.floor(o.next() * n); }
  };
  return o;
}

/* ---------- 3x3 matrices stored row-major in length-9 arrays ---------- */
function mm3(A, B) {
  const C = new Array(9);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
    C[i * 3 + j] = A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j];
  return C;
}
function mv3(A, v) {
  return [A[0] * v[0] + A[1] * v[1] + A[2] * v[2],
          A[3] * v[0] + A[4] * v[1] + A[5] * v[2],
          A[6] * v[0] + A[7] * v[1] + A[8] * v[2]];
}
function det3(A) {
  return A[0] * (A[4] * A[8] - A[5] * A[7]) - A[1] * (A[3] * A[8] - A[5] * A[6]) + A[2] * (A[3] * A[7] - A[4] * A[6]);
}
function inv3(A) {
  const d = det3(A);
  return [(A[4] * A[8] - A[5] * A[7]) / d, (A[2] * A[7] - A[1] * A[8]) / d, (A[1] * A[5] - A[2] * A[4]) / d,
          (A[5] * A[6] - A[3] * A[8]) / d, (A[0] * A[8] - A[2] * A[6]) / d, (A[2] * A[3] - A[0] * A[5]) / d,
          (A[3] * A[7] - A[4] * A[6]) / d, (A[1] * A[6] - A[0] * A[7]) / d, (A[0] * A[4] - A[1] * A[3]) / d];
}
function tr3(A) { return [A[0], A[3], A[6], A[1], A[4], A[7], A[2], A[5], A[8]]; }
function dot3(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function cross3(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function norm3(a) { return Math.sqrt(dot3(a, a)); }
function sub3(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function add3(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function scl3(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function unit3(a) { const n = norm3(a) || 1; return [a[0] / n, a[1] / n, a[2] / n]; }

/* rotation matrix from a rotation vector (axis * angle) */
function rotVec(w) {
  const th = Math.sqrt(w[0] * w[0] + w[1] * w[1] + w[2] * w[2]);
  if (th < 1e-12) return [1, 0, 0, 0, 1, 0, 0, 0, 1];
  const x = w[0] / th, y = w[1] / th, z = w[2] / th, c = Math.cos(th), s = Math.sin(th), t = 1 - c;
  return [t * x * x + c, t * x * y - s * z, t * x * z + s * y,
          t * x * y + s * z, t * y * y + c, t * y * z - s * x,
          t * x * z - s * y, t * y * z + s * x, t * z * z + c];
}

/* ---------- general dense solve  (A is n*n row-major, destroyed) ---------- */
function solveLinear(A, b, n) {
  const x = Float64Array.from(b);
  for (let c = 0; c < n; c++) {
    let p = c, mx = Math.abs(A[c * n + c]);
    for (let r = c + 1; r < n; r++) { const v = Math.abs(A[r * n + c]); if (v > mx) { mx = v; p = r; } }
    if (mx < 1e-300) return null;
    if (p !== c) {
      for (let k = 0; k < n; k++) { const t = A[c * n + k]; A[c * n + k] = A[p * n + k]; A[p * n + k] = t; }
      const t = x[c]; x[c] = x[p]; x[p] = t;
    }
    const piv = A[c * n + c];
    for (let r = c + 1; r < n; r++) {
      const f = A[r * n + c] / piv;
      if (f === 0) continue;
      for (let k = c; k < n; k++) A[r * n + k] -= f * A[c * n + k];
      x[r] -= f * x[c];
    }
  }
  for (let r = n - 1; r >= 0; r--) {
    let s = x[r];
    for (let k = r + 1; k < n; k++) s -= A[r * n + k] * x[k];
    x[r] = s / A[r * n + r];
  }
  return x;
}
/* matrix inverse by Gauss-Jordan; returns null when singular */
function invertMatrix(A0, n) {
  const A = Float64Array.from(A0), I = new Float64Array(n * n);
  for (let i = 0; i < n; i++) I[i * n + i] = 1;
  for (let c = 0; c < n; c++) {
    let p = c, mx = Math.abs(A[c * n + c]);
    for (let r = c + 1; r < n; r++) { const v = Math.abs(A[r * n + c]); if (v > mx) { mx = v; p = r; } }
    if (mx < 1e-300) return null;

/* ---------- powder pattern viewer ----------
   data = {tt, y, yc, bkg, lam, ticks:[{pos:[2θ...], color, label}], diff:true}  */
class PatternView {
  constructor(cv, opt) {
    this.cv = cv; this.o = Object.assign({ h: 400, diffH: 80, tickH: 9, sqrt: false, showBkg: true }, opt || {});

    let drag = null;
    cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, x0: this.x0, x1: this.x1 }; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', e => {

    });

  }
  setData(d, keepRange) {
    this.d = d;
    const tt = d.tt, full = [tt[0], tt[tt.length - 1]];
    const changed = !this.fullRange || this.fullRange[0] !== full[0] || this.fullRange[1] !== full[1];
    if (changed) { this.fullRange = full; this.x0 = full[0]; this.x1 = full[1]; }
    else if (!keepRange) { this.x0 = full[0]; this.x1 = full[1]; }
    this.draw();
  }
  setRange(a, b) {
    const f = this.fullRange, span = b - a;
    if (span < 0.15) return;
    if (a < f[0]) { a = f[0]; b = a + span; } if (b > f[1]) { b = f[1]; a = Math.max(f[0], b - span); }
    this.x0 = a; this.x1 = b; this.draw();
  }
  zoomAt(e, f) {
    if (!this.map) return;
    const r = this.cv.getBoundingClientRect(), x = e.clientX - r.left;
    const t = this.x0 + (x - this.map.L) / (this.map.R - this.map.L) * (this.x1 - this.x0);

  }
  onHover(e) {
    if (!this.d || !this.map) return;
    const r = this.cv.getBoundingClientRect(), x = e.clientX - r.left;
    if (x < this.map.L || x > this.map.R) { hideTip(); return; }
    const t = this.x0 + (x - this.map.L) / (this.map.R - this.map.L) * (this.x1 - this.x0);
    const d = this.d, i = clamp(Math.round((t - d.tt[0]) / (d.tt[1] - d.tt[0])), 0, d.tt.length - 1);
    let s = `2θ ${d.tt[i].toFixed(3)}°`;
    if (d.lam) s += `   d ${(d.lam / (2 * Math.sin(d.tt[i] * DEG / 2))).toFixed(4)} Å`;
    s += `\nobs ${d.y[i].toFixed(0)}`; if (d.yc) s += `   calc ${d.yc[i].toFixed(0)}   Δ ${(d.y[i] - d.yc[i]).toFixed(0)}`;

    const d = this.d; if (!d) return;

    const tickH = nt * o.tickH + (nt ? 4 : 0), diffH = (d.yc && o.diffH) ? o.diffH : 0;
    const H = o.h + 0;

    ctx.clearRect(0, 0, w, h);

    const x0 = this.x0, x1 = this.x1, mx = x => L + (x - x0) / (x1 - x0) * (R - L);
    const tt = d.tt, step = tt[1] - tt[0];
    const i0 = Math.max(0, Math.floor((x0 - tt[0]) / step)), i1 = Math.min(tt.length - 1, Math.ceil((x1 - tt[0]) / step));
    let ymax = 1, ymin = 0;
    for (let i = i0; i <= i1; i++) { ymax = Math.max(ymax, d.y[i], d.yc ? d.yc[i] : 0); }
    ymax *= 1.06;
    const sq = this.o.sqrt, fy = v => sq ? Math.sqrt(Math.max(v, 0)) : v, ymx = fy(ymax);
    const my = v => mainB - fy(v) / ymx * (mainB - T);
    this.map = { L, R, T, B, mx };
    ctx.font = '10.5px ' + cssVar('--font-mono'); ctx.lineWidth = 1;
    // grid + axes
    const sx = niceStep(x1 - x0, Math.max(4, (R - L) / 80));
    ctx.fillStyle = cssVar('--muted'); ctx.strokeStyle = cssVar('--grid'); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (let v = Math.ceil(x0 / sx) * sx; v <= x1 + 1e-9; v += sx) { const x = mx(v); ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, B); ctx.stroke(); ctx.fillText(fmtTick(v, sx), x, B + 4); }
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const sy = niceStep(ymax, 4);
    for (let v = 0; v <= ymax; v += sy) { const y = my(v); ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(R, y); ctx.stroke(); ctx.fillText(v >= 1e4 ? (v / 1000).toFixed(0) + 'k' : v.toFixed(0), L - 5, y); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('2θ (°)', (L + R) / 2, h - 2);
    ctx.save(); ctx.translate(12, (T + mainB) / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'top'; ctx.fillText(sq ? 'counts (√ scale)' : 'counts', 0, -4); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(L, T - 2, R - L, h); ctx.clip();

    if (dense) { ctx.beginPath(); for (let i = i0; i <= i1; i++) { const x = mx(tt[i]), y = my(d.y[i]); i === i0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke(); }
    else for (let i = i0; i <= i1; i++) { ctx.beginPath(); ctx.arc(mx(tt[i]), my(d.y[i]), 2, 0, TAU); ctx.fill(); }
    if (d.yc) {
      ctx.strokeStyle = cssVar('--calc'); ctx.lineWidth = 1.6; ctx.beginPath();
      for (let i = i0; i <= i1; i++) { const x = mx(tt[i]), y = my(d.yc[i]); i === i0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.stroke();
    }
    // tick rows
    let ty = mainB + 6;
    (d.ticks || []).forEach(row => {
      ctx.strokeStyle = row.color || cssVar('--tick'); ctx.lineWidth = 1;
      ctx.beginPath(); for (const p of row.pos) { if (p < x0 || p > x1) continue; const x = mx(p); ctx.moveTo(x, ty); ctx.lineTo(x, ty + o.tickH - 2); } ctx.stroke();

      ctx.stroke();
      ctx.fillStyle = cssVar('--muted'); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('obs − calc  (±' + dm.toFixed(0) + ')', L + 6, top + 1);
    }
    ctx.restore();
    ctx.strokeStyle = cssVar('--axis'); ctx.beginPath(); ctx.moveTo(L, T); ctx.lineTo(L, B); ctx.lineTo(R, B); ctx.stroke();
    if (this.overlay) this.overlay(ctx, this.map, { my, mainB, i0, i1 });
  }
}

'use strict';
chapter({
  id: 'home', num: '', group: 'Start', title: 'Structures from powder diffraction data',
  render(root) {
    root.append(
      h('p', { class: 'lead' }, 'A single crystal gives you a three-dimensional reciprocal lattice. A powder gives you a one-dimensional histogram of it. Everything in this course is about what that loss costs you, and how each step of a structure determination is rebuilt to cope with it.'),
      ...sec(`
<p>You already know how to turn a set of well-resolved, individually measured reflections into a structure. With powder data the same chain of operations exists – find the cell, find the space group, get intensities, get phases, refine – but each link behaves differently, and a few of them are <i>harder in kind</i>, not just in degree. The aim of this course is that, by the end, you can look at a powder pattern and know which steps will be easy, which will fail, and why.</p>
<div class="callout sc"><b class="t">Coming from single-crystal work</b>Throughout the course, boxes like this one translate a powder concept into the single-crystal one you already know. A summary dictionary is at the bottom of this page.</div>

<h3>The central fact: reflections collapse onto one axis</h3>
<p>In a single-crystal experiment every reciprocal-lattice point <b>h</b> is measured separately, at its own orientation, as a spot. In a powder, the crystallites point in every direction, so every reciprocal-lattice vector of the same length |<b>h</b>| = 1/<i>d</i> ends up on the same Debye–Scherrer cone and is recorded at the same 2θ. Three consequences follow, and they run through the whole course:</p>
<ol>
<li><b>Information is lost</b> – the direction of <b>h</b> is gone, and with it the individual intensities of reflections that share a <i>d</i>-spacing.</li>
<li><b>Overlap is unavoidable</b> – symmetry-equivalent reflections overlap exactly (this is only multiplicity, and is harmless), but <i>accidentally</i> overlapping reflections, whose d-spacings differ by less than the peak width, cannot be separated by any measurement. The number of such overlaps rises steeply with resolution and with cell size.</li>
<li><b>Peak width is a resource</b> – the width of the peaks, set by the instrument and the sample, decides how much of the pattern you can use. A narrow-peak synchrotron pattern of a 1500 Å<sup>3</sup> cell can be nearly as informative as a single-crystal data set; a broad laboratory pattern of the same cell may not be solvable at all.</li>
</ol>

<h3>The roadmap</h3>
<p>Click a stage to jump to its chapter. Amber stages are the ones that are <i>qualitatively</i> different from the single-crystal case.</p>`),
      h('div', { class: 'flow' },
        node('1', 'The experiment', 'Radiation, geometry, counting statistics, sample problems.', 'experiment'),
        node('2', 'Peak shapes', 'Width sets resolution; the profile model is part of every later step.', 'shape'),
        node('3', 'Indexing', 'Cell from peak positions alone. Fails on impurities, zero error and poor resolution.', 'index', true),
        node('4', 'Space group', 'Absences hidden by overlap; ambiguity groups; intensity statistics.', 'sg', true),
        node('5', 'Le Bail / Pawley', 'Extract intensities without a structure. The split of overlapped peaks is not determined by the data.', 'lebail'),
        node('6', 'Structure solution', 'Reciprocal space (inorganic) or direct space (molecular). Global optimisation replaces phasing.', 'ds', true),
        node('7', 'Rietveld refinement', 'Refine the structure against every point of the profile.', 'rietveld'),
        node('8', 'Validation', 'Is it right? The difference curve, chemical sense, and what Rwp cannot tell you.', 'validate')

<h3>Three numbers to keep in mind</h3>
<p>Whether a structure can be determined from a given pattern is, to a good approximation, a question of three numbers: the number of <b>parameters</b> you must determine, the number of <b>reflections</b> that exist to the resolution you can use, and the number of <b>independent observations</b> the pattern really contains (the number of resolved peaks, or more exactly the number of peak clusters). Chapter 1 puts these numbers on a slider for any sample in the course.</p>

<h3>A dictionary from single-crystal to powder</h3>`),

<h3>How to use the course</h3>

/* Chapter 1 - From crystal to powder pattern */
'use strict';

const LATTICES = {
  cubic: { name: 'Cubic  a = 8 Å', cell: [8, 8, 8, 90, 90, 90], sg: 'Pm-3m' },
  tetragonal: { name: 'Tetragonal  a = 6, c = 10 Å', cell: [6, 6, 10, 90, 90, 90], sg: 'P4/mmm' },
  orthorhombic: { name: 'Orthorhombic  6 × 8 × 11 Å', cell: [6, 8, 11, 90, 90, 90], sg: 'Pmmm' },
  monoclinic: { name: 'Monoclinic  7 × 8 × 11 Å, β = 105°', cell: [7, 8, 11, 90, 105, 90], sg: 'P2/m' }
};
/* number of freely refinable coordinates of an atom given its site symmetry */
function freeCoordCount(sg, at) {
  const orb = atomOrbit(sg, at), n = sg.ops.length / orb.idx.length;
  // stabiliser operators: those mapping the atom onto itself
  const stab = [];
  sg.ops.forEach(o => {
    const r = mv3(o.R, [at.x, at.y, at.z]);
    let ok = true;
    for (let j = 0; j < 3; j++) { let d = r[j] + o.t[j] - [at.x, at.y, at.z][j]; d -= Math.round(d); if (Math.abs(d) > 3e-4) ok = false; }
    if (ok) stab.push(o);
  });
  const P = new Array(9).fill(0);
  stab.forEach(o => { for (let i = 0; i < 9; i++) P[i] += o.R[i] / stab.length; });
  return Math.round(P[0] + P[4] + P[8]);          // trace of the projector = dimension of the free space
}
function countFreeParams(cs) {
  if (cs.mol) { const zm = ZMOL[cs.mol.zm]; return { rigid: 6 + zm.ntors, free: 3 * zm.heavyIdx.length, natoms: zm.heavyIdx.length }; }
  const sg = sgByName(cs.sg); let n = 0;
  caseAtoms(cs).forEach(a => { n += freeCoordCount(sg, a); });
  return { rigid: n, free: n, natoms: cs.atoms.length };
}
/* number of resolved peak clusters as a function of resolution */
function clusterCurve(cs, radKey, resKey, tt1) {
  const rad = RADIATIONS[radKey], res = RESOLUTIONS[resKey];
  const prm = { U: res.U, V: res.V, W: res.W, X: res.X, Y: res.Y };
  const ci = cellInfo(cs.cell), sg = sgByName(cs.sg);
  const dminA = rad.lam / (2 * Math.sin(tt1 * DEG / 2));
  const refls = genReflections(ci, sg, dminA, false);
  const L = refls.map(r => ({ tt: ttheta(r.d, rad.lam), d: r.d })).filter(r => isFinite(r.tt)).sort((a, b) => a.tt - b.tt);
  const x = [], nU = [], nC = [];
  let clusters = 0, lastTT = -1e9, lastW = 0;
  L.forEach((r, i) => {
    const w = peakWidth(r.tt, prm).G;
    if (r.tt - lastTT > 0.6 * Math.max(w, lastW)) clusters++;
    lastTT = r.tt; lastW = w;
    if (i % 1 === 0) { x.push(1 / r.d); nU.push(i + 1); nC.push(clusters); }
  });
  // subsample for plotting
  const stride = Math.max(1, Math.floor(x.length / 300));
  return { x: x.filter((_, i) => i % stride === 0), nU: nU.filter((_, i) => i % stride === 0), nC: nC.filter((_, i) => i % stride === 0), all: { x, nU, nC } };
}

<p>A reflection with Miller indices <b>h</b> = (<i>hkl</i>) sits at the reciprocal-lattice vector <b>d</b>* = <i>h</i><b>a</b>* + <i>k</i><b>b</b>* + <i>l</i><b>c</b>*, with length 1/<i>d</i>. In a powder, every crystallite orientation is present with equal probability, so the whole sphere of radius 1/<i>d</i> is populated: all reflections with that <i>d</i> contribute to a single Debye–Scherrer ring, recorded at one value of 2θ given by Bragg's law,</p>
<div class="eq">λ = 2<i>d</i> sin θ</div>
<p>The pattern is therefore a histogram of the lengths |<b>d</b>*|, weighted by the squared structure factors, multiplicities, and the Lorentz-polarisation factor. Two kinds of overlap are hidden in that histogram, and they are very different in character:</p>
<ul>
<li><b>Exact (symmetry) overlap.</b> Reflections related by the point-group symmetry have identical |<i>F</i>|² and identical <i>d</i>. For example, (100), (010) and (001) in a cubic cell. The overlap is harmless: it is just the multiplicity <i>m</i>, which you know once you know the space group.</li>
<li><b>Accidental overlap.</b> Reflections that are <i>not</i> symmetry-related but happen to have the same or nearly the same <i>d</i>, such as (300) and (221) in a cubic cell, or reflections whose spacings differ by less than the peak width in a low-symmetry cell. Their intensities are independent, and the measurement cannot separate them.</li>

<p>Exact accidental overlap occurs by number theory in high-symmetry cells; near-overlap, which is what limits real patterns, occurs in all cells and grows with the density of reflections.</p>`));

/* Chapter 2 - The experiment */
'use strict';

/* 2theta range / step that covers the same d-range as the case's default Cu data, for another wavelength */
function rangeForRadiation(cs, radKey) {
  const cu = RADIATIONS.cu1, rad = RADIATIONS[radKey];
  const dmin = cu.lam / (2 * Math.sin((cs.tt1 || 80) * DEG / 2)), dmax = cu.lam / (2 * Math.sin((cs.tt0 || 5) * DEG / 2));
  let tt1 = 2 * Math.asin(Math.min(0.98, rad.lam / (2 * Math.max(dmin, rad.lam * 0.55)))) * RAD2DEG;
  let tt0 = 2 * Math.asin(Math.min(0.98, rad.lam / (2 * dmax))) * RAD2DEG;
  tt0 = Math.max(tt0, radKey === 'syn' ? 1 : 2);
  const step = radKey === 'syn' ? 0.004 : radKey === 'neu' ? 0.05 : radKey === 'mo1' ? 0.01 : 0.015;
  if (radKey === 'neu') { tt1 = Math.min(tt1, 160); }
  return { tt0: +tt0.toFixed(2), tt1: +Math.min(tt1, 160).toFixed(2), step };
}

chapter({
  id: 'experiment', num: '2', group: 'Foundations', title: 'The experiment',
  render(root) {
    const cs = curCase();
    root.append(h('p', { class: 'lead' }, 'Everything downstream depends on the data. This chapter lets you change the instrument and the sample, and watch what happens to the pattern that every later chapter will use.'));
    root.append(...sec(`
<h3>What goes into a powder pattern</h3>
<p>The intensity at each point of a pattern is a sum of contributions from every reflection whose profile reaches that point, on a smoothly varying background:</p>
<div class="eq"><i>y</i><sub>calc</sub>(2θ<sub><i>i</i></sub>) = <i>b</i>(2θ<sub><i>i</i></sub>) + <i>S</i> Σ<sub><b>h</b></sub> <i>m</i><sub><b>h</b></sub> <i>L</i>p(θ<sub><b>h</b></sub>) |<i>F</i><sub><b>h</b></sub>|² <i>P</i><sub><b>h</b></sub> Ω(2θ<sub><i>i</i></sub> − 2θ<sub><b>h</b></sub>)</div>
<p>The reflection positions 2θ<sub><b>h</b></sub> depend on the cell (and zero-point error); the intensities |<i>F</i><sub><b>h</b></sub>|² on the structure; the profile Ω on the instrument and the sample's microstructure; <i>P</i><sub><b>h</b></sub> on preferred orientation. Almost every chapter in this course is a different way of separating those four sets of unknowns.</p>
<div class="callout sc"><b class="t">Single-crystal analogy</b>There, positions and intensities are measured separately. Here they are entangled in one curve, which is why peak positions (indexing), peak shapes and peak areas have to be treated as separate problems and then put back together.</div>

<h3>Radiation and geometry</h3>
<ul>
<li><b>Laboratory X-rays, Cu Kα<sub>1</sub>.</b> Reflection (Bragg–Brentano) or transmission geometry with a monochromator. Cheap, fast; resolution is adequate for cells up to a few hundred Å<sup>3</sup> and for molecular crystals if you are patient and have a Johansson monochromator. Without a monochromator you must live with the Kα<sub>1</sub>/Kα<sub>2</sub> doublet, which doubles every peak and ruins indexing.</li>
<li><b>Mo Kα.</b> Shorter wavelength, so more reflections are accessible to the same 2θ range, and absorption is much lower; used in capillaries for strongly absorbing or large-cell samples. Peaks are packed closer together in 2θ, so intrinsic resolution in <i>d</i> is no better.</li>
<li><b>Synchrotron.</b> Tiny, symmetric peaks (FWHM 0.01° or less), high intensity, access to short wavelengths and to dispersion effects. This is where complex structures become tractable.</li>

<h3>Practical rules that follow from the physics</h3>

function pvHeightAreaNorm(G, eta) { return eta * 2 / (Math.PI * G) + (1 - eta) * 2 * Math.sqrt(Math.LN2 / Math.PI) / G; }   // peak height of a unit-area pseudo-Voigt
function simulatePeaks(prm, rad, positions, tt0, tt1, step, heights) {

<h3>The profile function</h3>
<p>Each reflection contributes a peaked function Ω(2θ − 2θ<sub><b>h</b></sub>) normalised to unit area, so that the <i>area</i> of the peak, not its height, is proportional to the integrated intensity. The standard choice is a <b>pseudo-Voigt</b>, a weighted sum of a Gaussian and a Lorentzian of the same full width at half maximum (FWHM):</p>
<div class="eq">Ω = η <i>L</i>(2θ, Γ) + (1 − η) <i>G</i>(2θ, Γ)</div>
<p>The Gaussian part comes mainly from the instrument and from strain distributions; the Lorentzian part from finite crystallite size and some strain. In the Thompson–Cox–Hastings (TCH) formulation, which this course uses, the Gaussian and Lorentzian widths are modelled separately,</p>
<div class="eq">Γ<sub>G</sub>² = <i>U</i> tan²θ + <i>V</i> tanθ + <i>W</i>  (+ size term) &nbsp;&nbsp;&nbsp; Γ<sub>L</sub> = <i>X</i>/cosθ + <i>Y</i> tanθ</div>
<p>and combined into one Γ and one η. <i>U, V, W</i> are the Caglioti parameters of the instrument (<i>V</i> is usually negative); <i>X</i> and <i>Y</i> carry the size and strain contributions.</p>

<h3>Sample broadening: size and strain</h3>
<p>Two sample effects add Lorentzian-like broadening with different angular dependence, which is why they can in principle be separated:</p>
<div class="eq">size (Scherrer): β = <i>K</i>λ / (<i>L</i> cosθ) &nbsp;&nbsp;&nbsp; strain: β = 4 ε tanθ</div>
<p>The size term grows towards low angle (1/cosθ), the strain term towards high angle (tanθ). A <b>Williamson–Hall plot</b> of β cosθ against 4 sinθ turns this into a straight line, whose intercept gives <i>K</i>λ/<i>L</i> and whose slope gives the strain ε. Lab 3C builds one.</p>

<h3>Asymmetry</h3>
<p>At low angle, axial divergence of the beam produces a tail towards low 2θ. It is modelled (here by a Bérar–Baldinozzi-type term) by a function that is antisymmetric about the peak centre and so redistributes intensity without changing the area. Ignored asymmetry is a classic cause of a systematic ± signature in the difference curve at low angle (Chapter 10).</p>
<div class="callout sc"><b class="t">Single-crystal analogy</b>There the mosaic spread and beam divergence set the shape of a reflection, and you integrate it away without thinking. Here the peak shape is a <i>model</i>, and it enters every intensity you extract.</div>`));

/* Chapter 4 - Indexing */
'use strict';

/* is candidate lattice equivalent to the truth?  compare distinct Q values of the two lattices */
function distinctQ(sys, p, Qmax) {
  const q = Array.from(latticeLines(sys, p, Qmax, false).Q), out = [];
  q.forEach(v => { if (!out.length || v - out[out.length - 1] > 1e-5) out.push(v); });
  return out;
}
function truthCompare(cand, cs, Qlim) {
  const ts = cs.sys === 'trigonal' ? 'hexagonal' : cs.sys;
  const tp = cellToRecip(ts, cs.cell), a = distinctQ(ts, tp, Qlim), b = distinctQ(cand.sys, cand.p, Qlim);
  const Vt = cellInfo(cs.cell).V, r = cand.V / Vt;
  const lim = Qlim * 0.96, near = (x, arr) => arr.some(v => Math.abs(v - x) <= 0.002 * Math.max(x, 0.02) + 4e-4);
  const same = a.filter(x => x < lim).every(x => near(x, b)) && b.filter(x => x < lim).every(x => near(x, a));
  if (same) return { tag: 'true lattice', cls: 'good' };
  if (Math.abs(r - Math.round(r)) < 0.03 && Math.round(r) >= 2) return { tag: 'supercell ×' + Math.round(r), cls: 'warn' };
  const ri = 1 / r; if (Math.abs(ri - Math.round(ri)) < 0.03 && Math.round(ri) >= 2) return { tag: 'subcell ÷' + Math.round(ri), cls: 'warn' };
  return { tag: 'not the true lattice', cls: 'bad' };
}
function symmetryHint(c) {
  const [a, b, cc, al, be, ga] = c.cell, eq = (x, y, t) => Math.abs(x - y) / Math.max(x, y) < (t || 0.004);
  const hints = [];
  if (c.sys === 'monoclinic' && Math.abs(be - 90) < 0.2) hints.push('β ≈ 90°: metrically orthorhombic');
  if (c.sys === 'orthorhombic' && (eq(a, b) || eq(b, cc) || eq(a, cc))) hints.push('two equal axes: metrically tetragonal');
  if (c.sys === 'tetragonal' && eq(cc, a)) hints.push('c ≈ a: metrically cubic');
  if (c.sys === 'orthorhombic' && (Math.abs(a / b * 1.7320508 - 1) < 0.01 || Math.abs(b / a * 1.7320508 - 1) < 0.01 || Math.abs(cc / a * 1.7320508 - 1) < 0.01)) hints.push('axis ratio ≈ √3: pseudo-hexagonal');
  return hints;
}

    root.append(...sec(`
<h3>Why it is an inverse problem</h3>
<p>For a given lattice, the position of every possible line follows from</p>
<div class="eq"><i>Q</i><sub><i>hkl</i></sub> = 1/<i>d</i>² = <i>h</i>²<i>A</i> + <i>k</i>²<i>B</i> + <i>l</i>²<i>C</i> + <i>hk</i>·<i>D</i> + <i>hl</i>·<i>E</i> + <i>kl</i>·<i>F</i></div>
<p>where <i>A</i> … <i>F</i> are the elements of the reciprocal metric tensor (for an orthorhombic cell <i>A</i> = 1/<i>a</i>², <i>B</i> = 1/<i>b</i>², <i>C</i> = 1/<i>c</i>² and the cross terms vanish; for monoclinic, only <i>hl</i> survives). The forward direction is trivial. The inverse – given a list of <i>Q</i><sub><i>i</i></sub> without indices, find the integers and the parameters – is a hard combinatorial problem, because you must assign an index to every line and the number of possible assignments grows explosively with the number of cell parameters.</p>
<div class="callout sc"><b class="t">Single-crystal analogy</b>There you measure the indices directly, from where each reflection sits on the detector, and the cell follows from a linear fit. The powder problem is the same fit with the <i>indices missing</i>, which is exactly what makes it a search problem.</div>

<h3>How programs solve it</h3>
<ul>
<li><b>Zone and trial-and-error methods</b> (Ito; Visser’s ITO; Werner’s TREOR). Assume the lowest lines have low indices, solve for the cell parameters from a few lines, and test against the rest.</li>
<li><b>Successive dichotomy</b> (Louër and Boultif’s DICVOL; this course’s lab). Treat the cell parameters as intervals, ask whether an interval box can possibly explain every observed line, and bisect the boxes that can. The search is exhaustive within its limits, which is its great strength.</li>
<li><b>Global search with a figure of merit</b> (McMaille’s Monte Carlo; the SVD/LSI methods in TOPAS). Sample or iterate cells and score them by how many observed lines they explain.</li>
</ul>
<p>All of them rely on <i>accurate positions of the lowest-angle lines</i> and all of them are damaged, to different degrees, by extra lines (impurities), by a zero-point error, and by missing lines.</p>

<h3>Figures of merit</h3>
<p>A trial cell is judged by how well it reproduces the first <i>N</i> lines, usually <i>N</i> = 20:</p>
<div class="eq"><i>M</i><sub>20</sub> = <i>Q</i><sub>20</sub> / (2 ⟨|Δ<i>Q</i>|⟩ <i>N</i><sub>calc</sub>) &nbsp;&nbsp;&nbsp; <i>F</i><sub><i>N</i></sub> = <i>N</i> / (⟨|Δ2θ|⟩ <i>N</i><sub>poss</sub>)</div>
<p>Here <i>N</i><sub>calc</sub> is the number of lines the cell can generate up to the 20th observed line. Both indices reward a cell that explains the lines accurately <i>and</i> penalise a cell that has so many possible lines that it could explain anything. de Wolff’s rule of thumb: <i>M</i><sub>20</sub> &gt; 10 with no more than two unindexed lines indicates a correct lattice; <i>M</i><sub>20</sub> &lt; 6 means do not believe it.</p>`));

/* chemical formula -> element counts */
function parseFormula(str) {
  const s = str.replace(/\s+/g, ''); if (!s) return null;
  const out = {}; const re = /([A-Z][a-z]?)(\d*\.?\d*)/g; let m, pos = 0;
  while ((m = re.exec(s))) { if (m.index !== pos) return null; out[m[1]] = (out[m[1]] || 0) + (m[2] ? +m[2] : 1); pos = re.lastIndex; }

}

function truthIntensityLookup(cs, ds, userCell) {
  const T = findCellTransform(cs.cell, userCell);

<h3>Fitting a pattern without a structure</h3>
<p>If you know the cell, the space group and a profile model, then every reflection’s position and shape is known, and only its <i>intensity</i> is unknown. Two ways of obtaining those intensities are in common use:</p>
<ul>
<li><b>Pawley (1981)</b> treats the intensity of each reflection as a free parameter in a least-squares fit, together with the cell, zero point, profile and background. For well-separated reflections it works perfectly. For overlapped ones the normal equations become nearly singular, because the two profiles are almost parallel vectors, and the intensities come out anti-correlated and often <b>negative</b>.</li>
<li><b>Le Bail (1988)</b> borrows the Rietveld partitioning formula and applies it with <i>current estimates</i> of the intensities instead of structure-model ones:
<div class="eq"><i>I</i><sub><i>k</i></sub><sup>new</sup> = Σ<sub><i>i</i></sub> [ <i>y</i><sub><i>i</i></sub> − <i>b</i><sub><i>i</i></sub> ] · <i>I</i><sub><i>k</i></sub> <i>P</i><sub><i>ki</i></sub> / Σ<sub><i>j</i></sub> <i>I</i><sub><i>j</i></sub> <i>P</i><sub><i>ji</i></sub></div>
At every point, the net observed intensity is shared among the reflections that overlap there in proportion to their current calculated intensities. Start with equal intensities and iterate. The scheme is stable and never gives negative values, but the split of exactly overlapped reflections stays at its starting ratio (equal) because nothing in the data can change it.</li>
</ul>
<div class="callout sc"><b class="t">Single-crystal analogy</b>This is integration without a model, but in a world where some reflections cannot be told apart. The Le Bail “equal split” is the powder equivalent of assigning a merged intensity to every member of a group of unresolved reflections.</div>

<h3>How to judge the fit</h3>
<p>The profile <i>R</i> factors compare the observed and calculated patterns point by point:</p>
<div class="eq"><i>R</i><sub>wp</sub> = [ Σ<sub><i>i</i></sub> <i>w</i><sub><i>i</i></sub>(<i>y</i><sub><i>i</i></sub> − <i>y</i><sub>c,<i>i</i></sub>)² / Σ<sub><i>i</i></sub> <i>w</i><sub><i>i</i></sub> <i>y</i><sub><i>i</i></sub>² ]<sup>½</sup> &nbsp;&nbsp;&nbsp; <i>R</i><sub>exp</sub> = [ (<i>N</i> − <i>P</i>) / Σ <i>w</i><sub><i>i</i></sub> <i>y</i><sub><i>i</i></sub>² ]<sup>½</sup> &nbsp;&nbsp;&nbsp; GoF = <i>R</i><sub>wp</sub> / <i>R</i><sub>exp</sub></div>
<p>with weights <i>w</i><sub><i>i</i></sub> = 1/σ<sub><i>i</i></sub>² = 1/<i>y</i><sub><i>i</i></sub> for counting statistics. <i>R</i><sub>exp</sub> is the best <i>R</i><sub>wp</sub> that the noise allows; the goodness of fit (GoF, or χ² = GoF²) should approach 1. Because the counts enter the weights, a pattern with high counts has a <i>smaller</i> <i>R</i><sub>exp</sub> and a larger GoF for the same model: <i>R</i><sub>wp</sub> alone is never a stand-alone measure of quality. The <b>Durbin–Watson</b> statistic checks for serial correlation of residuals (a value of 2 means uncorrelated; values well below 2 mean that the residuals have structure the model is not describing).</p>
<div class="callout key"><b class="t">Le Bail <i>R</i><sub>wp</sub> is a floor</b>A Rietveld refinement (Chapter 9) uses the same cell, profile and background but restricts the intensities to those a structure can produce. It can therefore never fit better than the Le Bail fit. The Le Bail <i>R</i><sub>wp</sub> is the benchmark that tells you how good a structure model can possibly get; if the Rietveld fit is far above it, the structure is incomplete or wrong, whereas if both are poor, the profile or background model is the problem.</div>

<h3>What a Le Bail fit gives you</h3>
<ul>
<li>The most reliable <b>cell parameters</b> (every peak contributes, not just the first twenty).</li>

<li>A diagnosis of problems, for example an <b>impurity</b> (unfitted peaks in the difference curve) or an <b>incorrect cell</b>.</li>
</ul>`));

<h3>The idea</h3>
<p>Direct methods and charge flipping need good individual intensities, which a powder pattern does not provide for overlapped reflections, and they need atomic resolution, which many molecular powder patterns lack. <b>Direct-space</b> methods take the opposite route: assume the connectivity of the molecule, and search the few degrees of freedom that remain.</p>
<ul>
<li><b>Position</b> of the molecule in the cell: 3 parameters (fractional coordinates of a reference point).</li>
<li><b>Orientation</b>: 3 parameters (a rotation vector or quaternion).</li>
<li><b>Conformation</b>: one parameter per freely rotating torsion angle (the rest of the geometry is fixed from a Z-matrix: standard bond lengths and angles).</li>
</ul>
<p>For a rigid molecule that is 6 parameters; every rotatable bond adds one. A model with 20 non-hydrogen atoms refined as free atoms would have 60: a rigid or flexible fragment replaces them with about 6–12, and that is the entire reason the method works.</p>
<div class="eq">χ² = Σ<sub><i>c</i></sub> [ <i>s</i> <i>I</i><sub>calc,<i>c</i></sub> − <i>I</i><sub>obs,<i>c</i></sub> ]² / σ<sub><i>c</i></sub>²  &nbsp;&nbsp;(+ anti-bump penalty)</div>
<p>The cost function compares calculated and observed intensities, <i>summed over clusters of overlapping reflections</i> (the sum of a cluster is a measurement; its split is not, Chapter 6). The scale factor <i>s</i> is solved analytically for each trial. In the program DASH the equivalent is a χ² that uses the full covariance matrix from a Pawley fit; the cluster form here keeps the same idea: <i>do not trust the partition, only the sum</i>. A penalty for intermolecular contacts shorter than van-der-Waals distances discards impossible packing.</p>
<div class="callout sc"><b class="t">Single-crystal analogy</b>It resembles a molecular-replacement search in macromolecular work (rotation, translation, plus flexible torsions) rather than a classical <i>ab initio</i> phasing. And like molecular replacement, it needs a good model, and a wrong model can produce an apparently reasonable solution.</div>

<h3>Why it needs global optimisation</h3>
<p>The cost function has an enormous number of local minima, because shifting a molecule by a fraction of an ångström swaps which reflections it fits. Gradient-descent refinement started from a random placement almost never finds the answer. The standard remedy is a stochastic global optimiser: <b>simulated annealing</b> (DASH, TOPAS, GSAS-II), <b>parallel tempering</b> (DASH default, which runs several replicas at different temperatures and swaps them), <b>genetic algorithms</b> (developed for this problem by the Harris group and others) or <b>Monte Carlo with a hybrid</b> (FOX, which also fits atoms and rigid fragments in the same run). The labs use simulated annealing.</p>`));

chapter({

  render(root) {

    root.append(...sec(`
<h3>The reciprocal-space toolbox, and what powder data do to it</h3>
<ul>
<li><b>Patterson methods.</b> The map of |<i>F</i>|² shows vectors between atoms; heavy-atom vectors stand out (Harker sections). It needs only intensities, and the summed |<i>F</i>|² of overlapped reflections go in correctly. The partition errors only blur the map. Patterson maps are therefore the most robust route for structures dominated by a few heavy atoms.</li>
<li><b>Direct methods.</b> Statistical relations between the phases of strong reflections (Σ<sub>2</sub> triplets, tangent formula) are evaluated with normalised structure factors <i>E</i>. They need many accurate <i>E</i> values; the equal split of overlapped reflections corrupts them in a way that grows with resolution. Programs for powder data (EXPO, SIRPOW) use the Le Bail or Pawley intensities with additional tricks (detection of overlap, Patterson-based refinement of the phases).</li>
<li><b>Charge flipping</b> (Oszlányi and Süto, 2004) alternates between the two spaces: Fourier-transform the structure factors to a density, flip the sign of everything below a small threshold δ, transform back, keep the new phases but impose the observed amplitudes, repeat. It needs no space-group information (it runs in <i>P</i>1), but atomic resolution (≈ 1.1 Å or better) and complete data. For powder data it works best with <i>histogram matching</i> and the resolution-aware treatment of overlapped reflections (Baerlocher, McCusker and Palatinus, 2007); the lab below uses the plain algorithm.</li>
</ul>
<div class="callout sc"><b class="t">Single-crystal analogy</b>These are the same tools you know from SHELXT/SIR/SUPERFLIP, but fed with intensities that are partly guesswork. The phase problem is no harder; the <i>amplitude</i> problem is what has been added.</div>

<h3>The key obstacle: reliable amplitudes</h3>
<p>For reflections that are separate in the pattern, Le Bail intensities are as good as single-crystal ones. For reflections inside a cluster they are not; and the proportion of reflections that sit in clusters grows with resolution (Chapter 1). Compare these amplitude sources in the lab:</p>
<ol>
<li><b>True |F|</b> – what a single crystal would give. Not available in practice; the control for the experiment.</li>
<li><b>Le Bail</b> – the extraction of Chapter 6, with a slider for the number of cycles.</li>
<li><b>Equal split</b> – every reflection of a cluster gets an equal share of the cluster’s intensity (a Le Bail with 0 cycles within clusters): the “no information” baseline.</li>
</ol>`));

<h3>The method</h3>
<p>Hugo Rietveld’s idea (for neutron data, 1967 and 1969) was to skip the extraction of intensities altogether: calculate the whole pattern from a structural model plus a profile model, and minimise</p>
<div class="eq"><i>S</i> = Σ<sub><i>i</i></sub> <i>w</i><sub><i>i</i></sub> ( <i>y</i><sub><i>i</i></sub><sup>obs</sup> − <i>y</i><sub><i>i</i></sub><sup>calc</sup> )²</div>
<p>over the structural parameters (coordinates, displacement parameters, occupancies), the profile parameters (cell, zero, widths, asymmetry), the scale factor and the background. Because the intensities are constrained to be those of a real structure, overlapped reflections are separated by the <i>structure</i>, which is a much better source of information than the equal split of Le Bail. That is why Rietveld refinement can use the overlapped region of the pattern for structural information, and why single-crystal-like accuracy is, in the best cases, reachable from powder data.</p>
<div class="callout sc"><b class="t">Single-crystal analogy</b>This is SHELXL against a very peculiar data set: instead of 5000 independent <i>F</i>² values you have 10<sup>4</sup> highly correlated profile points; the weights are counting statistics, the “reflection” parameters (profile) are refined together with the structure, and the correlation between neighbouring points makes the standard uncertainties too small unless a correction (Bérar and Lelann) is applied.</div>

<h3>Strategy: a sequence of stages</h3>
<p>A Rietveld refinement is a non-linear least-squares problem with many strongly correlated parameters. Turning everything on at once from a rough model leads to a divergent or false solution. The standard sequence is:</p>
<ol>
<li><b>Scale and background</b> only; check the overall level.</li>
<li>Add <b>zero point and cell</b>. The peak positions must be right before anything else makes sense.</li>
<li>Add the <b>peak shape</b> (widths, then asymmetry, then mixing).</li>
<li>Add the <b>atomic positions</b> (for molecules: the rigid-body position, orientation and torsions), with restraints.</li>
<li>Add <b>isotropic displacement parameters</b>, usually grouped (one for all atoms of one kind, or one for heavy atoms and one for H).</li>
<li>Finally, <b>preferred orientation</b> and any other sample effects, if the difference curve calls for them.</li>
</ol>
<p>After every stage, look at the difference curve before moving on. Let the <i>pattern</i>, not the numbers alone, tell you what to add next.</p>

<h3>Restraints and rigid bodies</h3>
<p>With powder data the observations are too few and too correlated to refine all coordinates freely for all but the simplest structures. Without help, a Rietveld refinement drifts to chemically absurd geometries because a wrong bond length changes the calculated pattern very little. Two remedies are standard:</p>
<ul>
<li><b>Restraints</b> (soft constraints): add the bond lengths and angles with their standard uncertainties as extra “observations”, with a weight.</li>
<li><b>Rigid bodies</b> and Z-matrices: refine position, orientation and torsions only. This is the same parametrisation as in the direct-space search, now used with the full profile.</li>
</ul>
<p>The weight given to restraints is a judgment call: too small and the geometry is unreliable; too large and the data cannot say anything. Lab 9 shows both.</p>`));

<h3>What to do in the lab</h3>
<ol>
<li>Press <b>Run the selected stage</b> repeatedly and watch the difference curve. After stage 1, the peaks are the right place only roughly; after stage 3, their positions and shapes are right but the <i>heights</i> are not; after stage 4, the heights fit and the <i>R</i><sub>wp</sub> falls to near the Le Bail floor.</li>
<li>Look at <b>distance from the true structure</b>: the answer-key position of each atom. With noiseless-enough data and a good start, everything returns to the true structure within a few hundredths of an ångström. Increase the <b>perturbation</b> and restart: the refinement may fall into a false minimum, which is exactly what a bad starting model does in practice.</li>
<li>For a free-atom structure, tick <b>coordinates</b> and <b>B</b> at the same time as the profile in the first cycle (use <i>Refine the ticked parameters</i>) to see why the staged order matters: the refinement may diverge or end in a wrong place.</li>

<h3>Numbers to read</h3>
<ul>
<li><b><i>R</i><sub>wp</sub> versus the Le Bail floor.</b> The Le Bail <i>R</i><sub>wp</sub> (with the same profile) is the best that any structure could give. A Rietveld fit that levels off clearly above it means the structure is incomplete or wrong, or there is an unmodelled effect (preferred orientation, a missing atom, disorder).</li>
<li><b>GoF</b> near 1 is what you want. A value of 1.0 with a visibly bad difference curve is possible if the counts are low (large σ). A value of 4 with a perfect-looking difference curve is possible if the counts are very high.</li>
<li><b><i>R</i><sub>Bragg</sub></b> (the agreement of the integrated intensities, with the Rietveld partition of overlapped peaks) is about the structure only; it is a better guide to the structural fit than <i>R</i><sub>wp</sub> but is biased in a favourable direction, since the partition uses the model.</li>
<li><b>Standard uncertainties.</b> The “esd (LM)” column comes from the least-squares covariance matrix. For profile data it is too small, because neighbouring points are correlated; Bérar and Lelann (1991) showed that the serial correlation can be allowed for by a factor, derived from the Durbin–Watson statistic, that typically multiplies the esds by 2–4. Programs report this as “corrected esds”.</li>

<div class="callout warn"><b class="t">Pitfalls</b><ul>

/* Chapter 10 - Validation and pitfalls */
'use strict';

/* a Rietveld model set exactly to the answer key: the baseline from which defects are introduced */
function truthModel(cs, ds, perturb) {
  const rm = new RietveldModel(cs, ds, { perturb: 0, seed: 3 });
  rm.zero = ds.settings.zero; rm.prm = Object.assign({}, ds.inst.prm); rm.free = freeFromCell(rm.sys, cs.cell);
  if (!rm.molecular) rm.atoms.forEach((a, i) => { a.B = rm.truthAtoms[i].B; }); else { rm.Bh = cs.mol.Bheavy; rm.BH = cs.mol.BH; }
  return rm;
}
function settleBackground(rm, order) {   // refit the background polynomial to (data − peaks): what a refinement would do
  const ds = rm.ds;
  if (order) { rm.nb = order; rm.B_ = chebBasis(ds.tt, order); rm.c = new Array(order).fill(0); }
  rm.updateGeometry(); rm.initScale();
  for (let it = 0; it < 3; it++) {
    const yc = rm.calc(), b = rm.bkgArray(), tgt = new Float64Array(ds.n), w = new Float64Array(ds.n);
    for (let i = 0; i < ds.n; i++) { tgt[i] = ds.y[i] - (yc[i] - b[i]); const s = Math.sqrt(Math.max(rm.bkgArray()[i], 1)); w[i] = (Math.abs(ds.y[i] - yc[i]) < 3 * s ? 1 : 0) / Math.max(ds.y[i], 1); }
    rm.c = Array.from(chebFit(rm.B_, tgt, w));
    rm.initScale();
  }
}
const SCENARIOS = [

  { id: 'zero', name: 'Zero-point error', sees: 'Every peak has a derivative-shaped residual: positive on one side and negative on the other, with the same sense for all peaks and similar size at all angles.', cause: 'A constant shift of all 2θ values (sample displacement gives the same pattern but proportional to cos θ).', fix: 'Refine the zero (or sample-displacement) parameter before anything else.' },
  { id: 'cell', name: 'Cell parameter slightly wrong', sees: 'A derivative-shaped residual that grows with angle, and which is different in sign or size for different reflection families (only those with an index along the wrong axis).', cause: 'A cell parameter 0.1–0.2 % off: the shift of peak positions is proportional to tan θ.', fix: 'Refine the cell parameters (after the zero).' },
  { id: 'narrow', name: 'Peak shape too narrow', sees: 'Every peak shows a positive–negative–positive pattern: positive in the wings and negative at the apex (the calculated peak is too tall and thin).', cause: 'Widths underestimated (U, V, W, X, Y).', fix: 'Refine the profile parameters; check for anisotropic broadening.' },
  { id: 'broad', name: 'Peak shape too broad', sees: 'The reverse: every peak shows negative wings and a positive apex (the calculated peak is too wide and short).', cause: 'Widths overestimated.', fix: 'Refine the profile parameters.' },
  { id: 'asym', name: 'Asymmetry missing', sees: 'At low angles, antisymmetric residuals that are the same for all peaks in that region and that fade towards higher angles.', cause: 'Axial divergence has been ignored.', fix: 'Refine an asymmetry parameter (or use a Finger–Cox–Jephcoat model).' },
  { id: 'po', name: 'Preferred orientation not modelled', sees: 'Peak positions and shapes are right, but intensities are wrong for certain reflection families (a set of reflections too strong, the rest too weak), with no pattern as a function of angle.', cause: 'Crystallites with a platy or needle habit pack in a preferred direction.', fix: 'Add a preferred-orientation correction (March–Dollase or spherical harmonics) and, better, re-prepare the sample (capillary, spinning).' },

      qa('2. Are the bond lengths and angles sensible?', 'Compare with the Cambridge Structural Database (Mogul) for molecules, or with bond-valence sums and typical coordination for inorganic structures. Restrained or rigid parts are right by construction, so look at the unrestrained parts and at the intermolecular contacts.'),
      qa('3. Is the packing sensible?', 'No impossibly short contacts, no unexplained voids, hydrogen-bond donors matched with acceptors at 2.6–3.1 Å, and a calculated density in the expected range. The checks of PLATON/CheckCIF apply as well to a Rietveld refinement as to a single-crystal one.'),
      qa('4. Are the displacement parameters physical?', 'Positive, smooth, of similar size for chemically similar atoms. A negative or very large B is a symptom of absorption, preferred orientation or background errors, and should not be accepted as a result.'),
      qa('5. Does the structure repeat from independent starts?', 'A direct-space solution found many times from random starts, or a Rietveld refinement that converges from a different starting arrangement, is much more credible than one that happened once.'),
      qa('6. Does an independent calculation agree?', 'For molecular crystals, a dispersion-corrected DFT optimisation (DFT-D) of the experimental structure should barely move the atoms: an RMS Cartesian displacement of the non-H atoms of about 0.25 Å or less supports the structure, whereas ~0.4 Å or more suggests an error or a disorder that has been ignored (van de Streek and Neumann, 2010, 2014).'),
      qa('7. Are the esds honest?', 'Use the corrected esds (Bérar and Lelann), and do not discuss differences smaller than three times the corrected esd. For light atoms, 0.05–0.1 Å is more realistic than the 0.005 Å that raw least-squares output suggests.')
    );
    root.append(...sec(`
<div class="callout key"><b class="t">The one-sentence version</b>A powder structure is credible when the pattern is fitted to its noise, the geometry is chemically reasonable <i>without being forced there</i>, the solution is reproducible, and the esds you quote are the honest ones.</div>
<h3>Questions</h3>`));
    root.append(
      qa('A refinement reaches Rwp = 7.5 % and GoF = 1.1, but the difference curve has strong ± features at every peak. How is that possible?', 'The weights come from counting statistics: if the counts are low, the σ are large, so large residuals are statistically allowed. The pattern is then “fitted to its noise” but the noise is large. The cure is to measure more counts, not to accept the model.'),
      qa('Why is a Rietveld esd for a coordinate not enough to establish that a bond really is shorter than usual?', 'Because the uncertainty includes systematic components (profile shape, background, preferred orientation, absorption) that the least-squares matrix cannot know about, because the points are serially correlated, and because the light-atom coordinates are correlated with each other and with the displacement parameters. In practice you quote the corrected esd and also test the claim by refinement under restraints, with different profile models, and with DFT.')
    );
  }
});

/* Chapter 11 - Capstone: the whole workflow on one sample */
'use strict';

chapter({
  id: 'capstone', num: '11', group: 'Putting it together', title: 'Capstone: one sample, start to finish',
  render(root) {
    const cs = curCase(), ds = curDS(), R = res(), W = work();
    root.append(h('p', { class: 'lead' }, 'This page tracks what you have done on the current sample, compares it with the answer key, and suggests what to try next. Nothing here is new; it is the whole chain, in one table.'));
    const row = (step, chapterId, status, mine, key) => [{ html: '<b>' + step + '</b>' }, { html: status ? '<span class="pill good">done</span>' : '<span class="pill">not yet</span>' }, { html: mine }, { html: key }, mkBtn('open', () => gotoChapter(chapterId))];
    const rows = [];
    const s = curSettings(), rad = RADIATIONS[s.radKey];
    rows.push(row('Data', 'experiment', true, `${rad.name}, ${s.maxCounts} counts, step ${s.step}°${s.impurity ? ', impurity ' + (s.impurity * 100).toFixed(1) + ' %' : ''}${s.poR !== 1 ? ', preferred orientation' : ''}`, '–'));
    const ad = R.adopted;
    let cellLine = '–', cellKey = `${cs.cell.slice(0, 3).map(x => x.toFixed(3)).join(' × ')}${cs.cell[4] !== 90 ? ', β ' + cs.cell[4] : ''} (${cs.sg})`;
    if (ad) {
      const cand = { sys: ad.sys, p: cellToRecip(ad.sys, ad.cell), V: ad.V }, tc = truthCompare(cand, cs, ttToQ(40, 1.5406, 0));
      cellLine = `${ad.sys}, ${ad.cell.slice(0, 3).map(x => x.toFixed(3)).join(' × ')}${ad.sys === 'monoclinic' ? ', β ' + ad.cell[4].toFixed(2) : ''}, M = ${ad.M.toFixed(1)} <span class="pill ${tc.cls}">${tc.tag}</span>`;
    }
    rows.push(row('Unit cell (indexing)', 'index', !!ad, cellLine, cellKey));
    rows.push(row('Space group', 'sg', !!R.sg, R.sg ? `${R.sg.name} ${R.sg.eq === true ? '<span class="pill good">same absences as the true group</span>' : R.sg.eq === false ? '<span class="pill warn">different absences from the true group</span>' : ''}` : '–', cs.sg));
    rows.push(row('Profile fit (Le Bail)', 'lebail', !!R.lebail, R.lebail ? `Rwp ${R.lebail.rwp.toFixed(2)} %, GoF ${R.lebail.gof.toFixed(2)} (${R.lebail.mode}, ${R.lebail.sg})` : '–', 'Rwp close to Rexp (GoF about 1)'));
    if (cs.mol) {
      const d = R.dsBest;
      rows.push(row('Structure solution (direct space)', 'ds', !!d, d ? `best χ² ${d.c.toFixed(1)} ${d.solved === true ? '<span class="pill good">matches the answer key</span>' : d.solved === false ? '<span class="pill bad">not the answer-key structure</span>' : ''}` : '–', 'the molecule placed in the cell'));
    } else {
      const c = R.cf;
      rows.push(row('Structure solution (reciprocal space)', 'rs', !!c, c ? `charge flipping (${c.src}, d_min ${c.dmin} Å): ${c.n} of ${c.total} atoms recovered` : '–', `${caseAtoms(cs).length} atoms in the asymmetric unit`));
    }
    const rt = R.rietveld;
    rows.push(row('Rietveld refinement', 'rietveld', !!rt, rt ? `Rwp ${rt.rwp.toFixed(2)} %, GoF ${rt.gof.toFixed(2)}, largest error ${rt.dev.toFixed(3)} Å` : '–', 'Rwp → Rexp, errors → 0.00x Å'));
    rows.push(row('Validation', 'validate', true, 'difference-curve diagnosis and sensitivity of the pattern to each atom', 'chemical sense'));
    root.append(h('h3', null, 'Where you are on ' + cs.name));
    root.append(mkTable(['Step', 'Status', 'Your result', 'Answer key', ''], rows));
    root.append(...sec(`
<h3>Challenges</h3>
<ul>
<li><b>Make it hard.</b> In Chapter 2 reduce the counts to ~500, add 6 % of impurity, and degrade the resolution to “ordinary laboratory optics”. Repeat indexing and the Le Bail fit: where does the chain break first?</li>
<li><b>Mystery sample.</b> In Chapter 4 press <i>Give me a mystery sample</i> and determine its cell, then (Chapter 5) its space group, using only the tools in the course. Check against the answer key.</li>
<li><b>The two molecules.</b> Solve sample A and then sample B in Chapter 7, and compare the number of runs it takes to get repeated solutions. Then refine each in Chapter 9, starting from your own solution.</li>
<li><b>Radiation.</b> Repeat the inorganic charge-flipping experiment of Chapter 8 with the synchrotron setting in Chapter 2 (narrow peaks, more resolved clusters) and compare the recovery with the laboratory result.</li>
<li><b>Break the refinement.</b> In Chapter 9, increase the perturbation to ×3 and try to refine in one go; then do it stage by stage.</li>
</ul>
<h3>A short self-test</h3>`));
    root.append(
      qa('Your pattern indexes with M₂₀ = 18, but the cell volume is 40 % of what the formula demands. What now?', 'The solution is probably a subcell: the true cell is a multiple of the one found (or you have missing low-angle lines). Search for larger cells with the volume limit raised and the zero error allowed for; examine the lowest-angle region for weak peaks (superstructure reflections), and compare with a Le Bail fit in the supercell.'),
      qa('You have solved a molecular structure in P2₁/c from three runs that give the same χ². The difference curve after Rietveld refinement has Rwp 9 % against a Le Bail Rwp of 5 %. What are the candidates for the discrepancy?', 'A conformational error that the rigid-body model could not follow (an extra torsion, disorder), a missing solvent or counter-ion, preferred orientation, a wrong space group (lower symmetry, Z′ = 2), or hydrogen atoms in the wrong place. Release torsions, add a March–Dollase correction, test P-1 or Z′ = 2, and compare again with the Le Bail floor.'),
      qa('Why is it wrong to claim a hydrogen bond from a powder Rietveld refinement of a light-atom organic structure?', 'The uncertainty on light-atom positions is often 0.05–0.1 Å or larger even when corrected, and the hydrogen atom itself is rarely located. A hydrogen bond is a chemical interpretation of heavy-atom distances and angles that must be consistent with the whole geometry; use DFT-D optimisation and neutron data where the claim matters.'),
      qa('Which single improvement of the experiment would most increase the chance of solving a difficult molecular structure?', 'Narrower peaks: a synchrotron or a high-resolution laboratory instrument with a Johansson monochromator and a capillary sample. The number of resolved clusters is the limiting quantity, and no software can create reflections that the data have merged.')
    );
    // report
    const rep = h('textarea', { rows: 10, style: 'width:100%;max-width:860px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-family:var(--font-mono);font-size:12px;' });
    const lines = ['Powder structure course – summary for ' + cs.name, ''];

    rep.value = lines.join('\n');
    root.append(h('h3', null, 'Copyable summary'), rep);
  }
});

  ['Pattern decomposition (Le Bail, Pawley)', 'GSAS-II, FullProf, TOPAS, Jana2006, EXPO2014, DASH (Pawley fit as a stage)', 'Use for cell/profile refinement, space-group tests and intensities for solution.'],
  ['Direct-space solution', 'DASH (simulated annealing / parallel tempering), FOX (Monte Carlo; free objects), TOPAS (simulated annealing), GSAS-II (Monte Carlo/SA), EXPO2014, Materials Studio PowderSolve', 'Molecular crystals; flexible molecules and Z′ > 1 are hard.'],
  ['Reciprocal-space solution', 'EXPO2014 (direct methods, Patterson), SIRPOW, SUPERFLIP (charge flipping), Jana2006, GSAS-II (charge flipping)', 'Inorganics and small structures; fed by Le Bail intensities.'],

  ['DFT-D validation', 'GRACE, CASTEP, VASP, Quantum ESPRESSO, CP2K', 'For molecular crystals: an optimisation of the final structure with dispersion correction.']
];
const GLOSSARY = [
  ['Anisotropic broadening', 'Peak width that depends on the reflection indices rather than on 2θ alone (needle- or plate-shaped crystallites, stacking faults).'],
  ['Asymmetry', 'Low-angle tail of a laboratory peak caused by axial divergence; corrected by an antisymmetric profile term.'],
  ['Background', 'The smooth contribution to the pattern from air, the holder, fluorescence and amorphous material; modelled by a polynomial or interpolated points.'],
  ['Bragg R factor (R_B)', 'Agreement between the observed and calculated integrated intensities of the Bragg reflections, using the Rietveld partition of overlap.'],
  ['Caglioti function', 'The quadratic in tan θ describing the Gaussian width of instrumental peaks: U tan²θ + V tanθ + W.'],
  ['Charge flipping', 'An iterative dual-space phasing method that flips the sign of low density in real space and imposes observed amplitudes in reciprocal space.'],
  ['Cluster', 'A group of reflections close enough in 2θ that they cannot be resolved; its summed intensity is measured, its internal split is not.'],
  ['Debye–Scherrer ring', 'The cone of diffracted radiation from all crystallites with a given d-spacing.'],
  ['de Wolff figure of merit M₂₀', 'An indexing figure of merit: Q₂₀ / (2⟨|ΔQ|⟩ N₂₀).'],
  ['Difference curve', 'Observed minus calculated pattern; the primary diagnostic of a refinement.'],
  ['Direct-space solution', 'Structure solution by optimising the position, orientation and conformation of a model against the pattern without phases.'],
  ['Durbin–Watson statistic', 'A measure of serial correlation of residuals; 2 means none.'],
  ['Equal partition', 'Le Bail’s starting assumption that overlapped reflections have equal intensities.'],
  ['Extinction symbol', 'A short symbol summarising the systematic absences of a group of space groups, e.g. P 1 21/c 1.'],
  ['F_N (Smith–Snyder)', 'An indexing figure of merit using the mean error in 2θ and the number of possible reflections.'],
  ['FWHM', 'Full width at half maximum of a peak.'],
  ['GoF', 'Goodness of fit, Rwp/Rexp; χ² is its square.'],
  ['Indexing', 'Determining the unit cell from the positions of the diffraction peaks.'],
  ['Kα₂ stripping', 'Removal of the weaker second wavelength component of an unmonochromated laboratory pattern (Rachinger).'],
  ['Laue class', 'The point group obtained by adding a centre of inversion; determines which reflections are symmetry-equivalent.'],
  ['Le Bail method', 'Extraction of intensities by iterative partition of the net observed counts, without a structure model.'],
  ['March–Dollase function', 'A one-parameter model of preferred orientation along a chosen hkl direction.'],
  ['Multiplicity', 'The number of symmetry-equivalent reflections that coincide in a powder line.'],
  ['Pawley method', 'Profile fitting with the intensities as free least-squares parameters; may give negative intensities.'],
  ['Preferred orientation', 'A non-random distribution of crystallite orientations that alters relative intensities.'],
  ['Profile function', 'A mathematical description of a single reflection, e.g. pseudo-Voigt.'],
  ['Pseudo-Voigt', 'A weighted sum of a Gaussian and a Lorentzian function.'],
  ['Pseudo-symmetry', 'A structure or cell that is close to, but not exactly, a higher symmetry; hard to detect in powder patterns.'],
  ['Q', 'The reciprocal squared d-spacing 1/d² used in indexing (other conventions use 2π/d).'],
  ['R_exp', 'The expected R_wp for a perfect model given the counting statistics.'],
  ['R_wp', 'The weighted profile R factor.'],
  ['Restraint', 'A soft geometrical constraint (a target bond length with an uncertainty) added to the least-squares problem.'],
  ['Rietveld refinement', 'Refinement of a structure against every point of a powder pattern.'],
  ['Rigid body', 'A group of atoms with fixed internal geometry refined as a unit (position, orientation, optionally torsions).'],
  ['Scherrer equation', 'Relates the Lorentzian broadening to the crystallite size: β = Kλ/(L cos θ).'],
  ['Simulated annealing', 'A stochastic global optimiser that accepts uphill moves with a probability controlled by a falling temperature.'],
  ['Structure invariants / triplets', 'Combinations of phases whose values do not depend on the origin; the basis of direct methods.'],
  ['TCH (Thompson–Cox–Hastings)', 'A pseudo-Voigt formulation in which the Gaussian and Lorentzian widths are modelled separately and combined.'],
  ['Williamson–Hall plot', 'A plot of β cos θ against 4 sin θ that separates size and strain broadening.'],
  ['Z, Z′', 'Number of formula units in the cell, and in the asymmetric unit.'],
  ['Zero-point error', 'A constant offset of the 2θ scale.']
];

'use strict';
const GUIDE_HTML = `
<h3>How this course works</h3>
<p>The course follows the path of a real structure determination from powder data, one chapter per stage. Every chapter has a short explanation and one or more <b>labs</b>: live calculations on a simulated experiment. Because every sample is synthetic, the true answer is known, so you can always check what you did against it (look for the “answer key” buttons).</p>
<h3>The sample selector</h3>
<p>The <b>Sample</b> menu at the top chooses the case file: simple cubic, tetragonal and hexagonal materials for indexing practice, an orthorhombic silicate for inorganic solution methods, and two molecular crystals for direct-space solution. The diffraction pattern, noise and instrument are generated for you in <b>The experiment</b>; every later chapter uses that same pattern.</p>
<h3>Working model</h3>
<p>Results carry forward: the cell you adopt in <i>Indexing</i>, the space group from <i>Space group</i>, and the profile you fit in <i>Le Bail</i> become the starting point of later chapters. If you skip ahead, the answer-key values are used instead and the chapter says so.</p>
<h3>Pattern viewers</h3>
<p>Mouse wheel zooms, drag pans, double-click resets, hover shows 2θ, d-spacing and counts. The “√ scale” switch reveals weak peaks.</p>
<h3>Honesty about the simulations</h3>
<p>The molecular crystals are <i>synthetic</i> (a molecule placed in a cell by a packing search), not literature structures; the forsterite-type structure uses approximate olivine coordinates. Indexing, Le Bail, simulated annealing, charge flipping and Rietveld refinement are real implementations of the methods, simplified for teaching and speed, so absolute numbers will differ from production programs.</p>
<p><button class="btn primary" id="guideClose">Close</button></p>`;
