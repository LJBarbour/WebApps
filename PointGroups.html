// Matrix math helpers
function mulMV(m, v) {
  return [
    m[0]*v[0]+m[1]*v[1]+m[2]*v[2],
    m[3]*v[0]+m[4]*v[1]+m[5]*v[2],
    m[6]*v[0]+m[7]*v[1]+m[8]*v[2]
  ];
}
function mulMM(a, b) {
  const r = new Array(9);
  for(let i=0;i<3;i++) for(let j=0;j<3;j++) {
    r[i*3+j]=a[i*3]*b[j]+a[i*3+1]*b[3+j]+a[i*3+2]*b[6+j];
  }
  return r;
}
function identity() { return [1,0,0,0,1,0,0,0,1]; }
function normalize(v) {
  const l = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);
  return l < 1e-10 ? [0,0,1] : [v[0]/l,v[1]/l,v[2]/l];
}

// Rotation matrix around axis by angle
function rotMat(axis, angle) {
  const [x,y,z] = normalize(axis);
  const c = Math.cos(angle), s = Math.sin(angle), t = 1-c;
  return [
    t*x*x+c,   t*x*y-s*z, t*x*z+s*y,
    t*x*y+s*z, t*y*y+c,   t*y*z-s*x,
    t*x*z-s*y, t*y*z+s*x, t*z*z+c
  ];
}

// Reflection matrix through plane with normal n
function reflMat(n) {
  const [nx,ny,nz] = normalize(n);
  return [
    1-2*nx*nx, -2*nx*ny,  -2*nx*nz,
    -2*nx*ny,  1-2*ny*ny, -2*ny*nz,
    -2*nx*nz,  -2*ny*nz,  1-2*nz*nz
  ];
}
function invMat() { return [-1,0,0,0,-1,0,0,0,-1]; }

function getGenerator(gen) {
  switch(gen) {
    case "c2z": return rotMat([0,0,1], Math.PI);
    case "c2x": return rotMat([1,0,0], Math.PI);
    case "c2y": return rotMat([0,1,0], Math.PI);
    case "c3z": return rotMat([0,0,1], 2*Math.PI/3);
    case "c4z": return rotMat([0,0,1], Math.PI/2);
    case "c6z": return rotMat([0,0,1], Math.PI/3);
    case "c3_111": return rotMat([1,1,1], 2*Math.PI/3);
    case "mxy": return reflMat([0,0,1]);
    case "mxz": return reflMat([0,1,0]);
    case "myz": return reflMat([1,0,0]);
    case "i":   return invMat();
    case "s4z": {
      const r4 = rotMat([0,0,1], Math.PI/2);
      const mz = reflMat([0,0,1]);
      return mulMM(mz, r4);
    }
    case "s6z": {
      const r6 = rotMat([0,0,1], Math.PI/3);
      const mz = reflMat([0,0,1]);
      return mulMM(mz, r6);
    }
    case "s3z": {
      const r3 = rotMat([0,0,1], 2*Math.PI/3);
      const mz = reflMat([0,0,1]);
      return mulMM(mz, r3);
    }
    default: return identity();
  }
}

function matricesEqual(a, b) {
  for(let i=0;i<9;i++) if(Math.abs(a[i]-b[i])>1e-6) return false;
  return true;
}

function generateGroupElements(generators) {
  let elements = [identity()];
  const gens = generators.map(getGenerator);
  let changed = true;
  let iters = 0;
  while(changed && iters < 100) {
    changed = false; iters++;
    const newElements = [];
    for(const e of elements) {
      for(const g of gens) {
        const prod = mulMM(g, e);
        if(!elements.some(x=>matricesEqual(x,prod)) && !newElements.some(x=>matricesEqual(x,prod))) {
          newElements.push(prod);
          changed = true;
        }
      }
    }
    elements = elements.concat(newElements);
  }
  return elements;
}

// Determinant of 3x3 matrix — sign reveals if operation is improper (handedness-inverting)
function matDet(m) {
  return m[0]*(m[4]*m[8]-m[5]*m[7]) - m[1]*(m[3]*m[8]-m[5]*m[6]) + m[2]*(m[3]*m[7]-m[4]*m[6]);
}

// Apply group to a single starting point, return orbit with handedness flag
function generateOrbit(elements, startPt) {
  const orbit = [];
  for(const m of elements) {
    const p = mulMV(m, startPt);
    const norm = Math.sqrt(p[0]*p[0]+p[1]*p[1]+p[2]*p[2]);
    const pn = norm > 1e-10 ? [p[0]/norm, p[1]/norm, p[2]/norm] : p;
    const inverted = matDet(m) < 0; // improper op → stereo inverted
    if(!orbit.some(q => Math.abs(q[0]-pn[0])<1e-5 && Math.abs(q[1]-pn[1])<1e-5 && Math.abs(q[2]-pn[2])<1e-5)) {
      orbit.push({ pos: pn, inverted });
    }
  }
  return orbit;
}

// Crystal axis vectors in Cartesian space for each system.
// We use standard crystallographic conventions:
//   c along z, b in the yz-plane, a completes the right-handed system.
// Angles (in degrees): triclinic α=83 β=109 γ=102
//                      monoclinic α=90 β=107 γ=90  (unique axis b)
//                      trigonal/hexagonal α=90 β=90 γ=120
//                      all others orthogonal
function getCrystalAxes(system) {
  const d = Math.PI/180;
  if (system === 'triclinic') {
    // α=83°, β=109°, γ=102°
    const al=83*d, be=109*d, ga=102*d;
    // c along z
    const c = [0, 0, 1];
    // b in yz-plane: b = (0, sin(α), cos(α))  — angle α between b and c
    // Standard: b along y-ish
    // Use full metric tensor approach:
    // a = (1,0,0) rotated; place c=[0,0,1], b in xz... use standard:
    // c = [0,0,1]
    // b = [0, 1, 0] rotated by α from c  →  b = [sin(al)*something...]
    // Proper conversion: given α,β,γ
    //   c = [0,0,1]
    //   b = [sin(al), 0, cos(al)]  NO — use the standard:
    // c along z, b in yz plane:
    //   b_vec = [0, sin(alpha), cos(alpha)]  where alpha = angle b^c
    // Wait — α is the angle between b and c axes.
    // a: angle(b,c)=α, angle(a,c)=β, angle(a,b)=γ
    const bv = normalize([0, Math.sin(al), Math.cos(al)]);
    // a: must satisfy a·c = cos(β), a·b = cos(γ)
    //   a = [ax, ay, az]
    //   az = cos(β)
    //   ay = (cos(γ) - ax*bv[0]) / bv[1]   but bv[0]=0 so ay = cos(γ)/sin(α)
    //   ax = sqrt(1 - ay² - az²)
    const az = Math.cos(be);
    const ay = Math.cos(ga) / Math.sin(al);
    const ax = Math.sqrt(Math.max(0, 1 - ay*ay - az*az));
    const av = normalize([ax, ay, az]);
    return { a: av, b: bv, c: [0,0,1] };
  }
  if (system === 'monoclinic') {
    // β=107°, unique axis b (y), α=γ=90°
    // c along z, b along y, a tilted in xz-plane by β from c
    const be = 107*d;
    const av = normalize([Math.sin(be), 0, Math.cos(be)]);
    return { a: av, b: [0,1,0], c: [0,0,1] };
  }
  if (system === 'trigonal' || system === 'hexagonal') {
    // γ=120°, c along z, a along x, b at 120° from a in xy-plane
    const av = [1, 0, 0];
    const bv = [Math.cos(120*d), Math.sin(120*d), 0]; // [-0.5, √3/2, 0]
    return { a: av, b: bv, c: [0,0,1] };
  }
  // All others: orthogonal
  return { a: [1,0,0], b: [0,1,0], c: [0,0,1] };
}

// Starting point as fractional coordinates along the actual crystal axes,
// converted to Cartesian. This ensures the point respects the non-orthogonal
// geometry of each system.
// Non-monoclinic: frac [0.2, 0.8, 0.4] along a, b, c.
// Monoclinic:     frac [0.8, 0.4, 0.2] along a, b, c — so viewed down b,
//                 the point appears high along a and only a little along c.
function getGeneralPoint(pg) {
  const ax = getCrystalAxes(pg.system);
  const [fA, fB, fC] = pg.system === 'monoclinic' ? [0.8, 0.4, 0.2] : [0.2, 0.8, 0.4];
  return normalize([
    fA*ax.a[0] + fB*ax.b[0] + fC*ax.c[0],
    fA*ax.a[1] + fB*ax.b[1] + fC*ax.c[1],
    fA*ax.a[2] + fB*ax.b[2] + fC*ax.c[2]
  ]);
}

// Canvas setup
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, R; // canvas dims and sphere radius

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(devicePixelRatio, devicePixelRatio);
  R = Math.min(W, H) * 0.38;
  draw();
}

// View rotation state (quaternion or rotation matrix)
let viewMat = identity();
let isDragging = false, lastMX = 0, lastMY = 0;
let zoom = 1.0;

// Toggle states
const toggles = { axes: true, sym: true, pts: true, genpos: false };

let currentPG = POINT_GROUPS[0];
let groupElements = [identity()];
let orbitPoints = [];

// Default view matrix for each crystal system, using actual crystal axis vectors.
// Non-monoclinic: view along c, with b as up direction.
// Monoclinic: view along b, with a as up direction.
function defaultView(system) {
  const ax = getCrystalAxes(system);
  if (system === 'monoclinic') {
    return viewAlong(ax.b, ax.a);
  }
  return viewAlong(ax.c, ax.b);
}

function loadPG(pg) {
  currentPG = pg;
  groupElements = generateGroupElements(pg.generators);
  const startPt = getGeneralPoint(pg);
  orbitPoints = generateOrbit(groupElements, startPt);
  viewMat = defaultView(pg.system);
  zoom = 1.0;

  document.getElementById('disp-symbol').innerHTML = hmToHtml(pg.hm);
  document.getElementById('disp-name').textContent = pg.name + ' · ' + pg.system;
  document.getElementById('inf-sys').textContent = pg.system.charAt(0).toUpperCase()+pg.system.slice(1);
  document.getElementById('inf-ord').textContent = pg.order;
  document.getElementById('inf-sch').textContent = pg.sch;
  document.getElementById('inf-ops').textContent = pg.ops;
  document.getElementById('inf-cen').textContent = pg.centrosym ? 'Yes' : 'No';
  draw();
}

// 3D -> 2D projection (with view rotation)
function project(p3) {
  const [x,y,z] = mulMV(viewMat, p3);
  const cx = W/2, cy = H/2;
  const scale = R * zoom;
  return { sx: cx + x * scale, sy: cy - y * scale, z: z, depth: z };
}

// Draw order symbol on axis end
function drawAxisSymbol(ctx, x, y, order, color) {
  if(order <= 1) return;
  const s = 12;
  ctx.save();
  ctx.fillStyle = color;
  ctx.strokeStyle = '#0d1117';
  ctx.lineWidth = 1;
  if(order === 2) {
    // Filled elongated ellipse — standard crystallographic 2-fold symbol
    ctx.beginPath();
    ctx.ellipse(x, y, s*0.45, s*1.0, 0, 0, 2*Math.PI);
    ctx.fill(); ctx.stroke();
  } else if(order === 3) {
    ctx.beginPath();
    for(let i=0;i<3;i++) {
      const a = i*2*Math.PI/3 - Math.PI/2;
      i===0 ? ctx.moveTo(x+s*Math.cos(a), y+s*Math.sin(a)) : ctx.lineTo(x+s*Math.cos(a), y+s*Math.sin(a));
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if(order === 4) {
    ctx.beginPath();
    ctx.rect(x-s*0.7,y-s*0.7,s*1.4,s*1.4);
    ctx.fill(); ctx.stroke();
  } else if(order === 6) {
    ctx.beginPath();
    for(let i=0;i<6;i++) {
      const a = i*Math.PI/3;
      i===0 ? ctx.moveTo(x+s*Math.cos(a), y+s*Math.sin(a)) : ctx.lineTo(x+s*Math.cos(a), y+s*Math.sin(a));
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

// Draw improper axis symbols at pole positions:
//   '3bar': triangle with small circle inside
//   '4bar': square with small ellipse inside
//   '6bar': hexagon with small triangle inside
//   '2/m':  ellipse with small circle inside
//   '4/m':  square with small circle inside
//   '6/m':  hexagon with small circle inside
function drawImproperSymbol(ctx, x, y, type, color) {
  const s = 12;
  ctx.save();
  ctx.fillStyle = color;
  ctx.strokeStyle = '#0d1117';
  ctx.lineWidth = 1;

  if(type === '3bar') {
    // Filled triangle — centroid is at y + s/3 below circumcentre for equilateral triangle
    // pointing up (apex at top), so geometric centre is at y + s*1/3 * something
    // For triangle with apex at (x, y-s) and base at y + s*0.5:
    // centroid y = (y-s + y+s*0.5 + y+s*0.5)/3 = y + s*1/3*(0.5+0.5-1) = y
    // Actually centroid = average of vertices:
    // v0=(x, y-s), v1=(x+s*cos(30°), y+s*0.5), v2=(x-s*cos(30°), y+s*0.5)
    // centroid = (x, y + (-s + 0.5s + 0.5s)/3) = (x, y)  ✓
    ctx.beginPath();
    for(let i=0;i<3;i++) {
      const a = i*2*Math.PI/3 - Math.PI/2;
      i===0 ? ctx.moveTo(x+s*Math.cos(a), y+s*Math.sin(a)) : ctx.lineTo(x+s*Math.cos(a), y+s*Math.sin(a));
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Circle centred at centroid = (x, y)
    ctx.fillStyle = '#0d1117';
    ctx.beginPath(); ctx.arc(x, y, s*0.3, 0, 2*Math.PI); ctx.fill();

  } else if(type === '4bar') {
    // Filled square with a longer, thinner ellipse inside for clarity
    ctx.beginPath(); ctx.rect(x-s*0.75, y-s*0.75, s*1.5, s*1.5);
    ctx.fill(); ctx.stroke();
    // Tall thin ellipse
    ctx.fillStyle = '#0d1117';
    ctx.beginPath(); ctx.ellipse(x, y, s*0.18, s*0.52, 0, 0, 2*Math.PI); ctx.fill();

  } else if(type === '6bar') {
    // Filled hexagon
    ctx.beginPath();
    for(let i=0;i<6;i++) {
      const a = i*Math.PI/3;
      i===0 ? ctx.moveTo(x+s*Math.cos(a), y+s*Math.sin(a)) : ctx.lineTo(x+s*Math.cos(a), y+s*Math.sin(a));
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Larger triangle inside
    ctx.fillStyle = '#0d1117';
    ctx.beginPath();
    for(let i=0;i<3;i++) {
      const a = i*2*Math.PI/3 - Math.PI/2;
      const r = s*0.62;
      i===0 ? ctx.moveTo(x+r*Math.cos(a), y+r*Math.sin(a)) : ctx.lineTo(x+r*Math.cos(a), y+r*Math.sin(a));
    }
    ctx.closePath(); ctx.fill();

  } else if(type === '2/m') {
    // Filled ellipse (2-fold)
    ctx.beginPath(); ctx.ellipse(x, y, s*0.45, s*1.0, 0, 0, 2*Math.PI);
    ctx.fill(); ctx.stroke();
    // Small circle inside
    ctx.fillStyle = '#0d1117';
    ctx.beginPath(); ctx.arc(x, y, s*0.28, 0, 2*Math.PI); ctx.fill();

  } else if(type === '4/m') {
    // Filled square
    ctx.beginPath(); ctx.rect(x-s*0.75, y-s*0.75, s*1.5, s*1.5);
    ctx.fill(); ctx.stroke();
    // Small circle inside
    ctx.fillStyle = '#0d1117';
    ctx.beginPath(); ctx.arc(x, y, s*0.3, 0, 2*Math.PI); ctx.fill();

  } else if(type === '6/m') {
    // Filled hexagon
    ctx.beginPath();
    for(let i=0;i<6;i++) {
      const a = i*Math.PI/3;
      i===0 ? ctx.moveTo(x+s*Math.cos(a), y+s*Math.sin(a)) : ctx.lineTo(x+s*Math.cos(a), y+s*Math.sin(a));
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Small circle inside
    ctx.fillStyle = '#0d1117';
    ctx.beginPath(); ctx.arc(x, y, s*0.3, 0, 2*Math.PI); ctx.fill();
  }

  ctx.restore();
}

function drawScene() {
  ctx.clearRect(0, 0, W, H);
  const cx = W/2, cy = H/2;
  const scale = R * zoom;
  cx_g = cx; cy_g = cy; scale_g = scale;

  // Sphere background
  const grad = ctx.createRadialGradient(cx-R*0.15, cy-R*0.15, R*0.05, cx, cy, R*zoom);
  grad.addColorStop(0, 'rgba(40,60,90,0.6)');
  grad.addColorStop(1, 'rgba(13,17,23,0.85)');
  ctx.beginPath();
  ctx.arc(cx, cy, R*zoom, 0, 2*Math.PI);
  ctx.fillStyle = grad;
  ctx.fill();

  // Sphere outline
  ctx.beginPath();
  ctx.arc(cx, cy, R*zoom, 0, 2*Math.PI);
  ctx.strokeStyle = 'rgba(88,166,255,0.35)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Great circle grid (faint)
  ctx.save();
  ctx.globalAlpha = 0.12;
  for(let lat = -75; lat <= 75; lat += 30) {
    ctx.beginPath();
    const r_lat = Math.cos(lat*Math.PI/180) * scale;
    const z_lat = Math.sin(lat*Math.PI/180);
    const [,, zl] = mulMV(viewMat, [0, 0, z_lat]);
    // Project ellipse of latitude
    for(let lon = 0; lon <= 360; lon += 3) {
      const a = lon*Math.PI/180;
      const p = mulMV(viewMat, [Math.cos(lat*Math.PI/180)*Math.cos(a), Math.cos(lat*Math.PI/180)*Math.sin(a), z_lat]);
      const sx = cx + p[0]*scale, sy = cy - p[1]*scale;
      lon===0 ? ctx.moveTo(sx,sy) : ctx.lineTo(sx,sy);
    }
    ctx.closePath();
    ctx.strokeStyle = '#58a6ff';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
  for(let lon = 0; lon < 180; lon += 30) {
    ctx.beginPath();
    const a = lon*Math.PI/180;
    for(let lat=-90; lat<=90; lat+=3) {
      const p = mulMV(viewMat, [Math.cos(lat*Math.PI/180)*Math.cos(a), Math.cos(lat*Math.PI/180)*Math.sin(a), Math.sin(lat*Math.PI/180)]);
      const sx=cx+p[0]*scale, sy=cy-p[1]*scale;
      lat===-90 ? ctx.moveTo(sx,sy) : ctx.lineTo(sx,sy);
    }
    ctx.strokeStyle = '#58a6ff';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
  ctx.restore();


  // Mirror planes
  if(toggles.sym && currentPG.mirrors) {
    for(const m of currentPG.mirrors) {
      const n = normalize(m.normal);
      // Draw great circle for this mirror plane
      // Find two orthogonal vectors in plane
      let t1;
      if(Math.abs(n[2]) < 0.9) t1 = normalize([-n[1],n[0],0]);
      else t1 = normalize([1,0,0]);
      const t2 = [n[1]*t1[2]-n[2]*t1[1], n[2]*t1[0]-n[0]*t1[2], n[0]*t1[1]-n[1]*t1[0]];
      const norm_t2 = Math.sqrt(t2[0]*t2[0]+t2[1]*t2[1]+t2[2]*t2[2]);
      const t2n = [t2[0]/norm_t2,t2[1]/norm_t2,t2[2]/norm_t2];

      ctx.save();
      ctx.beginPath();
      let first = true;
      for(let a=0; a<=360; a+=3) {
        const rad = a*Math.PI/180;
        const p3 = [
          Math.cos(rad)*t1[0]+Math.sin(rad)*t2n[0],
          Math.cos(rad)*t1[1]+Math.sin(rad)*t2n[1],
          Math.cos(rad)*t1[2]+Math.sin(rad)*t2n[2]
        ];
        const pv = mulMV(viewMat, p3);
        const sx=cx+pv[0]*scale, sy=cy-pv[1]*scale;
        first ? ctx.moveTo(sx,sy) : ctx.lineTo(sx,sy);
        first=false;
      }
      ctx.closePath();
      ctx.strokeStyle = 'rgba(188,140,255,0.55)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // Subtle fill
      ctx.fillStyle = 'rgba(188,140,255,0.07)';
      ctx.fill();
      ctx.restore();
    }
  }

  // Rotation axes
  if(toggles.sym && currentPG.rotAxes) {
    for(const ra of currentPG.rotAxes) {
      const a = normalize(ra.axis);
      const p1 = mulMV(viewMat, a);
      const p2 = mulMV(viewMat, [-a[0],-a[1],-a[2]]);
      const s1x=cx+p1[0]*scale, s1y=cy-p1[1]*scale;
      const s2x=cx+p2[0]*scale, s2y=cy-p2[1]*scale;

      ctx.save();
      ctx.strokeStyle = ra.order === 2 ? 'rgba(248,81,73,0.75)' :
                        ra.order === 3 ? 'rgba(248,140,73,0.75)' :
                        ra.order === 4 ? 'rgba(248,200,73,0.85)' :
                        'rgba(248,230,100,0.9)';
      ctx.lineWidth = ra.order > 3 ? 2 : 1.5;
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(s1x,s1y); ctx.lineTo(s2x,s2y); ctx.stroke();
      const col = ra.order === 2 ? 'rgba(248,81,73,0.9)' : ra.order === 3 ? 'rgba(248,140,73,0.9)' : ra.order === 4 ? 'rgba(248,200,73,1)' : 'rgba(248,230,100,1)';
      drawAxisSymbol(ctx, s1x, s1y, ra.order, col);
      drawAxisSymbol(ctx, s2x, s2y, ra.order, col);
      ctx.restore();
    }
  }

  // Rotoinversion axes — dashed line + improper symbol at both poles.
  // S4(order=4)→4bar, S6(order=6)→3bar, S3(order=3)→6bar at the poles.
  if(toggles.sym && currentPG.rotInvAxes) {
    const col = 'rgba(63,185,80,0.95)';
    for(const ra of currentPG.rotInvAxes) {
      const a = normalize(ra.axis);
      const p1 = mulMV(viewMat, a);
      const p2 = mulMV(viewMat, [-a[0],-a[1],-a[2]]);
      const s1x=cx+p1[0]*scale, s1y=cy-p1[1]*scale;
      const s2x=cx+p2[0]*scale, s2y=cy-p2[1]*scale;
      // Dashed line
      ctx.save();
      ctx.strokeStyle = 'rgba(63,185,80,0.8)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(s1x,s1y); ctx.lineTo(s2x,s2y); ctx.stroke();
      ctx.restore();
      // Symbol at both poles
      const type = ra.order===4 ? '4bar' : ra.order===6 ? '3bar' : ra.order===3 ? '6bar' : null;
      if(type) {
        drawImproperSymbol(ctx, s1x, s1y, type, col);
        drawImproperSymbol(ctx, s2x, s2y, type, col);
      }
    }
  }

  // Centre symbol: n/m only (rotation axis with perpendicular mirror).
  // These go at the centre of the sphere as they represent the horizontal mirror.
  if(toggles.sym && currentPG.rotAxes && currentPG.mirrors) {
    let bestOrder = 0, centreCol = null, centreType = null;
    for(const ra of currentPG.rotAxes) {
      if(ra.order < 2) continue;
      const ax = normalize(ra.axis);
      const hasPerp = (currentPG.mirrors||[]).some(m => {
        const mn = normalize(m.normal);
        return Math.abs(ax[0]*mn[0]+ax[1]*mn[1]+ax[2]*mn[2]) > 0.99;
      });
      if(hasPerp && ra.order > bestOrder) {
        bestOrder = ra.order;
        centreCol = ra.order===2 ? 'rgba(248,81,73,0.9)' :
                    ra.order===4 ? 'rgba(248,200,73,1)' :
                    'rgba(248,230,100,1)';
        centreType = ra.order===2 ? '2/m' : ra.order===4 ? '4/m' : ra.order===6 ? '6/m' : null;
      }
    }
    if(centreType && centreCol) {
      drawImproperSymbol(ctx, cx, cy, centreType, centreCol);
    }
  }

  // Inversion centre: only show the open circle when the group is centrosymmetric
  // AND no other centre symbol (n/m or rotoinversion) is already drawn there.
  // If a rotoinversion axis (3bar=S6, 6bar=S3) is present, inversion is implied.
  // If a n/m symbol is drawn at centre, inversion is implied.
  if(toggles.sym && currentPG.centrosym) {
    // Check if a n/m symbol was drawn at centre
    const hasSlashM = currentPG.rotAxes && currentPG.mirrors &&
      currentPG.rotAxes.some(ra => {
        const ax = normalize(ra.axis);
        return (currentPG.mirrors||[]).some(m => {
          const mn = normalize(m.normal);
          return Math.abs(ax[0]*mn[0]+ax[1]*mn[1]+ax[2]*mn[2]) > 0.99;
        });
      });
    // Suppress inversion circle only if an n/m symbol is drawn at centre
    // (rotoinversion symbols are now at the poles, so inversion circle may still show)
    // But also suppress for 3bar (S6) and 6bar (S3) which include inversion
    const hasRotInvCentro = currentPG.rotInvAxes && currentPG.rotInvAxes.some(ra =>
      ra.order === 6 || ra.order === 3
    );
    if(!hasSlashM && !hasRotInvCentro) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, 8, 0, 2*Math.PI);
      ctx.strokeStyle = 'rgba(188,140,255,0.9)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(188,140,255,0.25)';
      ctx.fill();
      ctx.restore();
    }
  }

  // Coordinate axes — use crystal-system-specific axis directions
  if(toggles.axes) {
    const crystAx = getCrystalAxes(currentPG.system);
    const axDefs = [
      { dir: crystAx.a, label: 'a', color: '#f85149' },
      { dir: crystAx.b, label: 'b', color: '#3fb950' },
      { dir: crystAx.c, label: 'c', color: '#58a6ff' }
    ];
    for(const ax of axDefs) {
      const p = mulMV(viewMat, ax.dir);
      const pm = mulMV(viewMat, [-ax.dir[0],-ax.dir[1],-ax.dir[2]]);
      const ex = cx + p[0]*scale*1.12, ey = cy - p[1]*scale*1.12;
      const sx = cx + pm[0]*scale*0.4, sy = cy - pm[1]*scale*0.4;
      ctx.save();
      ctx.strokeStyle = ax.color;
      ctx.lineWidth = p[2] > 0 ? 2 : 1;
      ctx.globalAlpha = p[2] > 0 ? 1.0 : 0.45;
      ctx.setLineDash(p[2] > 0 ? [] : [4,3]);
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
      if(p[2] > -0.95) {
        const dx = ex-sx, dy = ey-sy, ll = Math.sqrt(dx*dx+dy*dy);
        if(ll > 10) {
          const ndx=dx/ll, ndy=dy/ll;
          ctx.beginPath();
          ctx.moveTo(ex, ey);
          ctx.lineTo(ex - ndx*10 - ndy*5, ey - ndy*10 + ndx*5);
          ctx.lineTo(ex - ndx*10 + ndy*5, ey - ndy*10 - ndx*5);
          ctx.closePath();
          ctx.fillStyle = ax.color;
          ctx.fill();
        }
      }
      ctx.font = 'bold 26px "Courier New"';
      ctx.fillStyle = ax.color;
      ctx.globalAlpha = 1;
      ctx.fillText(ax.label, ex + p[0]*16 - 4, ey - p[1]*16 + 4);
      ctx.restore();
    }
  }

  // Points: orthographic projection. Filled = towards viewer (pv[2]>0). Open = away.
  // Comma inside = stereochemistry inverted by an improper operation.
  if(toggles.pts && orbitPoints.length > 0) {
    const pts = orbitPoints.map(op => {
      const pv = mulMV(viewMat, op.pos);
      // foreground = point is on the viewer's side of the projection plane
      const fore = pv[2] >= 0;
      return { px: cx + pv[0]*scale, py: cy - pv[1]*scale, z: pv[2], fore, inverted: op.inverted };
    });
    pts.sort((a,b) => a.z - b.z);

    const r = 10;
    for(const pt of pts) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(pt.px, pt.py, r, 0, 2*Math.PI);
      if(pt.fore) {
        // Filled: towards viewer
        ctx.fillStyle = '#58a6ff';
        ctx.strokeStyle = '#aad4ff';
        ctx.lineWidth = 1.5;
        ctx.fill();
        ctx.stroke();
      } else {
        // Open: away from viewer
        ctx.fillStyle = 'transparent';
        ctx.strokeStyle = '#58a6ff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.restore();

      // Comma centred inside circle: stereo inverted by improper operation
      if(pt.inverted) {
        ctx.save();
        ctx.font = 'bold 22px sans-serif';
        ctx.fillStyle = pt.fore ? '#0d1117' : '#58a6ff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(',', pt.px, pt.py - 5);
        ctx.restore();
      }
    }
  }
}

function draw() { drawScene(); drawGenPos(); }

// Mouse interaction
canvas.addEventListener('mousedown', e => {
  isDragging = true;
  lastMX = e.clientX; lastMY = e.clientY;
});
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('mousemove', e => {
  if(!isDragging) return;
  const dx = e.clientX - lastMX;
  const dy = e.clientY - lastMY;
  lastMX = e.clientX; lastMY = e.clientY;
  const sens = 0.008;
  const rotY = rotMat([0,1,0], dx * sens);
  const rotX = rotMat([1,0,0], dy * sens);
  viewMat = mulMM(rotX, mulMM(rotY, viewMat));
  draw();
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom *= (1 - e.deltaY * 0.001);
  zoom = Math.max(0.4, Math.min(2.5, zoom));
  draw();
}, { passive: false });

// Touch support
let lastTouches = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  lastTouches = e.touches;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if(e.touches.length === 1 && lastTouches && lastTouches.length === 1) {
    const dx = e.touches[0].clientX - lastTouches[0].clientX;
    const dy = e.touches[0].clientY - lastTouches[0].clientY;
    const sens = 0.01;
    const rotY = rotMat([0,1,0], dx*sens);
    const rotX = rotMat([1,0,0], dy*sens);
    viewMat = mulMM(rotX, mulMM(rotY, viewMat));
    draw();
  } else if(e.touches.length === 2 && lastTouches && lastTouches.length === 2) {
    const d1 = Math.hypot(lastTouches[0].clientX-lastTouches[1].clientX, lastTouches[0].clientY-lastTouches[1].clientY);
    const d2 = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    zoom *= d2/d1;
    zoom = Math.max(0.4, Math.min(2.5, zoom));
    draw();
  }
  lastTouches = e.touches;
}, { passive: false });

// Toolbar buttons
function animateTo(target, duration=400) {
  const start = viewMat.slice();
  const startTime = performance.now();
  function step(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    for(let i=0;i<9;i++) viewMat[i] = start[i]*(1-ease) + target[i]*ease;
    draw();
    if(t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// Build an orthonormal view matrix that looks along 'intoScreen',
// with 'screenUp' as the approximate up direction.
// Uses Gram-Schmidt to ensure the rows are orthonormal even when the
// crystal axes are non-orthogonal.
function viewAlong(intoScreen, screenUp) {
  const d = normalize(intoScreen);
  // screenRight = screenUp x d, then re-orthogonalise up = d x right
  const r = normalize([
    screenUp[1]*d[2] - screenUp[2]*d[1],
    screenUp[2]*d[0] - screenUp[0]*d[2],
    screenUp[0]*d[1] - screenUp[1]*d[0]
  ]);
  // Re-derive up so it is exactly perpendicular to both d and r
  const u = normalize([
    d[1]*r[2] - d[2]*r[1],
    d[2]*r[0] - d[0]*r[2],
    d[0]*r[1] - d[1]*r[0]
  ]);
  // View matrix rows: [screen-right, screen-up, into-screen]
  return [r[0],r[1],r[2], u[0],u[1],u[2], d[0],d[1],d[2]];
}

document.getElementById('btn-x').addEventListener('click', () => {
  const ax = getCrystalAxes(currentPG.system);
  animateTo(viewAlong(ax.a, ax.c));
});
document.getElementById('btn-y').addEventListener('click', () => {
  const ax = getCrystalAxes(currentPG.system);
  animateTo(viewAlong(ax.b, ax.c));
});
document.getElementById('btn-z').addEventListener('click', () => {
  const ax = getCrystalAxes(currentPG.system);
  animateTo(viewAlong(ax.c, ax.b));
});
document.getElementById('btn-reset').addEventListener('click', () => {
  animateTo(defaultView(currentPG.system));
  zoom = 1.0;
});

// Global canvas coords for drawGenPos (written each frame by drawScene)
let cx_g = 0, cy_g = 0, scale_g = 1;

// Build general position coordinate strings from group element matrices
function genPosStrings(elements) {
  const ax = ['x','y','z'];
  const s3o2 = Math.sqrt(3)/2; // 0.8660...
  return elements.map(m => {
    const parts = [0,1,2].map(row => {
      let terms = [];
      [0,1,2].forEach(col => {
        const v = m[row*3+col];
        if(Math.abs(v) < 0.02) return;
        const neg = v < 0;
        const av = Math.abs(v);
        let coeff = '';
        if     (Math.abs(av-1.0)  < 0.02) coeff = '';
        else if(Math.abs(av-0.5)  < 0.02) coeff = '½';
        else if(Math.abs(av-1/3)  < 0.02) coeff = '⅓';
        else if(Math.abs(av-2/3)  < 0.02) coeff = '⅔';
        else if(Math.abs(av-3/4)  < 0.02) coeff = '¾';
        else if(Math.abs(av-s3o2) < 0.02) coeff = '√3/2';
        else coeff = av.toFixed(3);
        const sign = neg ? '−' : (terms.length ? '+' : '');
        terms.push(sign + coeff + ax[col]);
      });
      return terms.length ? terms.join('') : '0';
    });
    return '(' + parts.join(', ') + ')';
  });
}

// Draw general position labels beside each orbit point
function drawGenPos() {
  if(!toggles.genpos || !orbitPoints.length) return;
  const strings = genPosStrings(groupElements);
  const pts = orbitPoints.map((op, idx) => {
    const pv = mulMV(viewMat, op.pos);
    return { px: cx_g + pv[0]*scale_g, py: cy_g - pv[1]*scale_g, z: pv[2], str: strings[idx]||'' };
  });
  pts.sort((a,b) => a.z - b.z);
  ctx.save();
  ctx.font = '11px "Courier New"';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for(const pt of pts) {
    ctx.fillStyle = '#e6edf3';
    ctx.fillText(pt.str, pt.px+17, pt.py);
  }
  ctx.restore();
}

// Toggle buttons
['axes','sym','pts','genpos'].forEach(key => {
  const btn = document.getElementById('tog-'+key);
  btn.addEventListener('click', () => {
    toggles[key] = !toggles[key];
    btn.classList.toggle('active', toggles[key]);
    draw();
  });
});

// Export PNG
document.getElementById('btn-export').addEventListener('click', () => {
  draw();
  const link = document.createElement('a');
  const safeName = currentPG.hm.replace(/̅/g,'bar').replace(/[/]/g,'-');
  link.download = safeName + '_' + currentPG.system + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

// Build sidebar
const pgList = document.getElementById('pg-list');

// Convert HM symbol plain text to HTML with CSS overlines on barred digits
// and italicised m's (crystallographic convention).
function hmToHtml(hm) {
  return hm
    .replace(/(\d)̅/g, '<span style="text-decoration:overline">$1</span>')
    .replace(/m/g, '<i>m</i>');
}

function buildList(filter) {
  pgList.innerHTML = '';
  const filtered = filter === 'all' ? POINT_GROUPS : POINT_GROUPS.filter(p => p.system === filter);
  for(const pg of filtered) {
    const item = document.createElement('div');
    item.className = 'pg-item' + (pg === currentPG ? ' selected' : '');
    item.innerHTML = `<span class="pg-symbol">${hmToHtml(pg.hm)}</span><span class="pg-name">${pg.name}</span><span class="pg-order">${pg.order}</span>`;
    item.addEventListener('click', () => {
      document.querySelectorAll('.pg-item').forEach(x => x.classList.remove('selected'));
      item.classList.add('selected');
      loadPG(pg);
    });
    pgList.appendChild(item);
  }
}

document.querySelectorAll('.sys-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sys-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    buildList(btn.dataset.sys);
  });
});

// Init
window.addEventListener('resize', resize);
resize();
buildList('all');
loadPG(POINT_GROUPS[0]);
// Select first item visually
setTimeout(() => {
  const first = pgList.querySelector('.pg-item');
  if(first) first.classList.add('selected');
}, 0);
</script>
